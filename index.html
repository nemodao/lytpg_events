; Living（家居用品）</div><div class="val"><code>none</code> = 没有分类的奖品（只出现在 <code>All</code> 选项中）</div></td><td>奖品列表 API 的 <code>category</code> 字段；不存在或为空时发送 <code>none</code>。</td></tr><tr><td><code>badge</code></td><td>string</td><td><code>hot</code></td><td><div class="vtext">奖品的标签，在详情页中显示在名称之前：</div><div class="val"><code>hot</code> = HOT 标签</div><div class="val"><code>new</code> = New 标签</div><div class="val"><code>none</code> = 没有标签</div></td><td>奖品列表 API 的 <code>badge</code> 字段；不存在时为 <code>none</code>。</td></tr><tr><td><code>price_range</code></td><td>string</td><td><code>50000+</code></td><td><div class="vtext">奖品价格（以 coin 计），按区间发送；不发送精确价格：</div><div class="val"><code>1-4999</code> = 低于 5,000 coin</div><div class="val"><code>5000-19999</code> = 5,000 至低于 20,000 coin</div><div class="val"><code>20000-49999</code> = 20,000 至低于 50,000 coin</div><div class="val"><code>50000+</code> = 50,000 coin 及以上</div><div class="vtext">区间分界点按样本数据设定（价格从 1,000 到 150,000 coin）；上线前需用真实价格重新确认。</div></td><td>根据奖品列表 API 的 <code>points</code> 字段（以 coin 计的价格）计算。</td></tr><tr><td><code>affordable</code></td><td>string</td><td><code>false</code></td><td><div class="vtext">余额是否足够兑换该奖品：</div><div class="val"><code>true</code> = 余额大于或等于价格</div><div class="val"><code>false</code> = 余额小于价格</div><div class="vtext">不对访客发送（其余额始终为 0，会使“coin 不足”的比例失真）。不发送精确余额或价格。</div></td><td>将余额（coin 概览 API 的 <code>available</code>）与奖品价格比较。<code>join_step</code> = <code>signup</code> 时不发送。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div></section><section class="panel" id="sending" role="tabpanel">
<h2>3. 发送方式</h2>
<p>所有事件都经过唯一的一个文件 <code>shared/tracking.js</code>。该文件将事件推入 <code>window.dataLayer</code>；Google Tag Manager 从中读取并转发。除此文件外，代码中没有任何地方触碰 <code>dataLayer</code>。</p>

<h3>3.1 事件的两种发送方式</h3>
<table>
  <tr><th style="width:22%">类型</th><th style="width:38%">挂载方式</th><th>适用场合</th></tr>
  <tr><td>点击按钮</td><td>按钮上的 <code>data-track</code> 属性，自有属性写成 <code>data-track-&lt;name&gt;</code>。由一个公共监听器读取这些属性</td><td>所有名称以 <code>_click</code> 结尾的事件以及其他点击类事件。新增需要统计的按钮时只需加属性，无需写代码</td></tr>
  <tr><td>看到</td><td>组件显示时在代码中调用 <code>trackView()</code></td><td>名称以 <code>_view</code> 结尾的事件。每次页面加载只发送一次</td></tr>
  <tr><td>其他情况</td><td>在代码中调用 <code>track()</code></td><td>依赖逻辑的事件，例如选择日期范围或教程的各个步骤</td></tr>
</table>
<p>挂在按钮上的示例：</p>
<pre class="hl">&lt;button data-track=<span class="str">"loyalty_reward_click"</span> data-track-position=<span class="str">"1"</span>&gt;Redeem&lt;/button&gt;</pre>
<p>在代码中调用的示例：</p>
<pre class="hl"><span class="kw">import</span> { track, trackView } <span class="kw">from</span> <span class="str">'./tracking.js'</span>;

<span class="cm">// Sent once per page load</span>
<span class="fn">trackView</span>(<span class="str">'loyalty_join_card_view'</span>, { step: <span class="str">'kyc'</span> });

<span class="cm">// Sent every time it is called</span>
<span class="fn">track</span>(<span class="str">'loyalty_tour_skip'</span>, { step: <span class="num">2</span> });</pre>
<p><code>dataLayer</code> 中的结果：</p>
<pre class="hl"><span class="cm">// One event in the dataLayer: its name, every event property cleared (undefined),</span>
<span class="cm">// the common properties, then its own properties. Every value is text.</span>
window.dataLayer.<span class="fn">push</span>({
  event: <span class="str">'loyalty_trade_click'</span>,
  source: undefined, <span class="kw">from</span>: undefined, tier: undefined, /* … every other event property … */
  page: <span class="str">'earn'</span>,
  theme: <span class="str">'light'</span>,
  has_task: <span class="str">'true'</span>,
  join_step: <span class="str">'none'</span>,
  credit_mode: <span class="str">'in-day'</span>,
  balance_range: <span class="str">'1000-4999'</span>,
  loyalty_tier: <span class="str">'vip'</span>,
  capped: <span class="str">'false'</span>
});</pre>

<h3 id="common">3.2 公共属性</h3>
<p>下面 11 个属性随每个事件一起发送。它们在页面打开时确定一次。</p>
<div class="scroll"><table><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup>
  <tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr>

ode> = Plan B：Redeem 按钮打开 webview 内的奖品商店（Reward Store），Checkout 尚未开放</div><div class="vtext">开关对所有客户都相同：比较这两个取值就是比较开启前后的两个阶段，而不是 A/B 测试。</div></td><td>来自 HSB 端的配置（<code>common.rewardStore</code>），不从 loyalty API 获取。</td></tr><tr><td><code>entry</code></td><td>string</td><td><code>home_redeem</code></td><td><div class="vtext">仅在 Reward Store 和奖品详情页：客户通过什么方式到达该页面：</div><div class="val"><code>home_redeem</code> = Home 上的 <code>Redeem</code> 按钮</div><div class="val"><code>home_explore</code> = Home 上的 <code>Explore all rewards</code> 按钮</div><div class="val"><code>home_reward</code> = Home 上的一张奖品卡片（直接到达奖品详情页）</div><div class="val"><code>coins_redeem</code> = Coins 上的 <code>Redeem</code> 按钮</div><div class="val"><code>orders_redeem</code> = 尚无订单时 Redemption history 上的 <code>Explore rewards</code> 按钮</div><div class="val"><code>store</code> = Reward Store 中的一个奖品（到达奖品详情页）</div><div class="val"><code>return</code> = 再次进入同一页面：从奖品详情页通过 Back 按钮返回、手机的返回键，或重新加载页面</div><div class="val"><code>direct</code> = 从外部链接打开</div><div class="vtext">统计进入商店的次数：<code>page</code> = <code>store</code> 且 <code>entry</code> 不等于 <code>return</code> 的 <code>loyalty_page_view</code>。</div></td><td>进入商店的链接带有参数 <code>via</code>；页面读取一次后就将其从地址中删除，因此再次打开时不再有 <code>via</code>，并记录为 <code>return</code>。</td></tr>

<h3>3.3 限制与注意事项</h3>
<ul>
  <li><b>GA4 的限制：</b>事件名和属性名最长 40 个字符，值最长 100 个字符，每个事件最多 25 个属性。当前所有事件都在限制之内。</li>
  <li><b>数据类型：</b>所有取值都以文字形式发送，包括 <code>"true"</code> 或 <code>"1"</code>，使 GA4 自定义维度不会混合类型。</li>
  <li><b>清除旧属性：</b>GTM 会保留每个属性的最后一个值。因此每次发送时，先将所有事件属性设为 <code>undefined</code>，再加上该事件自身的属性；否则不带 <code>source</code> 的事件会被读成前一个事件的 <code>source</code>。新增属性需加入 <code>shared/tracking.js</code> 中的 <code>PARAMS</code> 列表。</li>
  <li><b>自动检查：</b><code>node tools/check-tracking.mjs</code> 会打开页面、逐一点击，并报告与此列表不一致的事件。</li>
  <li><b>离开页面的按钮的事件：</b>导航栏、Home 上的卡片、<code>Skip tour</code> 和 <code>Finish tour</code> 会在跳转前推送事件。</li>
  <li><b>尚未接入 GTM 时：</b>页面仍正常运行；事件只是停留在 <code>dataLayer</code> 中等待。</li>
</ul>

<h3>3.4 GTM 和 GA4 的配置</h3>
<table>
  <tr><th style="width:8%">步骤</th><th>需要做的事</th></tr>
  <tr><td>1</td><td>在 GTM 中创建一个 Custom Event 类型的触发器，开启正则匹配，事件名称为 <code>^loyalty_</code></td></tr>
  <tr><td>2</td><td>创建一个使用该触发器的 GA4 Event 代码，事件名称为 <code>{{Event}}</code></td></tr>
  <tr><td>3</td><td>为每个属性创建 Data Layer Variable 并作为事件参数加入 tag；<code>loyalty_tier</code> 则加入 tag 的 User Properties</td></tr>
  <tr><td>4</td><td>在 GA4 中，<b>上线前</b>将需要用来拆分报告的属性注册为自定义维度（GA4 不会应用到已收集的数据）：公共属性和事件属性按事件范围注册，<code>loyalty_tier</code> 按用户范围注册</td></tr>
  <tr><td>5</td><td>在 GA4 中：将数据保留期设为 14 个月；在网站数据流的增强型衡量中关闭“Page changes based on browser history events”（教程会更改页面地址而不加载新页面）；将 <code>loyalty_kyc_click</code>、<code>loyalty_deposit_click</code>、<code>loyalty_signup_click</code>、<code>loyalty_trade_click</code>、<code>loyalty_redeem_click</code> 标记为关键事件</td></tr>
  <tr><td>6</td><td>将同样的事件转发到 CleverTap。<span class="pending">PENDING</span></td></tr>
</table>

<h1>HSB Loyalty Program – Event tracking phía front-end</h1>
<p class="sub">Các event mà giao diện chương trình HSB Loyalty gửi đi. Cập nhật: 2026-10-23.</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. Tổng quan</button><button type="button" role="tab" data-tab="events" aria-selected="false">2. Chi tiết event</button><button type="button" role="tab" data-tab="sending" aria-selected="false">3. Cách gửi</button><button type="button" role="tab" data-tab="changelog" aria-selected="false">4. Lịch sử thay đổi</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>1. Tổng quan</h2>
<p>Tài liệu này lưu toàn bộ event tracking mà giao diện của chương trình HSB Loyalty gửi đi: mỗi event là gì, gửi lúc nào, ở màn hình nào, và mang những thuộc tính gì. Người đọc là developer front-end, người làm data và marketing, và người QA. Tài liệu chỉ nói về event; kế hoạch tin nhắn và logic backend nằm ở <a href="https://nemodao.github.io/lytpg_clevertap/" class="ext" target="_blank" rel="noopener">tài liệu thông báo qua CleverTap</a>.</p>
<p>Chương trình có bốn trang chạy trong webview của app: <b>Home</b>, <b>Earn</b>, <b>Coins</b> và <b>Redemption history</b> (lịch sử đổi quà, mở từ Coins). Khách chưa đăng nhập cũng xem được các trang này. Khi bật Plan B (<code>redeem_mode</code> = <code>store</code>), có thêm cửa hàng quà <b>Reward Store</b> (hai tab Home Store và Categories) và trang chi tiết từng món quà, chạy trong cùng webview thay cho cửa hàng Tada; Checkout chưa hoạt động (nhóm H). Hiện có 38 event và 11 thuộc tính chung.</p>
<h3>Quy ước</h3>
<ul>
  <li><b>Tên event:</b> tiếng Anh, kiểu <code>snake_case</code>, theo mẫu <code>loyalty_&lt;object&gt;_&lt;action&gt;</code>. Hành động là <code>view</code> (khách nhìn thấy), <code>click</code> (khách bấm), hoặc một động từ cụ thể như <code>start</code>, <code>apply</code>.</li>
  <li><b>Tên thuộc tính:</b> tiếng Anh, kiểu <code>snake_case</code>.</li>
  <li><b>Định danh khách:</b> bằng <code>client_id</code>. Khi khách đã đăng nhập, mọi event gửi kèm <code>client_id</code> (đọc từ token của app); khách chưa đăng nhập không có. Google Tag Manager cũng gắn nó thành user property <code>client_id</code> lúc khách đăng nhập.</li>
  <li><b>Không bao giờ gửi:</b> số tài khoản giao dịch, số dư chính xác, tên hay thông tin cá nhân của khách. Số dư chỉ được gửi theo khoảng.</li>
  <li><b>Event dạng "nhìn thấy"</b> chỉ gửi một lần cho mỗi lần tải trang, dù trang vẽ lại nhiều lần.</li>
</ul>

  <tr><td>2</td><td>Google Tag Manager (GTM)</td><td>Nhận mọi event có tên bắt đầu bằng <code>loyalty_</code> và gắn user property <code>client_id</code></td></tr>

<h3>Danh sách event</h3>
<p>Bấm vào tên event để xem chi tiết.</p>

<h2>2. Chi tiết từng event</h2>
<p>38 event, chia thành 8 nhóm theo câu hỏi phân tích mà chúng trả lời. Mỗi event là một khối: dòng tên, phần mô tả, rồi bảng thuộc tính riêng của event đó.</p>
<p><a href="#grp-0" class="ref">A. Từ đăng ký tới giao dịch</a> · <a href="#grp-1" class="ref">B. Quan tâm tới quà</a> · <a href="#grp-2" class="ref">C. Sử dụng các trang</a> · <a href="#grp-3" class="ref">D. Tour hướng dẫn</a> · <a href="#grp-4" class="ref">E. Khách vãng lai</a> · <a href="#grp-5" class="ref">F. Lịch sử đổi quà</a> · <a href="#grp-6" class="ref">G. Sự cố</a> · <a href="#grp-7" class="ref">H. Cửa hàng quà (Plan B)</a></p><h3 id="grp-0">A. Từ đăng ký tới giao dịch</h3><p>Trả lời câu hỏi: khách có đi hết phễu từ lời mời tới KYC, nạp tiền và giao dịch không.</p><div class="scroll evblock" id="ev-loyalty_join_card_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_join_card_view</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Redemption history · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách nhìn thấy lời mời bắt đầu: khung "How to start" (các bước phải làm trước khi được tính coin) hoặc thẻ "Your coins will show up here" ở Coins. Hiện với khách có trading task nhưng chưa KYC hoặc chưa nạp tiền lần đầu (<code>join_step</code> = <code>kyc</code>, <code>deposit</code>), và với khách vãng lai (<code>join_step</code> = <code>signup</code>).</dd><dt>Thời điểm bắn</dt><dd>Khi khung hiện ra. Khung ở Earn và thẻ đăng ký ở Coins: mỗi lần tải trang chỉ gửi một lần. Bảng mời ("Start earning to redeem", hoặc "Join to redeem rewards" với khách vãng lai): gửi mỗi lần bảng mở.</dd><dt>Vị trí</dt><dd>Thẻ Today ở Earn; thẻ "Your coins will show up here" ở Coins (khách vãng lai); bảng mời mở ra khi khách bấm <code>Redeem</code>, một ô quà, <code>Explore all rewards</code>, <code>Explore rewards</code> ở Redemption history chưa có đơn, hoặc (khách vãng lai) thẻ số dư hay <code>Redemption history</code>, ở Home, Coins và Redemption history. Bảng mời có tiêu đề "Start earning to redeem" (khách vãng lai: "Join to redeem rewards"); thuộc tính <code>source</code> = <code>redeem</code>, <code>from</code> = nút đã mở bảng.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Mẫu số của phễu KYC và nạp tiền: có bao nhiêu khách đã thấy lời mời.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Gọi <code>trackView()</code> trong code (bảng mời: <code>track()</code>, mỗi lần mở), ở <code>shared/components.js</code>, hàm <code>joinPanel</code> và <code>mountJoinSheet</code>; <code>pages/point-balance.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>source</code></td><td>string</td><td><code>redeem</code></td><td><div class="val"><code>card</code> = khung "How to start" trên thẻ Today ở Earn, hoặc thẻ "Your coins will show up here" ở Coins (khách vãng lai)</div><div class="val"><code>redeem</code> = bảng mời ("Start earning to redeem"; khách vãng lai: "Join to redeem rewards"), mở từ nút ghi trong <code>from</code></div></td><td>Gắn cố định theo nơi hiện khung.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">Nút đã mở bảng:</div><div class="val"><code>redeem</code> = nút <code>Redeem</code> trên thẻ số dư (Home, Coins) hoặc <code>Explore rewards</code> ở Redemption history chưa có đơn</div><div class="val"><code>balance</code> = thẻ số dư ở Home (chỉ khách vãng lai)</div><div class="val"><code>reward</code> = một ô quà trong lưới quà ở Home</div><div class="val"><code>explore</code> = nút <code>Explore all rewards</code> ở Home</div><div class="val"><code>history</code> = link <code>Redemption history</code> ở Coins (chỉ khách vãng lai)</div><div class="vtext">Chỉ có khi <code>source</code> = <code>redeem</code>.</div></td><td>Nút vừa bấm để mở bảng.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_kyc_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_kyc_click</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Redemption history · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm nút <code>Verify my account</code> để đi xác minh tài khoản (KYC).</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút.</dd><dt>Vị trí</dt><dd>Nút chính trên khung "How to start" (ở Earn hoặc trong bảng "Start earning to redeem" ở Home, Coins và Redemption history), khi khách chưa KYC.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Tỷ lệ khách thấy lời mời rồi đi KYC.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>shared/components.js</code>, hàm <code>joinPanel</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>source</code></td><td>string</td><td><code>redeem</code></td><td><div class="vtext">Nơi bấm:</div><div class="val"><code>card</code> = khung "How to start" ở Earn</div><div class="val"><code>redeem</code> = bảng "Start earning to redeem", mở từ nút ghi trong <code>from</code></div></td><td>Gắn cố định theo nơi hiện nút.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">Nút đã mở bảng:</div><div class="val"><code>redeem</code> = nút <code>Redeem</code> trên thẻ số dư (Home, Coins) hoặc <code>Explore rewards</code> ở Redemption history chưa có đơn</div><div class="val"><code>balance</code> = thẻ số dư ở Home (chỉ khách vãng lai)</div><div class="val"><code>reward</code> = một ô quà trong lưới quà ở Home</div><div class="val"><code>explore</code> = nút <code>Explore all rewards</code> ở Home</div><div class="val"><code>history</code> = link <code>Redemption history</code> ở Coins (chỉ khách vãng lai)</div><div class="vtext">Chỉ có khi <code>source</code> = <code>redeem</code>.</div></td><td>Như ở <code>loyalty_join_card_view</code>.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_deposit_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_deposit_click</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Redemption history · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm nút <code>Deposit now</code> để đi nạp tiền: nạp lần đầu, hoặc nạp thêm để lên hạng tài khoản.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút.</dd><dt>Vị trí</dt><dd>Nút chính trên khung "How to start" (ở Earn hoặc trong bảng "Start earning to redeem" ở Home, Coins và Redemption history), khi khách đã KYC nhưng chưa nạp tiền. Nút <code>Deposit now</code> trong bảng hạng tài khoản ở Earn (thuộc tính <code>source</code> = <code>upgrade</code>).</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Tỷ lệ khách thấy lời mời rồi đi nạp tiền.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>shared/components.js</code>, hàm <code>joinPanel</code>; <code>pages/trading-task.js</code> (bảng hạng)</dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="vtext">Nơi bấm:</div><div class="val"><code>card</code> = khung "How to start" ở Earn</div><div class="val"><code>redeem</code> = bảng "Start earning to redeem", mở từ nút ghi trong <code>from</code></div><div class="val"><code>upgrade</code> = nút <code>Deposit now</code> trong bảng hạng tài khoản ở Earn</div></td><td>Gắn cố định trên nút.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>redeem</code></td><td><div class="vtext">Nút đã mở bảng:</div><div class="val"><code>redeem</code> = nút <code>Redeem</code> trên thẻ số dư (Home, Coins) hoặc <code>Explore rewards</code> ở Redemption history chưa có đơn</div><div class="val"><code>balance</code> = thẻ số dư ở Home (chỉ khách vãng lai)</div><div class="val"><code>reward</code> = một ô quà trong lưới quà ở Home</div><div class="val"><code>explore</code> = nút <code>Explore all rewards</code> ở Home</div><div class="val"><code>history</code> = link <code>Redemption history</code> ở Coins (chỉ khách vãng lai)</div><div class="vtext">Chỉ có khi <code>source</code> = <code>redeem</code>.</div></td><td>Như ở <code>loyalty_join_card_view</code>.</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">Chỉ khi <code>source</code> = <code>upgrade</code>: hạng hiện tại của tài khoản:</div><div class="val"><code>micro</code>, <code>standard</code> hoặc <code>vip</code> = nghĩa như ở <code>loyalty_upgrade_open</code>; tài khoản Platinum không có nút này</div></td><td>Từ nhóm MT5 của tài khoản.</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>platinum</code></td><td><div class="vtext">Chỉ khi <code>source</code> = <code>upgrade</code>: hạng kế tiếp:</div><div class="val"><code>standard</code>, <code>vip</code> hoặc <code>platinum</code></div></td><td>Hạng đứng sau trong bậc thang 4 hạng.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_open_account_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_open_account_click</code> <span class="evmeta">Màn hình: Earn · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách đã KYC và đã nạp tiền nhưng chưa có tài khoản giao dịch thật, và bấm nút <code>Open a trading account</code>.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút.</dd><dt>Vị trí</dt><dd>Nút trên thẻ Trading account ở Earn.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Đếm số khách bị chặn ở bước mở tài khoản giao dịch.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td colspan="5" class="none">Không có thuộc tính riêng.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_trade_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_trade_click</code> <span class="evmeta">Màn hình: Earn · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm nút đi giao dịch: <code>Trade with account …</code> ở Earn (khi hôm nay đã đạt mức coin tối đa, nút ghi <code>Trade now</code>), hoặc nút ở đáy bảng hạng tài khoản khi tài khoản đã ở hạng Platinum.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút.</dd><dt>Vị trí</dt><dd>Nút trên thẻ Trading account ở Earn; nút ở đáy bảng hạng tài khoản (thuộc tính <code>source</code> = <code>upgrade</code>).</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Đo việc các trang có đưa khách đi giao dịch không, và bao nhiêu lần bắt đầu từ bảng hạng.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>capped</code></td><td>string</td><td><code>false</code></td><td>Hôm nay khách đã đạt mức coin tối đa hay chưa: <code>true</code> hoặc <code>false</code>.</td><td>Trường <code>today.capped</code> của API trading task.</td></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="val"><code>upgrade</code> = nút ở đáy bảng hạng tài khoản (chỉ khi tài khoản ở hạng Platinum)</div><div class="vtext">Không có khi bấm nút trên thẻ Trading account.</div></td><td>Gắn cố định trên nút.</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>platinum</code></td><td>Chỉ khi <code>source</code> = <code>upgrade</code>: hạng của tài khoản (luôn là <code>platinum</code>).</td><td>Từ nhóm MT5 của tài khoản.</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>none</code></td><td>Chỉ khi <code>source</code> = <code>upgrade</code>: luôn là <code>none</code>.</td><td>Gắn cố định trên nút.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><h3 id="grp-1">B. Quan tâm tới quà</h3><p>Trả lời câu hỏi: khách có quan tâm tới đổi quà không, và ở mức số dư nào.</p><div class="scroll evblock" id="ev-loyalty_redeem_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_redeem_click</code> <span class="evmeta">Màn hình: Home, Coins, Redemption history · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm nút <code>Redeem</code> trên thẻ số dư hoặc nút <code>Explore rewards</code> ở Redemption history (khi chưa có đơn nào) để sang cửa hàng đổi quà. Với khách chưa đăng nhập, hoặc có trading task nhưng chưa KYC hay chưa nạp tiền lần đầu, nút mở bảng mời thay vì sang cửa hàng; event vẫn được gửi. Khi bật Plan B (<code>redeem_mode</code> = <code>store</code>), nút mở cửa hàng quà trong webview (Reward Store) cho mọi khách, không mở bảng mời.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút.</dd><dt>Vị trí</dt><dd>Thẻ số dư coin ở Home và ở Coins. Nút <code>Explore rewards</code> ở trang Redemption history khi danh sách đơn còn trống.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Mức quan tâm tới đổi quà, chia theo <code>balance_range</code>.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>shared/components.js</code>, hàm <code>balanceBlock</code>; <code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td colspan="5" class="none">Không có thuộc tính riêng.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_rewards_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_rewards_view</code> <span class="evmeta">Màn hình: Home · Từ bản: Handoff 6</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách nhìn thấy lưới quà ở Home.</dd><dt>Thời điểm bắn</dt><dd>Khi ô đầu tiên của lưới hiện ít nhất một nửa trên màn hình; mỗi lần tải trang chỉ gửi một lần. Không có quà nào (danh sách quà trống hoặc lỗi): gửi ngay, với <code>reward_count</code> = <code>0</code>.</dd><dt>Vị trí</dt><dd>Lưới quà dưới "Redeem coins for rewards" ở Home.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Mẫu số của lượt bấm quà: tỷ lệ bấm theo vị trí và theo món; biết khi nào danh sách quà trống.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Gọi <code>trackView()</code> trong code, ở <code>pages/dashboard.js</code>, hàm <code>watchRewards</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>9</code></td><td><div class="vtext">Số món quà trong lưới (không tính ô <code>Earn more coins</code>): từ <code>0</code> tới <code>9</code> khi lưới có ô <code>Earn more coins</code>, tới <code>10</code> khi không có.</div><div class="val"><code>0</code> = không có quà (danh sách trống hoặc lỗi)</div></td><td>Số quà được hiển thị.</td></tr><tr><td><code>has_earn_card</code></td><td>string</td><td><code>true</code></td><td>Lưới có ô <code>Earn more coins</code> (ô mở trang Earn) không: <code>true</code> hoặc <code>false</code>.</td><td><code>true</code> khi khách có trading task, chương trình chưa kết thúc và lưới có ít nhất một món quà; còn lại <code>false</code>.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_reward_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_reward_click</code> <span class="evmeta">Màn hình: Home, Reward Store · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm một món quà: một ô trong lưới quà ở Home, hoặc một món trong cửa hàng quà Reward Store (thẻ ở mục Popular, phiếu ở mục F&amp;B, thẻ ở mục Tour &amp; Travel, thẻ trong danh sách ở tab Categories). Thuộc tính <code>section</code> cho biết món quà được bấm ở đâu.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm; ở Home cả khi ô quà mở bảng mời thay vì sang cửa hàng. Khi bật Plan B, ô quà ở Home mở thẳng trang chi tiết của món quà.</dd><dt>Vị trí</dt><dd>Lưới quà dưới "Redeem coins for rewards" ở Home (tối đa 10 ô); các mục và danh sách quà của Reward Store.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Biết món quà, danh mục, mức giá và vị trí nào được bấm nhiều; là bước đầu của phễu bấm quà → xem chi tiết → Checkout.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>pages/dashboard.js</code>, <code>pages/store.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>position</code></td><td>string</td><td><code>1</code></td><td><div class="vtext">Thứ hạng của món quà trong chỗ nó được bấm (<code>section</code>), đếm từ <code>1</code>:</div><div class="vtext">Home: từ <code>1</code> tới <code>9</code> (tới <code>10</code> khi không có ô <code>Earn more coins</code>); ô <code>Earn more coins</code> không được đếm</div><div class="vtext">Popular: <code>1</code> tới <code>8</code>; F&amp;B và Tour &amp; Travel: <code>1</code> tới <code>4</code></div><div class="vtext">Danh sách ở tab Categories: thứ tự trong danh sách đang lọc (tới khoảng <code>50</code> với chip All)</div></td><td>Thứ tự của thẻ quà trong lưới, mục hoặc danh sách đang hiện.</td></tr><tr><td><code>reward_id</code></td><td>string</td><td><code>101</code></td><td>Mã của món quà.</td><td>Trường <code>id</code> của API danh sách quà (<code>/pointSys/app/point/catalog</code>).</td></tr><tr><td><code>reward_name</code></td><td>string</td><td><code>AirPods Pro 2</code></td><td>Tên món quà, đúng như HSB gửi (cắt ở 100 ký tự).</td><td>Trường <code>name</code> của API danh sách quà.</td></tr><tr><td><code>affordable</code></td><td>string</td><td><code>true</code></td><td><div class="vtext">Số dư có đủ đổi món quà không:</div><div class="val"><code>true</code> = số dư lớn hơn hoặc bằng giá</div><div class="val"><code>false</code> = số dư nhỏ hơn giá</div><div class="vtext">Không gửi với khách vãng lai (số dư của họ luôn là 0, sẽ làm sai tỷ lệ "không đủ coin"). Không gửi số dư hay giá chính xác.</div></td><td>So số dư (<code>available</code> của API tổng quan coin) với giá của món quà. Không gửi khi <code>join_step</code> = <code>signup</code>.</td></tr><tr><td><code>section</code></td><td>string</td><td><code>popular</code></td><td><div class="vtext">Nơi món quà được bấm:</div><div class="val"><code>home</code> = lưới quà ở Home</div><div class="val"><code>popular</code> = mục Popular Rewards ở tab Home Store</div><div class="val"><code>fnb</code> = mục F&amp;B e-Vouchers ở tab Home Store</div><div class="val"><code>travel</code> = mục Tour &amp; Travel ở tab Home Store</div><div class="val"><code>list</code> = danh sách quà ở tab Categories (danh mục đang lọc nằm trong <code>filter</code>)</div></td><td>Gắn cố định theo chỗ hiện thẻ quà.</td></tr><tr><td><code>filter</code></td><td>string</td><td><code>fnb_voucher</code></td><td><div class="vtext">Chỉ có khi <code>section</code> = <code>list</code>: chip danh mục đang chọn ở tab Categories khi khách bấm:</div><div class="val"><code>all</code> = chip All (mọi món quà)</div><div class="val"><code>gadget_electronics</code>, <code>tour_travel</code>, <code>shopping_voucher</code>, <code>fnb_voucher</code>, <code>home_living</code> = chip của danh mục đó (nghĩa như ở <code>category</code>)</div></td><td>Chip đang chọn lúc khách bấm.</td></tr><tr><td><code>category</code></td><td>string</td><td><code>fnb_voucher</code></td><td><div class="vtext">Danh mục của món quà:</div><div class="val"><code>gadget_electronics</code> = Gadget &amp; Electronics (đồ công nghệ)</div><div class="val"><code>tour_travel</code> = Tour &amp; Travel (du lịch)</div><div class="val"><code>shopping_voucher</code> = Shopping e-Voucher (phiếu mua sắm)</div><div class="val"><code>fnb_voucher</code> = F&amp;B e-Voucher (phiếu ăn uống)</div><div class="val"><code>home_living</code> = Home &amp; Living (đồ gia dụng)</div><div class="val"><code>none</code> = món quà không có danh mục (chỉ hiện ở chip <code>All</code>)</div></td><td>Trường <code>category</code> của API danh sách quà; không có hoặc rỗng thì gửi <code>none</code>.</td></tr><tr><td><code>badge</code></td><td>string</td><td><code>hot</code></td><td><div class="vtext">Nhãn khách nhìn thấy trên thẻ quà vừa bấm:</div><div class="val"><code>hot</code> = nhãn HOT</div><div class="val"><code>new</code> = nhãn New</div><div class="val"><code>none</code> = không có nhãn. Thẻ phiếu F&amp;B, thẻ Tour &amp; Travel và lưới quà ở Home không hiện nhãn, nên luôn gửi <code>none</code>, kể cả khi món quà có nhãn trong dữ liệu</div><div class="vtext">Ở mục Popular, quà <code>hot</code> được xếp lên đầu, nên khi đọc tác dụng của nhãn cần xét cùng <code>position</code>.</div></td><td>Thẻ phiếu F&amp;B, thẻ Tour &amp; Travel, lưới quà Home: luôn <code>none</code>. Thẻ vuông (Popular, danh sách ở tab Categories): trường <code>badge</code> của API danh sách quà (<code>hot</code>, <code>new</code>, không có thì <code>none</code>).</td></tr><tr><td><code>price_range</code></td><td>string</td><td><code>1-4999</code></td><td><div class="vtext">Giá của món quà (bằng coin), theo khoảng; không gửi giá chính xác:</div><div class="val"><code>1-4999</code> = dưới 5,000 coin</div><div class="val"><code>5000-19999</code> = từ 5,000 tới dưới 20,000 coin</div><div class="val"><code>20000-49999</code> = từ 20,000 tới dưới 50,000 coin</div><div class="val"><code>50000+</code> = từ 50,000 coin trở lên</div><div class="vtext">Mốc chia đặt theo dữ liệu mẫu (giá từ 1,000 tới 150,000 coin); cần xác nhận lại với giá thật trước khi chạy.</div></td><td>Tính từ trường <code>points</code> (giá bằng coin) của API danh sách quà.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_expiring_notice_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_expiring_notice_view</code> <span class="evmeta">Màn hình: Home, Coins · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách nhìn thấy cảnh báo có coin sẽ hết hạn trong 10 ngày tới.</dd><dt>Thời điểm bắn</dt><dd>Khi trang vẽ thông báo ra (không đo khách có cuộn tới hay không); mỗi lần tải trang chỉ gửi một lần.</dd><dt>Vị trí</dt><dd>Dòng cảnh báo màu đỏ dưới số dư, trong thẻ số dư.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Xem cảnh báo hết hạn có thúc khách đổi quà không.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Gọi <code>trackView()</code> trong code, ở <code>shared/components.js</code>, hàm <code>balanceBlock</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td colspan="5" class="none">Không có thuộc tính riêng.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><h3 id="grp-2">C. Sử dụng các trang</h3><p>Trả lời câu hỏi: khách dùng những trang và phần nào của chương trình.</p><div class="scroll evblock" id="ev-loyalty_page_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_page_view</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Redemption history, Reward Store · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách mở một trang: một trang của chương trình, hoặc một trang của cửa hàng quà Reward Store (<code>page</code> = <code>store</code> hoặc <code>reward</code>).</dd><dt>Thời điểm bắn</dt><dd>Ngay khi trang có dữ liệu để hiển thị; mỗi lần tải trang chỉ gửi một lần. Vẫn gửi khi trang hiện thẻ "Couldn’t load this page". Khi API thật lỗi lúc mở trang, trang không hiện thẻ lỗi và không gửi event này (spec §54). Trang cửa hàng gửi lại event mỗi lần khách quay về từ trang chi tiết quà (nút Back tải lại trang): đếm lượt vào cửa hàng bằng <code>entry</code> khác <code>return</code>.</dd><dt>Vị trí</dt><dd>Mọi trang; phân biệt bằng thuộc tính chung <code>page</code>. Trang chi tiết quà gửi kèm thông tin món quà.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Lượt xem từng trang; là mẫu số cho các tỷ lệ khác; biết khách đã từng mở chương trình hay chưa.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Gọi <code>track()</code> trong code, ở <code>shared/tracking.js</code>, hàm <code>initTracking</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>reward_id</code></td><td>string</td><td><code>101</code></td><td>Mã của món quà. Chỉ ở trang chi tiết quà (<code>page</code> = <code>reward</code>); có cả khi món quà không tìm thấy.</td><td>Trường <code>id</code> của API danh sách quà (<code>/pointSys/app/point/catalog</code>). Trên trang: tham số <code>id</code> của địa chỉ.</td></tr><tr><td><code>reward_name</code></td><td>string</td><td><code>iPhone 16 Pro</code></td><td>Tên món quà, đúng như HSB gửi (cắt ở 100 ký tự). Tên có thể bị sửa, nên báo cáo theo <code>reward_id</code> và dùng tên làm nhãn. Chỉ ở trang chi tiết quà, khi tìm thấy món quà.</td><td>Trường <code>name</code> của API danh sách quà.</td></tr><tr><td><code>category</code></td><td>string</td><td><code>gadget_electronics</code></td><td><div class="vtext">Danh mục của món quà:</div><div class="val"><code>gadget_electronics</code> = Gadget &amp; Electronics (đồ công nghệ)</div><div class="val"><code>tour_travel</code> = Tour &amp; Travel (du lịch)</div><div class="val"><code>shopping_voucher</code> = Shopping e-Voucher (phiếu mua sắm)</div><div class="val"><code>fnb_voucher</code> = F&amp;B e-Voucher (phiếu ăn uống)</div><div class="val"><code>home_living</code> = Home &amp; Living (đồ gia dụng)</div><div class="val"><code>none</code> = món quà không có danh mục (chỉ hiện ở chip <code>All</code>)</div><div class="vtext">Chỉ ở trang chi tiết quà.</div></td><td>Trường <code>category</code> của API danh sách quà; không có hoặc rỗng thì gửi <code>none</code>.</td></tr><tr><td><code>badge</code></td><td>string</td><td><code>hot</code></td><td><div class="vtext">Nhãn của món quà, hiện trước tên ở trang chi tiết:</div><div class="val"><code>hot</code> = nhãn HOT</div><div class="val"><code>new</code> = nhãn New</div><div class="val"><code>none</code> = không có nhãn</div><div class="vtext">Chỉ ở trang chi tiết quà.</div></td><td>Trường <code>badge</code> của API danh sách quà; không có thì <code>none</code>.</td></tr><tr><td><code>price_range</code></td><td>string</td><td><code>50000+</code></td><td><div class="vtext">Giá của món quà (bằng coin), theo khoảng; không gửi giá chính xác:</div><div class="val"><code>1-4999</code> = dưới 5,000 coin</div><div class="val"><code>5000-19999</code> = từ 5,000 tới dưới 20,000 coin</div><div class="val"><code>20000-49999</code> = từ 20,000 tới dưới 50,000 coin</div><div class="val"><code>50000+</code> = từ 50,000 coin trở lên</div><div class="vtext">Mốc chia đặt theo dữ liệu mẫu (giá từ 1,000 tới 150,000 coin); cần xác nhận lại với giá thật trước khi chạy.</div><div class="vtext">Chỉ ở trang chi tiết quà.</div></td><td>Tính từ trường <code>points</code> (giá bằng coin) của API danh sách quà.</td></tr><tr><td><code>affordable</code></td><td>string</td><td><code>false</code></td><td><div class="vtext">Số dư có đủ đổi món quà không:</div><div class="val"><code>true</code> = số dư lớn hơn hoặc bằng giá</div><div class="val"><code>false</code> = số dư nhỏ hơn giá</div><div class="vtext">Không gửi với khách vãng lai (số dư của họ luôn là 0, sẽ làm sai tỷ lệ "không đủ coin"). Không gửi số dư hay giá chính xác.</div><div class="vtext">Chỉ ở trang chi tiết quà.</div></td><td>So số dư (<code>available</code> của API tổng quan coin) với giá của món quà. Không gửi khi <code>join_step</code> = <code>signup</code>.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_nav_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_nav_click</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Reward Store · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm một tab ở thanh điều hướng dưới, hoặc bấm nút X để thoát chương trình. Ở Reward Store: bấm tab Home Store hoặc Categories ở thanh dưới của cửa hàng, nút Back ở thanh đó, hoặc nút Back ở đầu trang chi tiết quà.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm. Ở thanh dưới của Reward Store, chỉ gửi khi tab thật sự đổi (bấm tab đang mở không gửi).</dd><dt>Vị trí</dt><dd>Thanh điều hướng nổi ở đáy màn hình; thanh dưới của Reward Store; nút Back ở đầu trang chi tiết quà.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Đường đi của khách giữa các trang; số lần thoát. Nút Back chỉ đếm Back trong trang: nút back của app hay điện thoại không được ghi, nên không dùng làm tỷ lệ thoát.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>shared/nav.js</code>; <code>pages/store.js</code>, hàm <code>storeHead</code> trong <code>shared/store.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>target</code></td><td>string</td><td><code>earn</code></td><td><div class="vtext">Nơi khách bấm tới:</div><div class="val"><code>home</code> = tab Home</div><div class="val"><code>earn</code> = tab Earn (không có khi khách không có trading task)</div><div class="val"><code>coins</code> = tab Coins</div><div class="val"><code>exit</code> = nút X, rời chương trình về app</div><div class="val"><code>store_home</code> = tab Home Store ở thanh dưới của Reward Store</div><div class="val"><code>categories</code> = tab Categories ở thanh dưới của Reward Store</div><div class="val"><code>back</code> = nút Back ở thanh dưới của Reward Store, hoặc nút Back ở đầu trang chi tiết quà (<code>page</code> cho biết nút nào)</div><div class="vtext">Ở thanh điều hướng của chương trình, bấm tab của trang đang mở vẫn gửi; ở thanh của Reward Store thì không.</div></td><td>Gắn cố định theo từng nút.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_card_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_card_click</code> <span class="evmeta">Màn hình: Home · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Ở Home, khách bấm thẻ số dư để sang Coins, bấm ô <code>Earn more coins</code> trong lưới quà để sang Earn, hoặc bấm <code>Explore all rewards</code> để sang cửa hàng đổi quà. Với khách vãng lai, thẻ số dư mở bảng mời đăng ký; với khách chưa đăng nhập, chưa KYC hay chưa nạp tiền lần đầu, <code>Explore all rewards</code> mở bảng mời thay vì sang cửa hàng; event vẫn được gửi. Khi bật Plan B, <code>Explore all rewards</code> mở cửa hàng quà trong webview (Reward Store).</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm.</dd><dt>Vị trí</dt><dd>Thẻ số dư, ô <code>Earn more coins</code> và thẻ "Looking for something else?" (không có lưới quà: "Find rewards for your coins") ở Home.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Biết khách vào Earn, Coins và cửa hàng đổi quà từ đâu.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>shared/components.js</code>, <code>pages/dashboard.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>target</code></td><td>string</td><td><code>coins</code></td><td><div class="vtext">Trang đích:</div><div class="val"><code>coins</code> = bấm thẻ số dư</div><div class="val"><code>earn</code> = bấm ô <code>Earn more coins</code></div><div class="val"><code>rewards</code> = bấm <code>Explore all rewards</code></div></td><td>Gắn cố định theo từng thẻ.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_tab_click"><table class="events"><colgroup><col style="width:17%"><col style="width: chi tiết.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>item_type</code></td><td>string</td><td><code>egift</code></td><td><div class="vtext">Loại món quà:</div><div class="val"><code>egift</code> = e-voucher (mã, PIN hoặc link voucher)</div><div class="val"><code>physical</code> = quà hiện vật giao tận nơi</div><div class="val"><code>pln</code> = token điện PLN</div><div class="val"><code>pulsa</code> = nạp tiền điện thoại</div><div class="val"><code>ewallet</code> = nạp ví điện tử (ví dụ OVO, GoPay)</div><div class="val"><code>other</code> = mọi loại khác backend gửi</div></td><td>Trường <code>itemType</code> của món trong API chi tiết đơn (dữ liệu của Tada); loại không thuộc 5 loại trên gửi <code>other</code>.</td></tr><tr><td><code>status</code></td><td>string</td><td><code>completed</code></td><td>Trạng thái của đơn, như ở <code>loyalty_order_open</code>.</td><td>Trường <code>status</code> của API chi tiết đơn.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><h3 id="grp-6">G. Sự cố</h3><p>Trả lời câu hỏi: trang lỗi tải thường xuyên tới mức nào.</p><div class="scroll evblock" id="ev-loyalty_error_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_error_view</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Redemption history, Reward Store · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách gặp một phần không tải được: cả trang (thẻ "Couldn’t load this page"), một đơn đổi quà, phần tải thêm của danh sách ("Couldn't load more"), hoặc trang chi tiết của một món quà không có trong danh sách quà ("This reward is no longer available"); thuộc tính <code>error_scope</code> cho biết phần nào.</dd><dt>Thời điểm bắn</dt><dd>Khi thẻ "Couldn’t load this page" hiện ra (cả trang, hoặc một đơn ở Redemption history); mỗi lần tải trang chỉ gửi một lần. <code>more</code>: khi dòng "Couldn’t load more" hiện ra, ở Coins và Redemption history; cũng chỉ một lần mỗi lần tải trang.</dd><dt>Vị trí</dt><dd>Thay cho toàn bộ nội dung trang (<code>page</code>, <code>order</code>); dòng "Couldn’t load more. Try again" cuối danh sách (<code>more</code>, ở Coins và Redemption history).</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Tần suất lỗi tải, so với <code>loyalty_page_view</code>. Lưu ý: khi API thật lỗi lúc mở trang, trang không hiện thẻ lỗi và không gửi event nào (spec §54).</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Gọi <code>trackView()</code> trong code, ở <code>shared/components.js</code>, hàm <code>showStatus</code>; <code>pages/point-balance.js</code>, <code>pages/redemptions.js</code>, <code>pages/reward.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>error_scope</code></td><td>string</td><td><code>page</code></td><td><div class="vtext">Phần không tải được:</div><div class="val"><code>page</code> = cả trang (thẻ "Couldn’t load this page")</div><div class="val"><code>order</code> = một đơn ở trang chi tiết (không có đơn đó, không phải của khách, hoặc lỗi mạng)</div><div class="val"><code>more</code> = phần tải thêm ở cuối danh sách ("Couldn’t load more")</div><div class="val"><code>reward</code> = trang chi tiết của một món quà không có trong danh sách quà ("This reward is no longer available"); xem <code>reward_count</code></div></td><td>Gắn theo chỗ gặp lỗi.</td></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>0</code></td><td><div class="vtext">Chỉ có khi <code>error_scope</code> = <code>reward</code>: số món quà trong danh sách quà lúc đó.</div><div class="val"><code>0</code> = danh sách quà trống hoặc API danh sách quà lỗi</div><div class="vtext">lớn hơn <code>0</code> = món quà đã bị gỡ khỏi cửa hàng (hoặc link sai)</div></td><td>Số món quà API danh sách quà trả về.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_retry_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_retry_click</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Redemption history · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm thử tải lại sau khi gặp lỗi.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút <code>Try again</code> trên thẻ "Couldn’t load this page" (<code>error_scope</code> = <code>page</code> hoặc <code>order</code>).</dd><dt>Vị trí</dt><dd>Nút trên thẻ "Couldn’t load this page" (cả trang, hoặc một đơn). <code>Try again</code> ở dòng "Couldn’t load more" không gửi event này.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Biết khách có thử lại hay rời đi.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>shared/components.js</code>, hàm <code>showStatus</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td colspan="5" class="none">Không có thuộc tính riêng.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><h3 id="grp-7">H. Cửa hàng quà (Plan B)</h3><p>Trả lời câu hỏi: khi bật Plan B, khách vào cửa hàng quà từ đâu, xem gì, muốn đổi món nào, đủ hay thiếu coin, và cửa hàng có đẩy khách đi giao dịch, đi đăng ký không. Chỉ có khi `redeem_mode` = `store`.</p><div class="scroll evblock" id="ev-loyalty_store_section_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_store_section_view</code> <span class="evmeta">Màn hình: Reward Store · Từ bản: Handoff 7</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách nhìn thấy một mục của tab Home Store trong cửa hàng quà: Popular Rewards, F&amp;B e-Vouchers hoặc Tour &amp; Travel.</dd><dt>Thời điểm bắn</dt><dd>Khi thẻ quà đầu tiên của mục (với Tour &amp; Travel: tiêu đề của khung) hiện ít nhất một nửa trên màn hình; mỗi mục chỉ gửi một lần mỗi lần tải trang.</dd><dt>Vị trí</dt><dd>Tab Home Store của Reward Store. Popular và đầu mục F&amp;B thường thấy ngay khi mở; Tour &amp; Travel nằm dưới, phải cuộn mới thấy.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Mẫu số cho tỷ lệ bấm quà của từng mục; biết khách có cuộn xuống tới F&amp;B và Tour &amp; Travel không. Đọc theo số khách, không theo số event (trang được tải lại mỗi lần khách quay về).</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Gọi <code>trackView()</code> trong code, ở <code>pages/store.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>section</code></td><td>string</td><td><code>travel</code></td><td><div class="vtext">Mục vừa được nhìn thấy:</div><div class="val"><code>popular</code> = Popular Rewards</div><div class="val"><code>fnb</code> = F&amp;B e-Vouchers</div><div class="val"><code>travel</code> = Tour &amp; Travel</div></td><td>Gắn cố định theo mục.</td></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>4</code></td><td>Số món quà trong mục: thường <code>8</code> (Popular), <code>4</code> (F&amp;B), <code>4</code> (Tour &amp; Travel); ít hơn khi danh sách quà ít.</td><td>Số thẻ quà của mục đó.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_category_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_category_view</code> <span class="evmeta">Màn hình: Reward Store · Từ bản: Handoff 7</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Tab Categories của cửa hàng quà hiện danh sách quà của một danh mục (hoặc tất cả, hoặc thẻ "More categories").</dd><dt>Thời điểm bắn</dt><dd>Khi khách chọn bằng chip hoặc bằng <code>See all</code> (<code>from</code> = <code>chip</code>, <code>see_all</code>): gửi mỗi lần đổi, vì đây là lựa chọn của khách; bấm lại chip đang chọn không gửi. Khi danh sách chỉ hiện ra do mở tab hoặc mở trang (<code>from</code> = <code>tab</code>, <code>page_load</code>): mỗi danh mục chỉ gửi một lần mỗi lần tải trang.</dd><dt>Vị trí</dt><dd>Tab Categories của Reward Store: hàng chip danh mục (All, 5 danh mục, More categories) và danh sách quà bên dưới.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Danh mục nào được quan tâm; bao nhiêu khách muốn thêm danh mục (<code>category</code> = <code>more</code>); mẫu số cho tỷ lệ bấm quà trong danh sách. Nhu cầu thật là <code>from</code> = <code>chip</code> hoặc <code>see_all</code>.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Gọi <code>track()</code> / <code>trackView()</code> trong code, ở <code>pages/store.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>category</code></td><td>string</td><td><code>fnb_voucher</code></td><td><div class="vtext">Danh sách đang hiện:</div><div class="val"><code>all</code> = chip All (mọi món quà)</div><div class="val"><code>gadget_electronics</code>, <code>tour_travel</code>, <code>shopping_voucher</code>, <code>fnb_voucher</code>, <code>home_living</code> = danh mục đó (nghĩa như ở <code>loyalty_reward_click</code>)</div><div class="val"><code>more</code> = chip "More categories": thẻ "2,000+ rewards on the way", không có quà (khách muốn thêm danh mục)</div></td><td>Chip đang chọn.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>chip</code></td><td><div class="vtext">Vì sao danh sách hiện ra:</div><div class="val"><code>chip</code> = khách bấm một chip danh mục</div><div class="val"><code>see_all</code> = khách bấm <code>See all</code> của một mục ở tab Home Store (Popular mở <code>all</code>, F&amp;B mở <code>fnb_voucher</code>, Tour &amp; Travel mở <code>tour_travel</code>)</div><div class="val"><code>tab</code> = khách bấm tab Categories ở thanh dưới; danh sách hiện danh mục chọn lần trước</div><div class="val"><code>page_load</code> = cửa hàng mở thẳng ở tab Categories (ví dụ quay về từ trang chi tiết quà)</div><div class="vtext">Nhu cầu thật của khách là <code>chip</code> và <code>see_all</code>.</div></td><td>Gắn theo cách khách tới danh sách.</td></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>10</code></td><td>Số món quà trong danh sách đang hiện. <code>0</code> = danh mục chưa có quà, hoặc <code>category</code> = <code>more</code>.</td><td>Đếm món quà của danh mục trong danh sách quà.</td></tr><tr><td colspan="5" class="none">Kèm theo: 11 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="sc <h2>3. Cách gửi</h2>
<p>Mọi event đi qua một file duy nhất, <code>shared/tracking.js</code>. File này đẩy event vào <code>window.dataLayer</code>; Google Tag Manager đọc từ đó và chuyển tiếp. Ngoài file này, không chỗ nào trong code chạm vào <code>dataLayer</code>.</p>

<h3>3.1 Hai cách một event được gửi</h3>
<table>
  <tr><th style="width:22%">Loại</th><th style="width:38%">Cách gắn</th><th>Khi nào dùng</th></tr>
  <tr><td>Bấm nút</td><td>Thuộc tính <code>data-track</code> trên nút, thuộc tính riêng viết thành <code>data-track-&lt;name&gt;</code>. Một bộ lắng nghe chung đọc các thuộc tính này</td><td>Mọi event tên kết thúc bằng <code>_click</code> và các event bấm khác. Thêm một nút cần đo thì chỉ thêm thuộc tính, không viết code</td></tr>
  <tr><td>Nhìn thấy</td><td>Gọi <code>trackView()</code> trong code lúc thành phần hiện ra</td><td>Event tên kết thúc bằng <code>_view</code>. Mỗi lần tải trang chỉ gửi một lần</td></tr>
  <tr><td>Trường hợp khác</td><td>Gọi <code>track()</code> trong code</td><td>Event phụ thuộc vào logic, ví dụ chọn khoảng ngày hay các bước của tour</td></tr>
</table>
<p>Ví dụ gắn trên nút:</p>
<pre class="hl">&lt;button data-track=<span class="str">"loyalty_reward_click"</span> data-track-position=<span class="str">"1"</span>&gt;Redeem&lt;/button&gt;</pre>
<p>Ví dụ gọi trong code:</p>
<pre class="hl"><span class="kw">import</span> { track, trackView } <span class="kw">from</span> <span class="str">'./tracking.js'</span>;

<span class="cm">// Sent once per page load</span>
<span class="fn">trackView</span>(<span class="str">'loyalty_join_card_view'</span>, { step: <span class="str">'kyc'</span> });

<span class="cm">// Sent every time it is called</span>
<span class="fn">track</span>(<span class="str">'loyalty_tour_skip'</span>, { step: <span class="num">2</span> });</pre>
<p>Kết quả trong <code>dataLayer</code>:</p>
<pre class="hl"><span class="cm">// One event in the dataLayer: its name, every event property cleared (undefined),</span>
<span class="cm">// the common properties, then its own properties. Every value is text.</span>
window.dataLayer.<span class="fn">push</span>({
  event: <span class="str">'loyalty_trade_click'</span>,
  source: undefined, <span class="kw">from</span>: undefined, tier: undefined, /* … every other event property … */
  page: <span class="str">'earn'</span>,
  theme: <span class="str">'light'</span>,
  has_task: <span class="str">'true'</span>,
  join_step: <span class="str">'none'</span>,
  credit_mode: <span class="str">'in-day'</span>,
  balance_range: <span class="str">'1000-4999'</span>,
  loyalty_tier: <span class="str">'vip'</span>,
  capped: <span class="str">'false'</span>
});</pre>

<h3 id="common">3.2 Thuộc tính chung</h3>
<p>11 thuộc tính dưới đây được gửi kèm mọi event. Chúng được xác định một lần lúc trang mở.</p>
<div class="scroll"><table><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup>
  <tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr>
  <tr><td><code>page</code></td><td>string</td><td><code>earn</code></td><td><div class="vtext">Trang nơi event xảy ra:</div><div class="val"><code>home</code> = Home</div><div class="val"><code>earn</code> = Earn (trading task hằng ngày)</div><div class="val"><code>coins</code> = Coins (số dư và lịch sử coin)</div><div class="val"><code>orders</code> = Redemption history (đơn đổi quà)</div><div class="val"><code>store</code> = Reward Store, cửa hàng quà trong webview (cả hai tab Home Store và Categories; chỉ có khi bật Plan B)</div><div class="val"><code>reward</code> = trang chi tiết một món quà của Reward Store</div></td><td>Gắn cố định cho từng trang lúc trang mở.</td></tr><tr><td><code>client_id</code></td><td>string</td><td><code>95001234</code></td><td>Mã khách (client id) của người dùng đã đăng nhập. Khách chưa đăng nhập không có thuộc tính này. Dùng để nối event với dữ liệu giao dịch và coin ở backend.</td><td>App đọc từ token mà app truyền vào webview lúc mở trang, rồi gửi kèm mọi event. Bản demo tham chiếu không có token nên không gửi.</td></tr><tr><td><code>theme</code></td><td>string</td><td><code>light</code></td><td>Chế độ màu đang hiển thị: <code>light</code> hoặc <code>dark</code>.</td><td>Thuộc tính <code>data-theme</code> của trang.</td></tr><tr><td><code>has_task</code></td><td>String</td><td><code>true</code></td><td><div class="val"><code>true</code> = khách có trading task (có tab Earn)</div><div class="val"><code>false</code> = trading task tắt hoặc ẩn với khách (không có tab Earn)</div><div class="vtext">Gửi dạng chữ.</div></td><td>Trường <code>tradingTask</code> của API trading task.</td></tr><tr><td><code>join_step</code></td><td>string</td><td><code>none</code></td><td><div class="vtext">Bước khách còn phải làm trước khi được tính coin:</div><div class="val"><code>signup</code> = chưa đăng nhập (khách vãng lai)</div><div class="val"><code>kyc</code> = đã đăng nhập, chưa KYC</div><div class="val"><code>deposit</code> = đã KYC, chưa nạp tiền lần đầu</div><div class="val"><code>none</code> = không còn bước nào, hoặc khách đã đăng nhập nhưng không có trading task (khi đó <code>none</code> không có nghĩa là đã KYC)</div></td><td>Từ dữ liệu đăng nhập của app: <code>kycApproveTime</code> = 0 là <code>kyc</code>; <code>kycApproveTime</code> &gt; 0 và <code>firstDepositTime</code> = 0 là <code>deposit</code>; còn lại là <code>none</code>. Khách đã đăng nhập mà không có trading task luôn là <code>none</code>. Khi app mở trang không có token: <code>signup</code>.</td></tr><tr><td><code>credit_mode</code></td><td>string</td><td><code>in-day</code></td><td><div class="val"><code>in-day</code> = coin được cộng trong ngày giao dịch</div><div class="val"><code>delayed</code> = coin được cộng sau ngày giao dịch vài ngày</div><div class="val"><code>none</code> = khách không có trading task</div></td><td>Trường <code>program.creditMode</code> của API trading task.</td></tr><tr><td><code>balance_range</code></td><td>string</td><td><code>1000-4999</code></td><td>Số dư coin theo khoảng: <code>0</code>, <code>1-999</code>, <code>1000-4999</code>, <code>5000+</code>. Số dư chính xác không được gửi.</td><td>Tính từ trường <code>available</code> của API tổng quan coin.</td></tr><tr><td><code>loyalty_tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">Hạng của khách: hạng cao nhất trong các tài khoản Eligible.</div><div class="val"><code>micro</code>, <code>standard</code>, <code>vip</code>, <code>platinum</code> = nghĩa như ở <code>loyalty_upgrade_open</code></div><div class="val"><code>none</code> = không có tài khoản Eligible nào thuộc 4 hạng (chưa có tài khoản thật, không có trading task, mọi tài khoản đều không được tính coin, hoặc tài khoản ở nhóm MT5 khác)</div><div class="vtext">Không gửi với khách vãng lai. GTM gắn nó thành user property <code>loyalty_tier</code> của GA4.</div></td><td>Từ nhóm MT5 của các tài khoản (trường <code>accounts[].group</code> và <code>accounts[].eligible</code> của API trading task).</td></tr><tr><td><code>view</code></td><td>string</td><td><code>list</code></td><td><div class="vtext">Phần của trang đang hiện lúc event xảy ra (chỉ có ở 3 trang dưới):</div><div class="vtext">Redemption history: <code>list</code> = danh sách có đơn; <code>empty</code> = chưa có đơn; <code>detail</code> = chi tiết một đơn, kể cả khi đơn không mở được</div><div class="vtext">Reward Store: <code>home</code> = tab Home Store; <code>categories</code> = tab Categories; <code>empty</code> = không có quà nào (danh sách quà trống hoặc lỗi)</div><div class="vtext">Trang chi tiết quà: <code>detail</code> = món quà; <code>missing</code> = "This reward is no longer available"</div><div class="vtext">Ở Reward Store, <code>view</code> đổi theo tab; một lần bấm mang <code>view</code> của lúc bấm (nên <code>loyalty_nav_click</code> mang tab đang rời đi).</div></td><td>Xác định lúc trang mở; ở Reward Store cập nhật khi đổi tab.</td></tr><tr><td><code>redeem_mode</code></td><td>string</td><td><code>store</code></td><td><div class="vtext">Chế độ đổi quà đang chạy, gửi với mọi event của mọi trang:</div><div class="val"><code>tada</code> = nút Redeem mở cửa hàng Tada (mặc định)</div><div class="val"><code>store</code> = Plan B: nút Redeem mở cửa hàng quà trong webview (Reward Store), Checkout chưa hoạt động</div><div class="vtext">Công tắc giống nhau cho mọi khách: so sánh hai giá trị là so hai giai đoạn trước và sau khi bật, không phải thử nghiệm A/B.</div></td><td>Từ cấu hình phía HSB (<code>common.rewardStore</code>), không lấy từ API loyalty.</td></tr><tr><td><code>entry</code></td><td>string</td><td><code>home_redeem</code></td><td><div class="vtext">Chỉ ở Reward Store và trang chi tiết quà: khách tới trang bằng cách nào:</div><div class="val"><code>home_redeem</code> = nút <code>Redeem</code> ở Home</div><div class="val"><code>home_explore</code> = nút <code>Explore all rewards</code> ở Home</div><div class="val"><code>home_reward</code> = một ô quà ở Home (tới thẳng trang chi tiết quà)</div><div class="val"><code>coins_redeem</code> = nút <code>Redeem</code> ở Coins</div><div class="val"><code>orders_redeem</code> = nút <code>Explore rewards</code> ở Redemption history khi chưa có đơn</div><div class="val"><code>store</code> = một món quà trong Reward Store (tới trang chi tiết quà)</div><div class="val"><code>return</code> = cùng trang đó lần nữa: quay về bằng nút Back từ trang chi tiết quà, nút back của điện thoại, hoặc tải lại trang</div><div class="val"><code>direct</code> = mở từ link bên ngoài</div><div class="vtext">Đếm lượt vào cửa hàng: <code>loyalty_page_view</code> với <code>page</code> = <code>store</code> và <code>entry</code> khác <code>return</code>.</div></td><td>Link vào cửa hàng mang tham số <code>via</code>; trang đọc một lần rồi xoá khỏi địa chỉ, nên lần mở lại không còn <code>via</code> và được ghi <code>return</code>.</td></tr>
</table></div>

<h3>3.3 Giới hạn và lưu ý</h3>
<ul>
  <li><b>Giới hạn của GA4:</b> tên event và tên thuộc tính tối đa 40 ký tự, giá trị tối đa 100 ký tự, mỗi event tối đa 25 thuộc tính. Mọi event hiện tại đều nằm trong giới hạn.</li>
  <li><b>Kiểu dữ liệu:</b> mọi giá trị đều gửi dạng chữ, kể cả <code>"true"</code> hay <code>"1"</code>, để một custom dimension của GA4 không bị lẫn kiểu.</li>
  <li><b>Xoá thuộc tính cũ:</b> GTM giữ giá trị cuối của mỗi thuộc tính. Vì vậy mỗi lần gửi, mọi thuộc tính riêng của event được đặt về <code>undefined</code> trước, rồi mới gắn thuộc tính của event đó; nếu không, một event không có <code>source</code> sẽ bị đọc thành <code>source</code> của event trước. Thêm thuộc tính mới thì thêm vào danh sách <code>PARAMS</code> trong <code>shared/tracking.js</code>.</li>
  <li><b>Kiểm tra tự động:</b> <code>node tools/check-tracking.mjs</code> mở các trang, bấm thử và báo lỗi khi event lệch với danh sách này.</li>
  <li><b>Event của nút rời trang:</b> thanh điều hướng, các thẻ ở Home, <code>Skip tour</code> và <code>Finish tour</code> đẩy event trước khi chuyển trang.</li>
  <li><b>Chưa có GTM:</b> trang vẫn chạy bình thường; event chỉ nằm chờ trong <code>dataLayer</code>.</li>
</ul>

<h3>3.4 Cấu hình trên GTM và GA4</h3>
<table>
  <tr><th style="width:8%">Bước</th><th>Việc cần làm</th></tr>
  <tr><td>1</td><td>Trong GTM, tạo một trigger loại Custom Event, bật biểu thức chính quy, với tên event <code>^loyalty_</code></td></tr>
  <tr><td>2</td><td>Tạo một tag GA4 Event dùng trigger đó, tên event là <code>{{Event}}</code></td></tr>
  <tr><td>3</td><td>Tạo Data Layer Variable cho từng thuộc tính và thêm vào tag làm tham số của event; riêng <code>loyalty_tier</code> thêm vào mục User Properties của tag</td></tr>
  <tr><td>4</td><td>Trong GA4, đăng ký các thuộc tính cần dùng để chia báo cáo làm custom dimension <b>trước khi ra mắt</b> (GA4 không áp dụng cho dữ liệu đã thu): theo event cho các thuộc tính chung và riêng, theo user cho <code>loyalty_tier</code></td></tr>
  <tr><td>5</td><td>Trong GA4: đặt thời gian giữ dữ liệu 14 tháng; tắt "Page changes based on browser history events" trong enhanced measurement của web stream (tour đổi địa chỉ trang mà không tải trang mới); đánh dấu key event cho <code>loyalty_kyc_click</code>, <code>loyalty_deposit_click</code>, <code>loyalty_signup_click</code>, <code>loyalty_trade_click</code>, <code>loyalty_redeem_click</code></td></tr>
  <tr><td>6</td><td>Chuyển cùng các event sang CleverTap. <span class="pending">PENDING</span></td></tr>
</table>

<h3>3.5 Thêm hoặc sửa event</h3>
<ol>
  <li>Đặt tên theo quy ước ở tab <a href="#overview" class="ref">1. Tổng quan</a>.</li>
  <li>Nếu là bấm nút: thêm <code>data-track</code> vào nút. Nếu không: gọi <code>track()</code> hoặc <code>trackView()</code>.</li>
  <li>Thêm một dòng vào <code>events.csv</code>, các thuộc tính riêng vào <code>event_properties.csv</code>, và một dòng vào <code>changelog.csv</code>; rồi dựng lại trang này.</li>
</ol>

<script>var TITLES = {"en": "HSB Loyalty – Front-end Event Tracking", "zh": "HSB Loyalty – 前端事件追踪", "vi": "HSB Loyalty – Event tracking phía front-end"};
(function () {
  var app = document.getElementById('app'), sel = document.getElementById('lang');
  var FIRST = 'overview', current = FIRST;
  function show(id, push) {
    app.querySelectorAll('.tabs button').forEach(function (b) {
      var on = b.dataset.tab === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      document.getElementById(b.dataset.tab).classList.toggle('on', on);
    });
    current = id;
    if (push) history.replaceState(null, '', '#' + id);
  }
  // Link nội bộ: mở đúng tab chứa đích rồi cuộn tới
  function go(hash) {
    var el = hash && hash.length > 1 && document.getElementById(hash.slice(1));
    if (!el) return false;
    var panel = el.classList.contains('panel') ? el : el.closest('.panel');
    if (!panel) return false;
    show(panel.id, false);
    if (el !== panel) el.scrollIntoView(); else window.scrollTo(0, 0);
    return true;
  }
  function mount(lang, keepTab) {
    var tpl = document.getElementById('tpl-' + lang) || document.getElementById('tpl-en');
    app.innerHTML = tpl.innerHTML;
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    document.title = TITLES[lang] || TITLES.en;
    sel.value = lang;
    if (keepTab) show(current, false);
    else if (!go(location.hash)) show(FIRST, false);
  }
  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tabs button');
    if (tab) { show(tab.dataset.tab, true); window.scrollTo(0, 0); return; }
    var a = ev.target.closest('a.ref');
    if (a && go(a.getAttribute('href'))) { ev.preventDefault(); history.replaceState(null, '', a.getAttribute('href')); }
  });
  sel.addEventListener('change', function () {
    try { localStorage.setItem('hsb-doc-lang', sel.value); } catch (err) {}
    mount(sel.value, true);
  });
  var saved = null;
  try { saved = localStorage.getItem('hsb-doc-lang'); } catch (err) {}
  mount(saved === 'zh' || saved === 'vi' || saved === 'en' ? saved : 'en', false);
})();
</script>
