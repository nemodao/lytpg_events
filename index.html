<h1>HSB Loyalty Program – Front-end event tracking</h1>
<p class="sub">The events sent by the HSB Loyalty programme's interface. Updated: 2026-10-20.</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. Overview</button><button type="button" role="tab" data-tab="events" aria-selected="false">2. Event details</button><button type="button" role="tab" data-tab="sending" aria-selected="false">3. How events are sent</button><button type="button" role="tab" data-tab="changelog" aria-selected="false">4. Change history</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>1. Overview</h2>
<p>This document records every tracking event sent by the interface of the HSB Loyalty programme: what each event is, when it is sent, on which screen, and which properties it carries. It is written for front-end developers, data and marketing staff, and QA. It covers events only; the message plan and the backend logic are in the <a href="https://nemodao.github.io/lytpg_clevertap/" class="ext" target="_blank" rel="noopener">CleverTap notification document</a>.</p>
<p>The programme has four pages running in the app's webview: <b>Home</b>, <b>Earn</b>, <b>Coins</b> and <b>Redemption history</b> (the reward orders, opened from Coins). Customers who are not signed in can see these pages too. There are 33 events and 8 common properties.</p>
<h3>Conventions</h3>
<ul>
  <li><b>Event names:</b> English, <code>snake_case</code>, following the pattern <code>loyalty_&lt;object&gt;_&lt;action&gt;</code>. The action is <code>view</code> (the customer sees something), <code>click</code> (the customer taps something), or a specific verb such as <code>start</code>, <code>apply</code>.</li>
  <li><b>Property names:</b> English, <code>snake_case</code>.</li>
  <li><b>Customer identity:</b> by <code>client_id</code>. The pages do not send this id; Google Tag Manager sets it as the user property <code>client_id</code> when the customer signs in.</li>
  <li><b>Never sent:</b> trading account numbers, the exact balance, names or any personal data of the customer. The balance is only sent as a range.</li>
  <li><b>"View" events</b> are sent only once per page load, however many times the page redraws.</li>
</ul>

  <tr><td>2</td><td>Google Tag Manager (GTM)</td><td>Receives every event whose name starts with <code>loyalty_</code> and attaches the user property <code>client_id</code></td></tr>

</table>

<h2>2. Details of each event</h2>
<p>33 events in 7 groups, by the analysis question they answer. Each event is one block: the name row, the description, then the table of that event's own properties.</p>
<p><a href="#grp-0" class="ref">A. From sign-up to trading</a> · <a href="#grp-1" class="ref">B. Interest in rewards</a> · <a href="#grp-2" class="ref">C. Use of the pages</a> · <a href="#grp-3" class="ref">D. Guided tour</a> · <a href="#grp-4" class="ref">E. Guests</a> · <a href="#grp-5" class="ref">F. Redemption history</a> · <a href="#grp-6" class="ref">G. Problems</a></p><h3 id="grp-0">A. From sign-up to trading</h3><p>Answers the question: do customers go all the way from the invitation to KYC, deposit and trading?</p><div class="scroll evblock" id="ev-loyalty_join_card_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_join_card_view</code> <span class="evmeta">Screen: Home, Earn, Coins, Redemption history · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer sees an invitation to start: the "How to start" panel (the steps to take before earning coins) or the "Your coins will show up here" card on Coins. Shown to customers who have a trading task but have not completed KYC or made a first deposit (<code>join_step</code> = <code>kyc</code>, <code>deposit</code>), and to guests (<code>join_step</code> = <code>signup</code>).</dd><dt>When it is sent</dt><dd>When the panel is shown. The panel on Earn and the sign-up card on Coins: sent once per page load. The invitation sheet ("Start earning to redeem", or "Join to redeem rewards" for guests): sent every time it opens.</dd><dt>Location</dt><dd>The Today card on Earn; the "Your coins will show up here" card on Coins (guests); the invitation sheet that opens when the customer taps <code>Redeem</code>, a reward card, <code>Explore all rewards</code>, <code>Explore rewards</code> on an empty Redemption history, or (guests) the balance card or <code>Redemption history</code>, on Home, Coins and Redemption history. The sheet is titled "Start earning to redeem" (guests: "Join to redeem rewards"); property <code>source</code> = <code>redeem</code>, <code>from</code> = the button that opened it.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Denominator of the KYC and deposit funnel: how many customers saw the invitation.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>Called with <code>trackView()</code> in code (the invitation sheet: <code>track()</code>, on every opening), in <code>shared/components.js</code>, function <code>joinPanel</code> and <code>mountJoinSheet</code>; <code>pages/point-balance.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>source</code></td><td>string</td><td><code>redeem</code></td><td><div class="val"><code>card</code> = the "How to start" panel on the Today card on Earn, or the "Your coins will show up here" card on Coins (guests)</div><div class="val"><code>redeem</code> = the invitation sheet ("Start earning to redeem"; guests: "Join to redeem rewards"), opened by the button named in <code>from</code></div></td><td>Fixed by where the panel is shown.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">The button that opened the sheet:</div><div class="val"><code>redeem</code> = the <code>Redeem</code> button on the balance card (Home, Coins) or <code>Explore rewards</code> on an empty Redemption history</div><div class="val"><code>balance</code> = the balance card on Home (guests only)</div><div class="val"><code>reward</code> = a reward card in the rewards grid on Home</div><div class="val"><code>explore</code> = the <code>Explore all rewards</code> button on Home</div><div class="val"><code>history</code> = the <code>Redemption history</code> link on Coins (guests only)</div><div class="vtext">Only when <code>source</code> = <code>redeem</code>.</div></td><td>The button just tapped to open the sheet.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_kyc_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_kyc_click</code> <span class="evmeta">Screen: Home, Earn, Coins, Redemption history · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps <code>Verify my account</code> to go and verify their account (KYC).</dd><dt>When it is sent</dt><dd>When the customer taps the button.</dd><dt>Location</dt><dd>The main button on the "How to start" panel (on Earn or in the "Start earning to redeem" sheet on Home, Coins and Redemption history), when the customer has not completed KYC.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Share of customers who see the invitation and then go to KYC.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, function <code>joinPanel</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>source</code></td><td>string</td><td><code>redeem</code></td><td><div class="vtext">Where it was tapped:</div><div class="val"><code>card</code> = the "How to start" panel on Earn</div><div class="val"><code>redeem</code> = the "Start earning to redeem" sheet, opened by the button named in <code>from</code></div></td><td>Fixed by where the button is shown.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">The button that opened the sheet:</div><div class="val"><code>redeem</code> = the <code>Redeem</code> button on the balance card (Home, Coins) or <code>Explore rewards</code> on an empty Redemption history</div><div class="val"><code>balance</code> = the balance card on Home (guests only)</div><div class="val"><code>reward</code> = a reward card in the rewards grid on Home</div><div class="val"><code>explore</code> = the <code>Explore all rewards</code> button on Home</div><div class="val"><code>history</code> = the <code>Redemption history</code> link on Coins (guests only)</div><div class="vtext">Only when <code>source</code> = <code>redeem</code>.</div></td><td>As on <code>loyalty_join_card_view</code>.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_deposit_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_deposit_click</code> <span class="evmeta">Screen: Home, Earn, Coins, Redemption history · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps <code>Deposit now</code> to go and deposit: a first deposit, or more to move the account up a tier.</dd><dt>When it is sent</dt><dd>When the customer taps the button.</dd><dt>Location</dt><dd>The main button on the "How to start" panel (on Earn or in the "Start earning to redeem" sheet on Home, Coins and Redemption history), when the customer has completed KYC but not deposited. The <code>Deposit now</code> button in the account tier sheet on Earn (property <code>source</code> = <code>upgrade</code>).</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Share of customers who see the invitation and then go to deposit.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, function <code>joinPanel</code>; <code>pages/trading-task.js</code> (tier sheet)</dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="vtext">Where it was tapped:</div><div class="val"><code>card</code> = the "How to start" panel on Earn</div><div class="val"><code>redeem</code> = the "Start earning to redeem" sheet, opened by the button named in <code>from</code></div><div class="val"><code>upgrade</code> = the <code>Deposit now</code> button in the account tier sheet on Earn</div></td><td>Fixed on the button.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>redeem</code></td><td><div class="vtext">The button that opened the sheet:</div><div class="val"><code>redeem</code> = the <code>Redeem</code> button on the balance card (Home, Coins) or <code>Explore rewards</code> on an empty Redemption history</div><div class="val"><code>balance</code> = the balance card on Home (guests only)</div><div class="val"><code>reward</code> = a reward card in the rewards grid on Home</div><div class="val"><code>explore</code> = the <code>Explore all rewards</code> button on Home</div><div class="val"><code>history</code> = the <code>Redemption history</code> link on Coins (guests only)</div><div class="vtext">Only when <code>source</code> = <code>redeem</code>.</div></td><td>As on <code>loyalty_join_card_view</code>.</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">Only when <code>source</code> = <code>upgrade</code>: the account's current tier:</div><div class="val"><code>micro</code>, <code>standard</code> or <code>vip</code> = meaning as on <code>loyalty_upgrade_open</code>; Platinum accounts have no such button</div></td><td>From the account's MT5 group.</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>platinum</code></td><td><div class="vtext">Only when <code>source</code> = <code>upgrade</code>: the next tier:</div><div class="val"><code>standard</code>, <code>vip</code> or <code>platinum</code></div></td><td>The tier after it on the four-tier ladder.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_open_account_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_open_account_click</code> <span class="evmeta">Screen: Earn · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer has completed KYC and made a deposit but has no live trading account, and taps <code>Open a trading account</code>.</dd><dt>When it is sent</dt><dd>When the customer taps the button.</dd><dt>Location</dt><dd>The button on the Trading account card on Earn.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Counts customers who are blocked at the step of opening a trading account.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_trade_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_trade_click</code> <span class="evmeta">Screen: Earn · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps a button to go and trade: <code>Trade with account …</code> on Earn (when today's maximum coins is reached, the button reads <code>Trade now</code>), or the button at the bottom of the account tier sheet when the account is already Platinum.</dd><dt>When it is sent</dt><dd>When the customer taps the button.</dd><dt>Location</dt><dd>The button on the Trading account card on Earn; the button at the bottom of the account tier sheet (property <code>source</code> = <code>upgrade</code>).</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Measures whether the pages lead customers to trade, and how many trades start from the tier sheet.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>capped</code></td><td>string</td><td><code>false</code></td><td>Whether the customer has already reached today's maximum coins: <code>true</code> or <code>false</code>.</td><td>The field <code>today.capped</code> of the trading task API.</td></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="val"><code>upgrade</code> = the button at the bottom of the account tier sheet (only when the account is Platinum)</div><div class="vtext">Absent when the button on the Trading account card is tapped.</div></td><td>Fixed on the button.</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>platinum</code></td><td>Only when <code>source</code> = <code>upgrade</code>: the account's tier (always <code>platinum</code>).</td><td>From the account's MT5 group.</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>none</code></td><td>Only when <code>source</code> = <code>upgrade</code>: always <code>none</code>.</td><td>Fixed on the button.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-1">B. Interest in rewards</h3><p>Answers the question: are customers interested in redeeming rewards, and at which balance?</p><div class="scroll evblock" id="ev-loyalty_redeem_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_redeem_click</code> <span class="evmeta">Screen: Home, Coins, Redemption history · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps the <code>Redeem</code> button on the balance card or the <code>Explore rewards</code> button on Redemption history (when there are no orders yet) to go to the rewards store. For customers who are not signed in, or who have a trading task but have not completed KYC or a first deposit, the button opens an invitation sheet instead of the store; the event is still sent.</dd><dt>When it is sent</dt><dd>When the customer taps the button.</dd><dt>Location</dt><dd>The coin balance card on Home and on Coins. The <code>Explore rewards</code> button on the Redemption history page when the order list is empty.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it e value is obtained</th></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>9</code></td><td><div class="vtext">Number of rewards in the grid (the <code>Earn more coins</code> card not counted): from <code>0</code> to <code>9</code> when the grid has the <code>Earn more coins</code> card, up to <code>10</code> when it does not.</div><div class="val"><code>0</code> = no rewards (empty or failed list)</div></td><td>Number of rewards shown.</td></tr><tr><td><code>has_earn_card</code></td><td>string</td><td><code>true</code></td><td>Whether the grid has the <code>Earn more coins</code> card (the card that opens Earn): <code>true</code> or <code>false</code>.</td><td><code>true</code> when the customer has a trading task, the programme has not ended and the grid has at least one reward; otherwise <code>false</code>.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_reward_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_reward_click</code> <span class="evmeta">Screen: Home · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps a reward card in the rewards grid (anywhere on the card) on Home.</dd><dt>When it is sent</dt><dd>When the customer taps; also when the card opens the invitation sheet instead of the store.</dd><dt>Location</dt><dd>The rewards grid under "Redeem coins for rewards" on Home, up to 10 cards.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows which reward cards and which rewards get tapped most.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/dashboard.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>position</code></td><td>string</td><td><code>1</code></td><td>Position of the tapped reward card: the reward's rank in the grid, from <code>1</code> to <code>9</code> (up to <code>10</code> when there is no <code>Earn more coins</code> card); the <code>Earn more coins</code> card is not counted.</td><td>The reward's order in the rewards list.</td></tr><tr><td><code>reward_id</code></td><td>string</td><td><code>101</code></td><td>ID of the tapped reward.</td><td>The <code>id</code> field of the rewards list API (<code>/loyalty/catalog</code>).</td></tr><tr><td><code>reward_name</code></td><td>string</td><td><code>AirPods Pro 2</code></td><td>The reward's name, as HSB sends it (cut at 100 characters).</td><td>The <code>name</code> field of the rewards list API.</td></tr><tr><td><code>affordable</code></td><td>string</td><td><code>true</code></td><td>Whether the balance covers the reward: <code>true</code> or <code>false</code>. Neither the balance nor the price is sent.</td><td>Compares the balance with the reward's price.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_expiring_notice_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_expiring_notice_view</code> <span class="evmeta">Screen: Home, Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer sees the warning that some coins will expire within the next 10 days.</dd><dt>When it is sent</dt><dd>When the page draws the notice (whether the customer scrolls to it is not measured); sent once per page load.</dd><dt>Location</dt><dd>The red warning line under the balance, inside the balance card.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows whether the expiry warning pushes customers to redeem.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>trackView()</code> in the code, in <code>shared/components.js</code>, function <code>balanceBlock</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-2">C. Use of the pages</h3><p>Answers the question: which pages and parts of the programme do customers use?</p><div class="scroll evblock" id="ev-loyalty_page_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_page_view</code> <span class="evmeta">Screen: Home, Earn, Coins, Redemption history · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer opens a page of the programme.</dd><dt>When it is sent</dt><dd>As soon as the page has data to show; sent once per page load. Still sent when the page shows the "Couldn’t load this page" card. When the real API fails as the page opens, the page shows no error card and does not send this event (spec §54).</dd><dt>Location</dt><dd>All four pages; told apart by the common property <code>page</code>.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Views of each page; the denominator for the other rates; tells whether the customer has ever opened the programme.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> in the code, in <code>shared/tracking.js</code>, function <code>initTracking</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_nav_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_nav_click</code> <span class="evmeta">Screen: Home, Earn, Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps a tab in the bottom navigation bar, or taps the X button to leave the programme.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The floating navigation bar at the bottom of the screen.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>The customer's path between pages; number of exits.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/nav.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>target</code></td><td>string</td><td><code>earn</code></td><td><div class="vtext">Where the customer tapped to:</div><div class="val"><code>home</code> = the Home tab</div><div class="val"><code>earn</code> = the Earn tab (absent when the customer has no trading task)</div><div class="val"><code>coins</code> = the Coins tab</div><div class="val"><code>exit</code> = the X button, leaving the programme for the app</div><div class="vtext">Tapping the tab of the open page still sends it.</div></td><td>Fixed for each button.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_card_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_card_click</code> <span class="evmeta">Screen: Home · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>On Home, the customer taps the balance card to go to Coins, taps the <code>Earn more coins</code> card in the rewards grid to go to Earn, or taps <code>Explore all rewards</code> to go to the rewards store. For guests, the balance card opens the sign-up invitation sheet; for customers who are not signed in or have not completed KYC or a first deposit, <code>Explore all rewards</code> opens the invitation sheet instead of the store; the event is still sent.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The balance card, the <code>Earn more coins</code> card and the "Looking for something else?" card (with no rewards grid: "Find rewards for your coins") on Home.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows where customers enter Earn, Coins and the rewards store from.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, <code>pages/dashboard.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>target</code></td><td>string</td><td><code>coins</code></td><td><div class="vtext">Destination:</div><div class="val"><code>coins</code> = a tap on the balance card</div><div class="val"><code>earn</code> = a tap on the <code>Earn more coins</code> card</div><div class="val"><code>rewards</code> = a tap on <code>Explore all rewards</code></div></td><td>Fixed for each card.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_tab_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_tab_click</code> <span class="evmeta">Screen: Earn, Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer switches tab inside a page.</dd><dt>When it is sent</dt><dd>When the customer taps a tab.</dd><dt>Location</dt><dd>The How it works / History tabs on Earn; the Available / Expired / History tabs on Coins.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows which tabs are viewed.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code>, <code>pages/point-balance.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tab</code></td><td>string</td><td><code>history</code></td><td><div class="vtext">The tab tapped (including the tab already open).</div><div class="vtext">On Earn:</div><div class="val"><code>rules</code> = the How it works tab (the coin rules)</div><div class="val"><code>history</code> = the History tab (coins per trading day)</div><div class="vtext">On Coins:</div><div class="val"><code>available</code> = the Available tab (coin lots still usable)</div><div class="val"><code>expired</code> = the Expired tab (expired coins)</div><div class="val"><code>history</code> = the History tab (every coin added or taken)</div><div class="val"><code>history</code> exists on both pages: tell them apart by <code>page</code>. Guests have no tabs.</div></td><td>Fixed for each tab.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_date_filter_apply"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_date_filter_apply</code> <span class="evmeta">Screen: Earn, Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer chooses a date range for the list they are viewing.</dd><dt>When it is sent</dt><dd>When the customer taps the <code>Last 7 days</code> or <code>Last 30 days</code> chip, or taps <code>Apply</code> in the date picker.</dd><dt>Location</dt><dd>The date filter above the history list.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows whether customers look back at older data.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> in the code, in <code>shared/date-filter.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tab</code></td><td>string</td><td><code>history</code></td><td><div class="vtext">The list filtered:</div><div class="val"><code>history</code> = the History tab on Earn or on Coins (tell them apart by <code>page</code>)</div><div class="val"><code>expired</code> = the Expired tab on Coins</div></td><td>Fixed by the list that has the filter.</td></tr><tr><td><code>range</code></td><td>string</td><td><code>30</code></td><td><div class="val"><code>7</code> = the <code>Last 7 days</code> chip</div><div class="val"><code>30</code> = the <code>Last 30 days</code> chip</div><div class="val"><code>custom</code> = a range picked on the calendar (30 days at most), sent when <code>Apply</code> is tapped (tapping the <code>Custom</code> chip only opens the calendar)</div><div class="vtext">Tapping the selected chip again still sends it; the default on page open does not.</div></td><td>The chip that was tapped, or <code>custom</code> when <code>Apply</code> is tapped.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_account_select"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_account_select</code> <span class="evmeta">Screen: Earn · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps a row in the account sheet, including the row of the account already selected (the account then does not change).</dd><dt>When it is sent</dt><dd>When the customer taps a row in the account picker.</dd><dt>Location</dt><dd>The account picker (bottom sheet) on Earn.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows whether customers switch account, and whether they pick an account that does not earn coins by mistake.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>eligible</code></td><td>string</td><td><code>true</code></td><td>Whether the chosen account earns coins: <code>true</code> or <code>false</code>.</td><td>The field <code>accounts[].eligible</code> of the trading task API.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_upgrade_row_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_upgrade_row_view</code> <span class="evmeta">Screen: Earn · Since: Handoff 6</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer sees the upgrade row under the account field. The row shows only when the selected account earns coins (Eligible), is on one of the 4 tiers, and the programme has not ended.</dd><dt>When it is sent</dt><dd>When the row is drawn on the page (without waiting for the customer to scroll to it); sent once per page load for each tier (the row changes with the selected account).</dd><dt>Location</dt><dd>The upgrade row under the account field on Earn.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Denominator of <code>loyalty_upgrade_open</code>: how many customers who see the upgrade invitation tap it.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>trackView()</code> in the code, in <code>pages/trading-task.js</code>, function <code>upgradeRow</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tier</code></td><td>string</td><td><code>vip</code></td><td>The current tier of the selected account (<code>micro</code>, <code>standard</code>, <code>vip</code>, <code>platinum</code>; meaning as on <code>loyalty_upgrade_open</code>).</td><td>From the account's MT5 group.</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>platinum</code></td><td><div class="vtext">The next tier:</div><div class="val"><code>standard</code>, <code>vip</code> or <code>platinum</code> = meaning as on <code>tier</code></div><div class="val"><code>none</code> = the account is already Platinum, with no higher tier</div></td><td>The tier after it on the four-tier ladder.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_upgrade_open"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_upgrade_open</code> <span class="evmeta">Screen: Earn · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps the "Want more coins per lot?" row under the account field to open the account tier sheet.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The upgrade row under the account field on Earn (also the "Platinum: our highest rates" row when the account is already on the top tier).</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Top of the upgrade funnel: how many customers look at the next tier, then how many tap <code>Deposit now</code> in the sheet.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tier</code></td><td>string</td><td><code>standard</code></td><td><div class="vtext">The current tier of the selected account, set by the account's MT5 group:</div><div class="val"><code>micro</code> = the lowest tier (<code>Direct\Mini400</code>)</div><div class="val"><code>standard</code> = tier 2 (<code>Direct\Mini10</code>; deposit needed to reach it: 200 USD)</div><div class="val"><code>vip</code> = tier 3 (<code>Direct\VIP1</code>; 1,000 USD)</div><div class="val"><code>platinum</code> = the highest tier (<code>Direct\MIVIP</code>; 5,000 USD)</div></td><td>From the account's MT5 group (the <code>accounts[].group</code> field of the trading task API).</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">The next tier:</div><div class="val"><code>standard</code>, <code>vip</code> or <code>platinum</code> = meaning as on <code>tier</code></div><div class="val"><code>none</code> = the account is already Platinum, with no higher tier</div></td><td>The tier after the current one on the four-tier ladder.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_terms_open"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_terms_open</code> <span class="evmeta">Screen: Earn · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer opens the Terms &amp; Conditions.</dd><dt>When it is sent</dt><dd>When the customer taps the <code>Terms &amp; Conditions</code> button.</dd><dt>Location</dt><dd>At the end of the rules, the How it works tab on Earn (guests: the How it works card, with no tabs). Only when the programme has a terms link.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows how many customers read the terms.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_daily_cap_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_daily_cap_view</code> <span class="evmeta">Screen: Earn · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer sees the message that today's maximum coins have been reached.</dd><dt>When it is sent</dt><dd>When the page draws the notice (whether the customer scrolls to it is not measured); sent once per page load.</dd><dt>Location</dt><dd>The Today card on Earn.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows whether reaching the maximum makes customers stop trading.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>trackView()</code> in the code, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-3">D. Guided tour</h3><p>Answers the question: do customers finish the tour, and at which step do they leave it?</p><div class="scroll evblock" id="ev-loyalty_tour_start"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_tour_start</code> <span class="evmeta">Screen: Home · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The guided tour starts from its first step.</dd><dt>When it is sent</dt><dd>When the tour opens by itself the first time the customer opens Home on this device (remembered per device, not per account), or when the customer taps the help button (question mark) on Home.</dd><dt>Location</dt><dd>Trang Home.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Number of customers who start the tour, broken down by how it was opened.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> in the code, in <code>shared/tour.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>trigger</code></td><td>string</td><td><code>auto</code></td><td><div class="vtext">How the tour was opened:</div><div class="val"><code>auto</code> = opened by itself on the first visit to Home</div><div class="val"><code>help_button</code> = the customer tapped the help button</div></td><td>Determined in the code when the tour starts.</td></tr><tr><td><code>step_count</code></td><td>string</td><td><code>5</code></td><td>Number of steps in this tour run: <code>5</code>; <code>4</code> for guests (no step 5) or customers without a trading task (no step 2); <code>3</code> when both.</td><td>Number of tour steps for this customer.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_tour_step_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_tour_step_view</code> <span class="evmeta">Screen: Home, Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>A step of the tour is shown.</dd><dt>When it is sent</dt><dd>When that step's window appears; each step is sent once per page load. The tour moves between Home and Coins with a new page load, so tapping <code>Back</code> from step 3 back to step 2 sends step 2 again.</dd><dt>Location</dt><dd>Steps 1 and 2 on Home; steps 3, 4, 5 on Coins. Customers without a trading task have no step 2. Customers who are not signed in have no step 5: their tour has 4 steps.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows at which step customers leave the tour.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>trackView()</code> in the code, in <code>shared/tour.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tour_step</code></td><td>string</td><td><code>3</code></td><td><div class="vtext">Renamed from <code>step</code>. The step's id, not its place on screen:</div><div class="val"><code>1</code> = the "Welcome to HSB Loyalty" greeting (Home)</div><div class="val"><code>2</code> = "Earn coins when you trade", the coin rules (Home; skipped without a trading task)</div><div class="val"><code>3</code> = "Coins added to your balance", the balance card (Coins)</div><div class="val"><code>4</code> = "Redeem gifts with coins", the Redeem button (Coins)</div><div class="val"><code>5</code> = "Manage your coins", the tabs (Coins; skipped for guests)</div></td><td>Id of the step in the code.</td></tr><tr><td><code>step_count</code></td><td>string</td><td><code>5</code></td><td>Number of steps in this tour run: <code>5</code>; <code>4</code> for guests (no step 5) or customers without a trading task (no step 2); <code>3</code> when both.</td><td>Number of tour steps for this customer.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_tour_skip"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_tour_skip</code> <span class="evmeta">Screen: Home, Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer skips the tour part-way through.</dd><dt>When it is sent</dt><dd>When the customer taps <code>Skip tour</code>.</dd><dt>Location</dt><dd>The tour pop-up.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Skip rate of the tour, and the step skipped.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> in the code, in <code>shared/tour.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tour_step</code></td><td>string</td><td><code>2</code></td><td>Renamed from <code>step</code>. The step the customer was on when tapping skip (the step's id, meaning as on <code>loyalty_tour_step_view</code>). Never the last step, which has no <code>Skip tour</code> button.</td><td>Id of the step on screen.</td></tr><tr><td><code>step_count</code></td><td>string</td><td><code>5</code></td><td>Number of steps in this tour run: <code>5</code>; <code>4</code> for guests (no step 5) or customers without a trading task (no step 2); <code>3</code> when both.</td><td>Number of tour steps for this customer.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_tour_finish"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_tour_finish</code> <span class="evmeta">Screen: Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer reaches the end of the tour.</dd><dt>When it is sent</dt><dd>When the customer taps <code>Finish tour</code> on the last step.</dd><dt>Location</dt><dd>The tour pop-up, last step on Coins.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Completion rate of the tour.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> in the code, in <code>shared/tour.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tour_step</code></td><td>string</td><td><code>5</code></td><td>The id of the last step: <code>5</code>, or <code>4</code> for guests (meaning as on <code>loyalty_tour_step_view</code>).</td><td>Id of the step on screen.</td></tr><tr><td><code>step_count</code></td><td>string</td><td><code>5</code></td><td>Number of steps in this tour run: <code>5</code>; <code>4</code> for guests (no step 5) or customers without a trading task (no step 2); <code>3</code> when both.</td><td>Number of tour steps for this customer.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-4">E. Guests</h3><p>Answers the question: are customers who are not signed in drawn in by the rewards, and do they go on to sign up?</p><div class="scroll evblock" id="ev-loyalty_login_prompt_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_login_prompt_view</code> <span class="evmeta">Screen: Home, Coins · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>A customer who is not signed in sees the sign-up invitation sheet "Join to redeem rewards".</dd><dt>When it is sent</dt><dd>Every time the sheet opens, after the event of the button just tapped. <code>loyalty_join_card_view</code> (<code>source</code> = <code>redeem</code>) is sent at the same time: count one or the other, never both added together.</dd><dt>Location</dt><dd>A bottom sheet, opened from <code>Redeem</code>, the balance card, a reward card, <code>Explore all rewards</code> or <code>Redemption history</code>.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Denominator of the sign-up funnel: how many guests want to redeem.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> in the code, in <code>shared/components.js</code>, function <code>mountJoinSheet</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">The button that opened the sheet:</div><div class="val"><code>redeem</code> = the <code>Redeem</code> button on the balance card (Home, Coins)</div><div class="val"><code>balance</code> = the balance card on Home (guests only)</div><div class="val"><code>reward</code> = a reward card in the rewards grid on Home</div><div class="val"><code>explore</code> = the <code>Explore all rewards</code> button on Home</div><div class="val"><code>history</code> = the <code>Redemption history</code> link on Coins (guests only)</div></td><td>Fixed on each button.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_signup_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_signup_click</code> <span class="evmeta">Screen: Home, Earn, Coins · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>A customer who is not signed in taps <code>Sign up</code> to go to the app's sign-up screen.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The "How to start" panel on Earn, the "Your coins will show up here" card on Coins, and the "Join to redeem rewards" sheet.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Rate of guests who go on to sign up.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, function <code>joinPanel</code>; <code>pages/point-balance.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>source</code></td><td>string</td><td><code>redeem</code></td><td><div class="vtext">Where the customer tapped:</div><div class="val"><code>card</code> = the "How to start" panel on Earn, or the "Your coins will show up here" card on Coins</div><div class="val"><code>redeem</code> = the "Join to redeem rewards" sheet, opened by the button named in <code>from</code></div></td><td>Fixed by where the button is shown.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">The button that opened the sheet:</div><div class="val"><code>redeem</code> = the <code>Redeem</code> button on the balance card (Home, Coins)</div><div class="val"><code>balance</code> = the balance card on Home (guests only)</div><div class="val"><code>reward</code> = a reward card in the rewards grid on Home</div><div class="val"><code>explore</code> = the <code>Explore all rewards</code> button on Home</div><div class="val"><code>history</code> = the <code>Redemption history</code> link on Coins (guests only)</div><div class="vtext">Only when <code>source</code> = <code>redeem</code>.</div></td><td>As on <code>loyalty_join_card_view</code>.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_login_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_login_click</code> <span class="evmeta">Screen: Home, Earn, Coins · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>A customer who is not signed in taps <code>Log in</code> (the line "Already have an account? Log in") to go to the app's log-in screen.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The same places as the <code>Sign up</code> button.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>How many guests already have an account.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, function <code>joinPanel</code>; <code>pages/point-balance.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>source</code></td><td>string</td><td><code>card</code></td><td><div class="vtext">Where the customer tapped:</div><div class="val"><code>card</code> = the "How to start" panel on Earn, or the "Your coins will show up here" card on Coins</div><div class="val"><code>redeem</code> = the "Join to redeem rewards" sheet, opened by the button named in <code>from</code></div></td><td>Fixed by where the button is shown.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">The button that opened the sheet:</div><div class="val"><code>redeem</code> = the <code>Redeem</code> button on the balance card (Home, Coins)</div><div class="val"><code>balance</code> = the balance card on Home (guests only)</div><div class="val"><code>reward</code> = a reward card in the rewards grid on Home</div><div class="val"><code>explore</code> = the <code>Explore all rewards</code> button on Home</div><div class="val"><code>history</code> = the <code>Redemption history</code> link on Coins (guests only)</div><div class="vtext">Only when <code>source</code> = <code>redeem</code>.</div></td><td>As on <code>loyalty_join_card_view</code>.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-5">F. Redemption history</h3><p>Answers the question: do customers come back to check their reward orders and get their codes?</p><div class="scroll evblock" id="ev-loyalty_orders_open"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_orders_open</code> <span class="evmeta">Screen: Coins · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps the <code>Redemption history</code> link under the <code>Redeem</code> button to see their reward orders. For guests, the link opens the sign-up invitation sheet; the event is still sent.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The balance card on Coins.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>How many customers come back to check their reward orders.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, function <code>balanceBlock</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_order_open"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_order_open</code> <span class="evmeta">Screen: Redemption history · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps an order in the list to see its details.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The order list on the Redemption history page.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Which order statuses get viewed most (for example, whether customers keep checking orders in process).</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>status</code></td><td>string</td><td><code>completed</code></td><td><div class="vtext">Status of the order:</div><div class="val"><code>new</code> = Order placed (placed, not processed yet)</div><div class="val"><code>on process</code> = Processing (being processed)</div><div class="val"><code>completed</code> = Completed (reward or code delivered)</div><div class="val"><code>canceled</code> = Cancelled (order cancelled)</div><div class="val"><code>failed</code> = Failed (unsuccessful; per the backend, the coins of a failed order are returned to the balance, see spec §50, the line "a failed order is refunded")</div><div class="vtext">Any other value the backend sends is passed on as is.</div></td><td>The <code>status</code> field of the order list API (<code>/loyalty/orders</code>).</td></tr><tr><td colspan="5" class="none">Also sent: the 8 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_code_reveal"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_code_reveal</code> <span class="evmeta">Screen: Redemption history · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps <code>Show</code> to reveal a hidden voucher code, PIN or token number.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The order details page.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>How many customers actually get their reward codes.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>kind</code></td><td>string</td><td><code>code</code></td><td><div class="vtext">Kind of code revealed:</div><div class="val"><code>code</code> = the voucher code of an e-voucher</div><div class="val"><code>pin</code> = the PIN that comes with an e-voucher</div><div class="val"><code>serial</code> = the token number of a PLN or mobile-credit reward (labelled <code>Token number</code> on the page)</div></td><td>Fixed on each <code>Show</code> button.</td></tr><tr><td><code>item_type</code></td><td>string</td><td><code>egift</code></td><td><div class="vtext">Kind of reward:</div><div class="val"><code>egift</code> = e-voucher (code, PIN or voucher link)</div><div class="val"><code>physical</code> = physical goods delivered to the door</div><div class="val"><code>pln</code> = PLN electricity token</div><div class="val"><code>pulsa</code> = mobile credit top-up</div><div class="val"><code>other</code> = any other kind the backend sends</div></ <h2>3. How events are sent</h2>
<p>Every event goes through a single file, <code>shared/tracking.js</code>. It pushes the event onto <code>window.dataLayer</code>; Google Tag Manager reads from there and forwards it. Outside this file, nothing in the code touches <code>dataLayer</code>.</p>

<h3>3.1 Two ways an event is sent</h3>
<table>
  <tr><th style="width:22%">Kind</th><th style="width:38%">How it is attached</th><th>When it is used</th></tr>
  <tr><td>Button tap</td><td>The <code>data-track</code> attribute on the button; its own properties are written as <code>data-track-&lt;name&gt;</code>. One shared listener reads these attributes</td><td>Every event whose name ends with <code>_click</code>, and the other tap events. To measure a new button, only add the attributes; no code</td></tr>
  <tr><td>View</td><td>A call to <code>trackView()</code> in the code when the component appears</td><td>Events whose name ends with <code>_view</code>. Sent only once per page load</td></tr>
  <tr><td>Other cases</td><td>A call to <code>track()</code> in the code</td><td>Events that depend on logic, such as choosing a date range or the steps of the tour</td></tr>
</table>
<p>Example on a button:</p>
<pre class="hl">&lt;button data-track=<span class="str">"loyalty_reward_click"</span> data-track-position=<span class="str">"1"</span>&gt;Redeem&lt;/button&gt;</pre>
<p>Example of a call in the code:</p>
<pre class="hl"><span class="kw">import</span> { track, trackView } <span class="kw">from</span> <span class="str">'./tracking.js'</span>;

<span class="cm">// Sent once per page load</span>
<span class="fn">trackView</span>(<span class="str">'loyalty_join_card_view'</span>, { step: <span class="str">'kyc'</span> });

<span class="cm">// Sent every time it is called</span>
<span class="fn">track</span>(<span class="str">'loyalty_tour_skip'</span>, { step: <span class="num">2</span> });</pre>
<p>Result in <code>dataLayer</code>:</p>
<pre class="hl"><span class="cm">// One event in the dataLayer: its name, every event property cleared (undefined),</span>
<span class="cm">// the common properties, then its own properties. Every value is text.</span>
window.dataLayer.<span class="fn">push</span>({
  event: <span class="str">'loyalty_trade_click'</span>,
  source: undefined, <span class="kw">from</span>: undefined, tier: undefined, /* … every other event property … */
  page: <span class="str">'earn'</span>,
  theme: <span class="str">'light'</span>,
  has_task: <span class="str">'true'</span>,
  join_step: <span class="str">'none'</span>,
  credit_mode: <span class="str">'in-day'</span>,
  balance_range: <span class="str">'1000-4999'</span>,
  loyalty_tier: <span class="str">'vip'</span>,
  capped: <span class="str">'false'</span>
});</pre>

<h3 id="common">3.2 Common properties</h3>
<p>The 8 properties below are sent with every event. They are set once, when the page opens.</p>
<div class="scroll"><table><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup>
  <tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr>
  <tr><td><code>page</code></td><td>string</td><td><code>earn</code></td><td><div class="vtext">The page where the event happened:</div><div class="val"><code>home</code> = Home</div><div class="val"><code>earn</code> = Earn (the daily trading task)</div><div class="val"><code>coins</code> = Coins (coin balance and history)</div><div class="val"><code>orders</code> = Redemption history (reward orders)</div></td><td>Fixed for each page when the page opens.</td></tr><tr><td><code>theme</code></td><td>string</td><td><code>light</code></td><td>The colour mode on screen: <code>light</code> or <code>dark</code>.</td><td>The <code>data-theme</code> attribute of the page.</td></tr><tr><td><code>has_task</code></td><td>String</td><td><code>true</code></td><td><div class="val"><code>true</code> = the customer has a trading task (the Earn tab is there)</div><div class="val"><code>false</code> = the trading task is off or hidden for the customer (no Earn tab)</div><div class="vtext">Sent as text.</div></td><td>The field <code>tradingTask</code> of the trading task API.</td></tr><tr><td><code>join_step</code></td><td>string</td><td><code>none</code></td><td><div class="vtext">The step the customer still has to take before earning coins:</div><div class="val"><code>signup</code> = not signed in (guest)</div><div class="val"><code>kyc</code> = signed in, KYC not done</div><div class="val"><code>deposit</code> = KYC done, no first deposit yet</div><div class="val"><code>none</code> = no step left, or a signed-in customer without a trading task (then <code>none</code> does not mean KYC is done)</div></td><td>From the app's sign-in data: <code>kycApproveTime</code> = 0 is <code>kyc</code>; <code>kycApproveTime</code> &gt; 0 and <code>firstDepositTime</code> = 0 is <code>deposit</code>; otherwise <code>none</code>. A signed-in customer without a trading task is always <code>none</code>. When the app opens the page without a token: <code>signup</code>.</td></tr><tr><td><code>credit_mode</code></td><td>string</td><td><code>in-day</code></td><td><div class="val"><code>in-day</code> = coins credited within the trading day</div><div class="val"><code>delayed</code> = coins credited some days after the trading day</div><div class="val"><code>none</code> = the customer has no trading task</div></td><td>The field <code>program.creditMode</code> of the trading task API.</td></tr><tr><td><code>balance_range</code></td><td>string</td><td><code>1000-4999</code></td><td>Coin balance as a range: <code>0</code>, <code>1-999</code>, <code>1000-4999</code>, <code>5000+</code>. The exact balance is not sent.</td><td>Computed from the field <code>available</code> of the coin summary API.</td></tr><tr><td><code>loyalty_tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">The customer's tier: the highest tier among the customer's eligible accounts.</div><div class="val"><code>micro</code>, <code>standard</code>, <code>vip</code>, <code>platinum</code> = meaning as on <code>loyalty_upgrade_open</code></div><div class="val"><code>none</code> = no eligible account on the 4 tiers (no live account yet, no trading task, no account earns coins, or the accounts are in another MT5 group)</div><div class="vtext">Not sent for guests. GTM sets it as the GA4 user property <code>loyalty_tier</code>.</div></td><td>From the accounts' MT5 groups (the <code>accounts[].group</code> and <code>accounts[].eligible</code> fields of the trading task API).</td></tr><tr><td><code>view</code></td><td>string</td><td><code>list</code></td><td><div class="vtext">Redemption history page only:</div><div class="val"><code>list</code> = a list with orders</div><div class="val"><code>empty</code> = no orders yet</div><div class="val"><code>detail</code> = one order's details, including when the order could not be opened</div></td><td>Set when the page opens.</td></tr>
</table></div>

<h3>3.3 Limits and notes</h3>
<ul>
  <li><b>GA4 limits:</b> event and property names up to 40 characters, values up to 100 characters, up to 25 properties per event. All current events are within the limits.</li>
  <li><b>Data types:</b> every value is sent as text, including <code>"true"</code> or <code>"1"</code>, so a GA4 custom dimension never mixes types.</li>
  <li><b>Clearing old properties:</b> GTM keeps the last value of every property. So on every push, every event property is first set to <code>undefined</code>, then the event's own properties are added; otherwise an event without <code>source</code> would be read with the <code>source</code> of an earlier event. A new property must be added to the <code>PARAMS</code> list in <code>shared/tracking.js</code>.</li>
  <li><b>Automatic check:</b> <code>node tools/check-tracking.mjs</code> opens the pages, taps through them and reports any event that differs from this list.</li>
  <li><b>Events of buttons that leave the page:</b> the navigation bar, the cards on Home, <code>Skip tour</code> and <code>Finish tour</code> push the event before the page changes.</li>
  <li><b>Without GTM:</b> the pages still work normally; events simply wait in <code>dataLayer</code>.</li>
</ul>

<h3>3.4 Setting up GTM and GA4</h3>
<table>
  <tr><th style="width:8%">Step</th><th>What to do</th></tr>
  <tr><td>1</td><td>In GTM, create a Custom Event trigger, with regular expression matching turned on, and the event name <code>^loyalty_</code></td></tr>
  <tr><td>2</td><td>Create a GA4 Event tag that uses this trigger, with the event name <code>{{Event}}</code></td></tr>
  <tr><td>3</td><td>Create a Data Layer Variable for each property and add them to the tag as event parameters; add <code>loyalty_tier</code> under the tag's User Properties instead</td></tr>
  <tr><td>4</td><td>In GA4, register the properties you want to split reports by as custom dimensions <b>before launch</b> (GA4 does not apply them to data already collected): event-scoped for the common and event properties, user-scoped for <code>loyalty_tier</code></td></tr>
  <tr><td>5</td><td>In GA4: set data retention to 14 months; turn off "Page changes based on browser history events" in the web stream's enhanced measurement (the tour changes the page address without loading a new page); mark <code>loyalty_kyc_click</code>, <code>loyalty_deposit_click</code>, <code>loyalty_signup_click</code>, <code>loyalty_trade_click</code>, <code>loyalty_redeem_click</code> as key events</td></tr>
  <tr><td>6</td><td>Forward the same events to CleverTap. <span class="pending">PENDING</span></td></tr>
</table>

<h3>3.5 Adding or changing an event</h3>
<ol>
  <li>Name it following the conventions in the tab <a href="#overview" class="ref">1. Overview</a>.</li>
  <li>For a button tap: add <code>data-track</code> to the button. Otherwise: call <code>track()</code> or <code>trackView()</code>.</li>
  <li>Add a row to <code>events.csv</code>, its own properties to <code>event_properties.csv</code>, and a row to <code>changelog.csv</code>; then rebuild this page.</li>
</ol>
</section><section class="panel" id="changelog" role="tabpanel">
<h2>4. Change history</h2>
<p>Every time an event is added, changed or removed it is recorded here, newest first.</p>

<h2>1. 概览</h2>
<p>本文档记录 HSB Loyalty 计划界面发送的全部追踪事件：每个事件的含义、发送时机、所在页面以及携带的属性。读者为前端开发人员、数据与市场人员以及 QA。本文档只涉及事件；消息计划和后端逻辑见<a href="https://nemodao.github.io/lytpg_clevertap/" class="ext" target="_blank" rel="noopener">CleverTap 通知文档</a>。</p>
<p>计划在 app 的 webview 中有四个页面：<b>Home</b>、<b>Earn</b>、<b>Coins</b> 和 <b>Redemption history</b>（兑换记录，从 Coins 打开）。未登录的客户也能查看这些页面。目前共有 33 个事件和 8 个公共属性。</p>
<h3>约定</h3>
<ul>
  <li><b>事件名称：</b>英文，<code>snake_case</code> 格式，按 <code>loyalty_&lt;object&gt;_&lt;action&gt;</code> 的模式命名。动作为 <code>view</code>（客户看到）、<code>click</code>（客户点击），或具体动词，如 <code>start</code>、<code>apply</code>。</li>
  <li><b>属性名称：</b>英文，<code>snake_case</code> 格式。</li>
  <li><b>客户标识：</b>使用 <code>client_id</code>。页面不发送此 ID；Google Tag Manager 在客户登录时将其设为用户属性 <code>client_id</code>。</li>
  <li><b>绝不发送：</b>交易账号、精确余额、客户姓名或任何个人信息。余额只按区间发送。</li>
  <li><b>“看到”类事件</b>每次页面加载只发送一次，无论页面重绘多少次。</li>
</ul>

<h2>2. 各事件详情</h2>
<p>33 个事件，按其回答的分析问题分为 7 组。每个事件是一个区块：名称行、说明，然后是该事件自身属性的表格。</p>
<p><a href="#grp-0" class="ref">A. 从注册到交易</a> · <a href="#grp-1" class="ref">B. 对奖品的兴趣</a> · <a href="#grp-2" class="ref">C. 页面使用情况</a> · <a href="#grp-3" class="ref">D. 引导教程</a> · <a href="#grp-4" class="ref">E. 访客</a> · <a href="#grp-5" class="ref">F. 兑换记录</a> · <a href="#grp-6" class="ref">G. 故障</a></p><h3 id="grp-0">A. 从注册到交易</h3><p>回答的问题：客户是否走完从邀请到 KYC、入金和交易的整个漏斗。</p><div class="scroll evblock" id="ev-loyalty_join_card_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_join_card_view</code> <span class="evmeta">页面：Home、Earn、Coins、Redemption history · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户看到开始邀请：“How to start”面板（获得 coin 前需完成的步骤）或 Coins 上的“Your coins will show up here”卡片。对有交易任务但尚未完成 KYC 或尚未首次入金的客户显示（<code>join_step</code> = <code>kyc</code>、<code>deposit</code>），也对访客显示（<code>join_step</code> = <code>signup</code>）。</dd><dt>发送时机</dt><dd>面板显示时。Earn 上的面板以及 Coins 上的注册卡片：每次加载页面只发送一次。邀请面板（“Start earning to redeem”，访客为“Join to redeem rewards”）：每次打开都发送。</dd><dt>位置</dt><dd>Earn 上的 Today 卡片；Coins 上的“Your coins will show up here”卡片（访客）；客户在 Home、Coins 和 Redemption history 上点击 <code>Redeem</code>、奖品卡片、<code>Explore all rewards</code>、空的 Redemption history 上的 <code>Explore rewards</code>，或（访客）余额卡片或 <code>Redemption history</code> 时打开的邀请面板。面板标题为“Start earning to redeem”（访客：“Join to redeem rewards”）；属性 <code>source</code> = <code>redeem</code>，<code>from</code> = 打开面板的按钮。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>KYC 和入金漏斗的分母：有多少客户看到了邀请。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>在代码中调用 <code>trackView()</code> （邀请面板：<code>track()</code>，每次打开时），位于 <code>shared/components.js</code>，函数 <code>joinPanel</code> 和 <code>mountJoinSheet</code>；<code>pages/point-balance.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th>
