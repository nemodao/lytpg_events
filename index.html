<h1>HSB Loyalty Program – Front-end event tracking</h1>
<p class="sub">Các event mà giao diện chương trình HSB Loyalty gửi đi. Cập nhật: 2026-10-23.</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. Overview</button><button type="button" role="tab" data-tab="events" aria-selected="false">2. Event details</button><button type="button" role="tab" data-tab="sending" aria-selected="false">3. How events are sent</button><button type="button" role="tab" data-tab="changelog" aria-selected="false">4. Change history</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>1. Overview</h2>
<p>This document records every tracking event sent by the interface of the HSB Loyalty programme: what each event is, when it is sent, on which screen, and which properties it carries. It is written for front-end developers, data and marketing staff, and QA. It covers events only; the message plan and the backend logic are in the <a href="https://nemodao.github.io/lytpg_clevertap/" class="ext" target="_blank" rel="noopener">CleverTap notification document</a>.</p>
<p>The programme has four pages running in the app's webview: <b>Home</b>, <b>Earn</b>, <b>Coins</b> and <b>Redemption history</b> (the reward orders, opened from Coins). Customers who are not signed in can see these pages too. When Plan B is on (<code>redeem_mode</code> = <code>store</code>), there is also the rewards store <b>Reward Store</b> (two tabs, Home Store and Categories) and a reward page for each reward, running in the same webview in place of the Tada store; Checkout does not work yet (group H). There are 38 events and 11 common properties.</p>
<h3>Conventions</h3>
<ul>
  <li><b>Event names:</b> English, <code>snake_case</code>, following the pattern <code>loyalty_&lt;object&gt;_&lt;action&gt;</code>. The action is <code>view</code> (the customer sees something), <code>click</code> (the customer taps something), or a specific verb such as <code>start</code>, <code>apply</code>.</li>
  <li><b>Property names:</b> English, <code>snake_case</code>.</li>
  <li><b>Customer identity:</b> by <code>client_id</code>. When the customer is signed in, every event carries <code>client_id</code> (read from the app's token); customers who are not signed in have none. Google Tag Manager also sets it as the user property <code>client_id</code> when the customer signs in.</li>
  <li><b>Never sent:</b> trading account numbers, the exact balance, names or any personal data of the customer. The balance is only sent as a range.</li>
  <li><b>"View" events</b> are sent only once per page load, however many times the page redraws.</li>
</ul>

<table>
  <tr><th style="width:8%">Step</th><th style="width:30%">Where</th><th>What happens</th></tr>

  <tr><td>2</td><td>Google Tag Manager (GTM)</td><td>Receives every event whose name starts with <code>loyalty_</code> and attaches the user property <code>client_id</code></td></tr>
  <tr><td>3</td><td>GA4</td><td>Receives the event from GTM; used for analysis</td></tr>
  <tr><td>4</td><td>CleverTap</td><td>Receives the event from GTM; used to select customers for campaigns. <span class="pending">PENDING</span> The forwarding from GTM to CleverTap has not been confirmed</td></tr>
</table>

is reached, the button reads <code>Trade now</code>), or the button at the bottom of the account tier sheet when the account is already Platinum.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_redeem_click" class="ref"><code>loyalty_redeem_click</code></a></td><td>B. Interest in rewards</td><td>Home, Coins, Redemption history</td><td>The customer taps the <code>Redeem</code> button on the balance card or the <code>Explore rewards</code> button on Redemption history (when there are no orders yet) to go to the rewards store. For customers who are not signed in, or who have a trading task but have not completed KYC or a first deposit, the button opens an invitation sheet instead of the store; the event is still sent. When Plan B is on (<code>redeem_mode</code> = <code>store</code>), the button opens the rewards store in the webview (Reward Store) for every customer, not an invitation sheet.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_rewards_view" class="ref"><code>loyalty_rewards_view</code></a></td><td>B. Interest in rewards</td><td>Home</td><td>The customer sees the rewards grid on Home.</td><td>Handoff 6</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_reward_click" class="ref"><code>loyalty_reward_click</code></a></td><td>B. Interest in rewards</td><td>Home, Reward Store</td><td>The customer taps a reward: a card in the rewards grid on Home, or a reward in the rewards store, Reward Store (a card in the Popular section, a voucher in the F&amp;B section, a card in the Tour &amp; Travel section, a card in the list on the Categories tab). The <code>section</code> property says where the reward was tapped.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_expiring_notice_view" class="ref"><code>loyalty_expiring_notice_view</code></a></td><td>B. Interest in rewards</td><td>Home, Coins</td><td>The customer sees the warning that some coins will expire within the next 10 days.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_page_view" class="ref"><code>loyalty_page_view</code></a></td><td>C. Use of the pages</td><td>Home, Earn, Coins, Redemption history, Reward Store</td><td>The customer opens a page: a page of the programme, or a page of the rewards store, Reward Store (<code>page</code> = <code>store</code> or <code>reward</code>).</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_nav_click" class="ref"><code>loyalty_nav_click</code></a></td><td>C. Use of the pages</td><td>Home, Earn, Coins, Reward Store</td><td>The customer taps a tab in the bottom navigation bar, or taps the X button to leave the programme. In the Reward Store: taps the Home Store or Categories tab in the store's bottom bar, the Back button in that bar, or the Back button at the top of the reward page.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_card_click" class="ref"><code>loyalty_card_click</code></a></td><td>C. Use of the pages</td><td>Home</td><td>On Home, the customer taps the balance card to go to Coins, taps the <code>Earn more coins</code> card in the rewards grid to go to Earn, or taps <code>Explore all rewards</code> to go to the rewards store. For guests, the balance card opens the sign-up invitation sheet; for customers who are not signed in or have not completed KYC or a first deposit, <code>Explore all rewards</code> opens the invitation sheet instead of the store; the event is still sent. When Plan B is on, <code>Explore all rewards</code> opens the rewards store in the webview (Reward Store).</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_tab_click" class="ref"><code>loyalty_tab_click</code></a></td><td>C. Use of the pages</td><td>Earn, Coins</td><td>The customer switches tab inside a page.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_date_filter_apply" class="ref"><code>loyalty_date_filter_apply</code></a></td><td>C. Use of the pages</td><td>Earn, Coins</td><td>The customer chooses a date range for the list they are viewing.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_account_select" class="ref"><code>loyalty_account_select</code></a></td><td>C. Use of the pages</td><td>Earn</td><td>The customer taps a row in the account sheet, including the row of the account already selected (the account then does not change).</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_tier_badge_click" class="ref"><code>loyalty_tier_badge_click</code></a></td><td>C. Use of the pages</td><td>Home, Coins</td><td>The customer taps the account tier label (Micro, Standard, VIP, Platinum) on the balance card to go to Earn, which scrolls to the account field. On Home the label sits next to "Coin Balance"; on Coins it hangs on the top edge of the balance card.</td><td>Handoff 6</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_upgrade_row_view" class="ref"><code>loyalty_upgrade_row_view</code></a></td><td>C. Use of the pages</td><td>Earn</td><td>The customer sees the upgrade row under the account field. The row shows only when the selected account earns coins (Eligible), is on one of the 4 tiers, and the programme has not ended.</td><td>Handoff 6</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_upgrade_open" class="ref"><code>loyalty_upgrade_open</code></a></td><td>C. Use of the pages</td><td>Earn</td><td>The customer taps the "Want more coins per lot?" row under the account field to open the account tier sheet.</td><td>Handoff 5</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_terms_open" class="ref"><code>loyalty_terms_open</code></a></td><td>C. Use of the pages</td><td>Earn</td><td>The customer opens the Terms &amp; Conditions.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_daily_cap_view" class="ref"><code>loyalty_daily_cap_view</code></a></td><td>C. Use of the pages</td><td>Earn</td><td>The customer sees the message that today's maximum coins have been reached.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_tour_start" class="ref"><code>loyalty_tour_start</code></a></td><td>D. Guided tour</td><td>Home</td><td>The guided tour starts from its first step.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_tour_step_view" class="ref"><code>loyalty_tour_step_view</code></a></td><td>D. Guided tour</td><td>Home, Coins</td><td>A step of the tour is shown.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_tour_skip" class="ref"><code>loyalty_tour_skip</code></a></td><td>D. Guided tour</td><td>Home, Coins</td><td>The customer skips the tour part-way through.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_tour_finish" class="ref"><code>loyalty_tour_finish</code></a></td><td>D. Guided tour</td><td>Coins</td><td>The customer reaches the end of the tour.</td><td>Handoff 2</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_login_prompt_view" class="ref"><code>loyalty_login_prompt_view</code></a></td><td>E. Guests</td><td>Home, Coins, Reward Store</td><td>A customer who is not signed in sees the sign-up invitation sheet: the "Join to redeem rewards" sheet, or the "Checkout is coming soon" sheet with Sign up and Log in buttons when <code>Checkout</code> is tapped on the reward page.</td><td>Handoff 5</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_signup_click" class="ref"><code>loyalty_signup_click</code></a></td><td>E. Guests</td><td>Home, Earn, Coins, Reward Store</td><td>A customer who is not signed in taps <code>Sign up</code> to go to the app's sign-up screen.</td><td>Handoff 5</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_login_click" class="ref"><code>loyalty_login_click</code></a></td><td>E. Guests</td><td>Home, Earn, Coins, Reward Store</td><td>A customer who is not signed in taps <code>Log in</code> (the line "Already have an account? Log in") to go to the app's log-in screen.</td><td>Handoff 5</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_orders_open" class="ref"><code>loyalty_orders_open</code></a></td><td>F. Redemption history</td><td>Coins</td><td>The customer taps the <code>Redemption history</code> link under the <code>Redeem</code> button to see their reward orders. For guests, the link opens the sign-up invitation sheet; the event is still sent.</td><td>Handoff 5</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_order_open" class="ref"><code>loyalty_order_open</code></a></td><td>F. Redemption history</td><td>Redemption history</td><td>The customer taps an order in the list to see its details.</td><td>Handoff 5</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_code_reveal" class="ref"><code>loyalty_code_reveal</code></a></td><td>F. Redemption history</td><td>Redemption history</td><td>The customer taps <code>Show</code> to reveal a hidden voucher code, PIN or token number.</td><td>Handoff 5</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_code_copy" class="ref"><code>loyalty_code_copy</code></a></td><td>F. Redemption history</td><td>Redemption ne category (or all rewards, or the "More categories" card).</td><td>Handoff 7</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_checkout_click" class="ref"><code>loyalty_checkout_click</code></a></td><td>H. Rewards store (Plan B)</td><td>Reward Store</td><td>The customer taps <code>Checkout</code> on a reward page. Checkout does not work yet: depending on the customer, a sheet appears saying they do not have enough coins, saying it is coming soon, or inviting them to sign up. This is the store's main signal of demand for redeeming rewards.</td><td>Handoff 7</td><td><span class="st st-wip">In progress</span></td></tr><tr><td><a href="#ev-loyalty_earn_more_click" class="ref"><code>loyalty_earn_more_click</code></a></td><td>H. Rewards store (Plan B)</td><td>Reward Store</td><td>A customer without enough coins taps <code>Learn how to earn coins</code> in the "Not enough coins yet" sheet to go to the Earn page.</td><td>Handoff 7</td><td><span class="st st-wip">In progress</span></td></tr>
