val"><code>ewallet</code> = e-wallet top-up (for example OVO, GoPay)</div><div class="val"><code>other</code> = any other kind the backend sends</div></td><td>The <code>itemType</code> field of the item in the order details API (Tada's data); any kind other than the 5 above is sent as <code>other</code>.</td></tr><tr><td><code>status</code></td><td>string</td><td><code>completed</code></td><td>Status of the order, as on <code>loyalty_order_open</code>.</td><td>The <code>status</code> field of the order details API.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_code_copy"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_code_copy</code> <span class="evmeta">Screen: Redemption history · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps <code>Copy</code> to copy a voucher code, PIN, token number, waybill number or order number.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The order details page.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Which codes get copied most; whether customers use their rewards right away.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>kind</code></td><td>string</td><td><code>code</code></td><td><div class="vtext">Kind of code copied:</div><div class="val"><code>code</code>, <code>pin</code>, <code>serial</code> = as on <code>loyalty_code_reveal</code>; can be copied only after tapping <code>Show</code></div><div class="val"><code>awb</code> = the waybill number of physical goods</div><div class="val"><code>order</code> = the order number (<code>Order number</code>) at the top of the details page</div></td><td>Fixed on each <code>Copy</code> button.</td></tr><tr><td><code>item_type</code></td><td>string</td><td><code>egift</code></td><td><div class="vtext">Kind of reward:</div><div class="val"><code>egift</code> = e-voucher (code, PIN or voucher link)</div><div class="val"><code>physical</code> = physical goods delivered to the door</div><div class="val"><code>pln</code> = PLN electricity token</div><div class="val"><code>pulsa</code> = mobile credit top-up</div><div class="val"><code>ewallet</code> = e-wallet top-up (for example OVO, GoPay)</div><div class="val"><code>other</code> = any other kind the backend sends</div><div class="vtext">Absent when the order number is copied.</div></td><td>The <code>itemType</code> field of the item in the order details API (Tada's data); any kind other than the 5 above is sent as <code>other</code>.</td></tr><tr><td><code>status</code></td><td>string</td><td><code>completed</code></td><td>Status of the order, as on <code>loyalty_order_open</code>.</td><td>The <code>status</code> field of the order details API.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_voucher_open"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_voucher_open</code> <span class="evmeta">Screen: Redemption history · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps <code>Open voucher</code> to open the voucher link in the app.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>An e-voucher item with a link, on the order details page.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>How many customers open a voucher from the details page.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>item_type</code></td><td>string</td><td><code>egift</code></td><td><div class="vtext">Kind of reward:</div><div class="val"><code>egift</code> = e-voucher (code, PIN or voucher link)</div><div class="val"><code>physical</code> = physical goods delivered to the door</div><div class="val"><code>pln</code> = PLN electricity token</div><div class="val"><code>pulsa</code> = mobile credit top-up</div><div class="val"><code>ewallet</code> = e-wallet top-up (for example OVO, GoPay)</div><div class="val"><code>other</code> = any other kind the backend sends</div></td><td>The <code>itemType</code> field of the item in the order details API (Tada's data); any kind other than the 5 above is sent as <code>other</code>.</td></tr><tr><td><code>status</code></td><td>string</td><td><code>completed</code></td><td>Status of the order, as on <code>loyalty_order_open</code>.</td><td>The <code>status</code> field of the order details API.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-6">G. Problems</h3><p>Answers the question: how often does a page fail to load?</p><div class="scroll evblock" id="ev-loyalty_error_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_error_view</code> <span class="evmeta">Screen: Home, Earn, Coins, Redemption history, Reward Store · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>Something could not be loaded for the customer: the whole page (the "Couldn’t load this page" card), one reward order, the next part of a list ("Couldn't load more"), or the reward page of a reward that is not in the rewards list ("This reward is no longer available"); the <code>error_scope</code> property says which.</dd><dt>When it is sent</dt><dd>When the "Couldn’t load this page" card appears (the whole page, or one order on Redemption history); sent once per page load. <code>more</code>: when the "Couldn’t load more" line appears, on Coins and Redemption history; also once per page load.</dd><dt>Location</dt><dd>In place of the whole page content (<code>page</code>, <code>order</code>); the "Couldn’t load more. Try again" line at the end of a list (<code>more</code>, on Coins and Redemption history).</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>How often loading fails, against <code>loyalty_page_view</code>. Note: when the real API fails as a page opens, the page shows no error card and sends no event (spec §54).</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>Called with <code>trackView()</code> in code, in <code>shared/components.js</code>, function <code>showStatus</code>; <code>pages/point-balance.js</code>, <code>pages/redemptions.js</code>, <code>pages/reward.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>error_scope</code></td><td>string</td><td><code>page</code></td><td><div class="vtext">What could not be loaded:</div><div class="val"><code>page</code> = the whole page (the "Couldn’t load this page" card)</div><div class="val"><code>order</code> = one order on the details page (unknown, not the customer's, or a network error)</div><div class="val"><code>more</code> = the next part at the end of a list ("Couldn’t load more")</div><div class="val"><code>reward</code> = the reward page of a reward that is not in the rewards list ("This reward is no longer available"); see <code>reward_count</code></div></td><td>Set by where the error happened.</td></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>0</code></td><td><div class="vtext">Only when <code>error_scope</code> = <code>reward</code>: the number of rewards in the rewards list at that moment.</div><div class="val"><code>0</code> = the rewards list is empty or the rewards list API failed</div><div class="vtext">greater than <code>0</code> = the reward has been removed from the store (or the link is wrong)</div></td><td>Number of rewards returned by the rewards list API.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_retry_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_retry_click</code> <span class="evmeta">Screen: Home, Earn, Coins, Redemption history · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps to try loading again after an error.</dd><dt>When it is sent</dt><dd>When the customer taps the <code>Try again</code> button on the "Couldn’t load this page" card (<code>error_scope</code> = <code>page</code> or <code>order</code>).</dd><dt>Location</dt><dd>The button on the "Couldn’t load this page" card (the whole page, or one order). <code>Try again</code> on the "Couldn’t load more" line does not send this event.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows whether customers retry or leave.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, function <code>showStatus</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-7">H. Rewards store (Plan B)</h3><p>Answers the question: when Plan B is on, where do customers enter the rewards store from, what do they look at, which rewards do they want to redeem, do they have enough coins or not, and does the store lead customers to trade or to sign up? Only when `redeem_mode` = `store`.</p><div class="scroll evblock" id="ev-loyalty_store_section_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_store_section_view</code> <span class="evmeta">Screen: Reward Store · Since: Handoff 7</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer sees a section of the Home Store tab in the rewards store: Popular Rewards, F&amp;B e-Vouchers or Tour &amp; Travel.</dd><dt>When it is sent</dt><dd>When the section's first reward card (for Tour &amp; Travel: the panel's title) is at least half on screen; each section is sent once per page load.</dd><dt>Location</dt><dd>The Home Store tab of the Reward Store. Popular and the top of the F&amp;B section are usually visible on opening; Tour &amp; Travel is further down and needs scrolling to be seen.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Denominator of each section's reward click rate; shows whether customers scroll down to F&amp;B and Tour &amp; Travel. Read by number of customers, not number of events (the page reloads every time the customer comes back).</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>trackView()</code> in the code, in <code>pages/store.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>section</code></td><td>string</td><td><code>travel</code></td><td><div class="vtext">The section just seen:</div><div class="val"><code>popular</code> = Popular Rewards</div><div class="val"><code>fnb</code> = F&amp;B e-Vouchers</div><div class="val"><code>travel</code> = Tour &amp; Travel</div></td><td>Fixed for each section.</td></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>4</code></td><td>Number of rewards in the section: usually <code>8</code> (Popular), <code>4</code> (F&amp;B), <code>4</code> (Tour &amp; Travel); fewer when the rewards list is short.</td><td>Number of reward cards in that section.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_category_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_category_view</code> <span class="evmeta">Screen: Reward Store · Since: Handoff 7</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The Categories tab of the rewards store shows the list of rewards in one category (or all rewards, or the "More categories" card).</dd><dt>When it is sent</dt><dd>When the customer chooses with a chip or with <code>See all</code> (<code>from</code> = <code>chip</code>, <code>see_all</code>): sent on every change, since this is the customer's choice; tapping the selected chip again does not send it. When the list only appears because a tab or the page opens (<code>from</code> = <code>tab</code>, <code>page_load</code>): each category is sent once per page load.</dd><dt>Location</dt><dd>The Categories tab of the Reward Store: the row of category chips (All, 5 categories, More categories) and the rewards list below.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Which categories draw interest; how many customers want more categories (<code>category</code> = <code>more</code>); denominator of the reward click rate in the list. Real demand is <code>from</code> = <code>chip</code> or <code>see_all</code>.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> / <code>trackView()</code> in the code, in <code>pages/store.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>category</code></td><td>string</td><td><code>fnb_voucher</code></td><td><div class="vtext">The list on screen:</div><div class="val"><code>all</code> = the All chip (every reward)</div><div class="val"><code>gadget_electronics</code>, <code>tour_travel</code>, <code>shopping_voucher</code>, <code>fnb_voucher</code>, <code>home_living</code> = that category (meaning as on <code>loyalty_reward_click</code>)</div><div class="val"><code>more</code> = the "More categories" chip: the "2,000+ rewards on the way" card, with no rewards (the customer wants more categories)</div></td><td>The selected chip.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>chip</code></td><td><div class="vtext">Why the list appeared:</div><div class="val"><code>chip</code> = the customer tapped a category chip</div><div class="val"><code>see_all</code> = the customer tapped <code>See all</code> of a section on the Home Store tab (Popular opens <code>all</code>, F&amp;B opens <code>fnb_voucher</code>, Tour &amp; Travel opens <code>tour_travel</code>)</div><div class="val"><code>tab</code> = the customer tapped the Categories tab in the bottom bar; the list shows the category chosen last time</div><div class="val"><code>page_load</code> = the store opened directly on the Categories tab (for example, coming back from a reward page)</div><div class="vtext">The customer's real demand is <code>chip</code> and <code>see_all</code>.</div></td><td>Set by how the customer reached the list.</td></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>10</code></td><td>Number of rewards in the list on screen. <code>0</code> = the category has no rewards yet, or <code>category</code> = <code>more</code>.</td><td>Counts the category's rewards in the rewards list.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_checkout_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_checkout_click</code> <span class="evmeta">Screen: Reward Store · Since: Handoff 7</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps <code>Checkout</code> on a reward page. Checkout does not work yet: depending on the customer, a sheet appears saying they do not have enough coins, saying it is coming soon, or inviting them to sign up. This is the store's main signal of demand for redeeming rewards.</dd><dt>When it is sent</dt><dd>Every time the customer taps <code>Checkout</code> (tapping again after closing the sheet also sends it): read demand by number of customers, or by customer and reward.</dd><dt>Location</dt><dd>The <code>Checkout</code> button pinned to the bottom of the reward page.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>How many customers want to redeem which rewards, at which price levels; how many customers with enough coins are waiting for checkout to open; how many coins those without enough are short. A key event in GA4.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/reward.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>reward_id</code></td><td>string</td><td><code>101</code></td><td>ID of the reward.</td><td>The <code>id</code> field of the rewards list API (<code>/pointSys/app/point/catalog</code>).</td></tr><tr><td><code>reward_name</code></td><td>string</td><td><code>iPhone 16 Pro</code></td><td>The reward's name, as HSB sends it (cut at 100 characters). The name can be edited, so report by <code>reward_id</code> and use the name as a label.</td><td>The <code>name</code> field of the rewards list API.</td></tr><tr><td><code>category</code></td><td>string</td><td><code>gadget_electronics</code></td><td><div class="vtext">The reward's category:</div><div class="val"><code>gadget_electronics</code> = Gadget &amp; Electronics (tech gadgets)</div><div class="val"><code>tour_travel</code> = Tour &amp; Travel (travel)</div><div class="val"><code>shopping_voucher</code> = Shopping e-Voucher (shopping vouchers)</div><div class="val"><code>fnb_voucher</code> = F&amp;B e-Voucher (food and drink vouchers)</div><div class="val"><code>home_living</code> = Home &amp; Living (household goods)</div><div class="val"><code>none</code> = a reward with no category (shown only under the <code>All</code> chip)</div></td><td>The <code>category</code> field of the rewards list API; <code>none</code> is sent when it is missing or empty.</td></tr><tr><td><code>badge</code></td><td>string</td><td><code>hot</code></td><td><div class="vtext">The reward's label, shown before the name on the reward page:</div><div class="val"><code>hot</code> = the HOT label</div><div class="val"><code>new</code> = the New label</div><div class="val"><code>none</code> = no label</div></td><td>The <code>badge</code> field of the rewards list API; <code>none</code> when it is missing.</td></tr><tr><td><code>price_range</code></td><td>string</td><td><code>50000+</code></td><td><div class="vtext">The reward's price (in coins), as a range; the exact price is not sent:</div><div class="val"><code>1-4999</code> = under 5,000 coins</div><div class="val"><code>5000-19999</code> = from 5,000 to under 20,000 coins</div><div class="val"><code>20000-49999</code> = from 20,000 to under 50,000 coins</div><div class="val"><code>50000+</code> = 50,000 coins or more</div><div class="vtext">The range boundaries are set from the sample data (prices from 1,000 to 150,000 coins); confirm them against the real prices before going live.</div></td><td>Computed from the <code>points</code> field (price in coins) of the rewards list API.</td></tr><tr><td><code>affordable</code></td><td>string</td><td><code>false</code></td><td><div class="vtext">Whether the balance covers the reward:</div><div class="val"><code>true</code> = the balance is greater than or equal to the price</div><div class="val"><code>false</code> = the balance is less than the price</div><div class="vtext">Not sent for guests (their balance is always 0, which would skew the "not enough coins" rate). Neither the exact balance nor the exact price is sent.</div></td><td>Compares the balance (<code>available</code> of the coin summary API) with the reward's price. Not sent when <code>join_step</code> = <code>signup</code>.</td></tr><tr><td><code>outcome</code></td><td>string</td><td><code>not_enough</code></td><td><div class="vtext">The sheet shown after the tap:</div><div class="val"><code>not_enough</code> = a signed-in customer whose balance is less than the price: the "Not enough coins yet" sheet (with a "Learn how to earn coins" button if the customer has a trading task)</div><div class="val"><code>coming_soon</code> = a signed-in customer with enough coins: the "Checkout is coming soon" sheet (including customers who have not completed KYC or a deposit but have enough coins; tell them apart by <code>join_step</code>)</div><div class="val"><code>guest</code> = a customer who is not signed in: the "Checkout is coming soon" sheet with Sign up and Log in buttons</div><div class="vtext">Can be derived from <code>affordable</code> and <code>join_step</code>; sent separately for easier reading.</div></td><td>The same comparison as for the sheet shown: guests first, then the balance against the price.</td></tr><tr><td><code>short_range</code></td><td>string</td><td><code>20000+</code></td><td><div class="vtext">Only when <code>outcome</code> = <code>not_enough</code>: how many coins the customer is short, as a range:</div><div class="val"><code>1-999</code> = short by under 1,000 coins</div><div class="val"><code>1000-4999</code> = short by 1,000 to under 5,000</div><div class="val"><code>5000-19999</code> = short by 5,000 to under 20,000</div><div class="val"><code>20000+</code> = short by 20,000 or more</div><div class="vtext">Together with the price, the balance can only be inferred as a range, not as an exact figure. The range boundaries need to be confirmed against the real prices.</div></td><td>The reward's price minus the balance.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_earn_more_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_earn_more_click</code> <span class="evmeta">Screen: Reward Store · Since: Handoff 7</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>A customer without enough coins taps <code>Learn how to earn coins</code> in the "Not enough coins yet" sheet to go to the Earn page.</dd><dt>When it is sent</dt><dd>When the customer taps. The button is absent when the customer has no trading task (the sheet only has a "Got it" button).</dd><dt>Location</dt><dd>The "Not enough coins yet" sheet opened from the <code>Checkout</code> button on the reward page.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Whether the store leads customers to trade to earn coins, and which rewards do it most. A key event in GA4. The real number of trades comes from the backend, joined by <code>client_id</code>.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/reward.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>reward_id</code></td><td>string</td><td><code>101</code></td><td>ID of the reward.</td><td>The <code>id</code> field of the rewards list API (<code>/pointSys/app/point/catalog</code>).</td></tr><tr><td><code>reward_name</code></td><td>string</td><td><code>iPhone 16 Pro</code></td><td>The reward's name, as HSB sends it (cut at 100 characters). The name can be edited, so report by <code>reward_id</code> and use the name as a label.</td><td>The <code>name</code> field of the rewards list API.</td></tr><tr><td><code>category</code></td><td>string</td><td><code>gadget_electronics</code></td><td><div class="vtext">The reward's category:</div><div class="val"><code>gadget_electronics</code> = Gadget &amp; Electronics (tech gadgets)</div><div class="val"><code>tour_travel</code> = Tour &amp; Travel (travel)</div><div class="val"><code>shopping_voucher</code> = Shopping e-Voucher (shopping vouchers)</div><div class="val"><code>fnb_voucher</code> = F&amp;B e-Voucher (food and drink vouchers)</div><div class="val"><code>home_living</code> = Home &amp; Living (household goods)</div><div class="val"><code>none</code> = a reward with no category (shown only under the <code>All</code> chip)</div></td><td>The <code>category</code> field of the rewards list API; <code>none</code> is sent when it is missing or empty.</td></tr><tr><td><code>badge</code></td><td>string</td><td><code>hot</code></td><td><div class="vtext">The reward's label, shown before the name on the reward page:</div><div class="val"><code>hot</code> = the HOT label</div><div class="val"><code>new</code> = the New label</div><div class="val"><code>none</code> = no label</div></td><td>The <code>badge</code> field of the rewards list API; <code>none</code> when it is missing.</td></tr><tr><td><code>price_range</code></td><td>string</td><td><code>50000+</code></td><td><div class="vtext">The reward's price (in coins), as a range; the exact price is not sent:</div><div class="val"><code>1-4999</code> = under 5,000 coins</div><div class="val"><code>5000-19999</code> = from 5,000 to under 20,000 coins</div><div class="val"><code>20000-49999</code> = from 20,000 to under 50,000 coins</div><div class="val"><code>50000+</code> = 50,000 coins or more</div><div class="vtext">The range boundaries are set from the sample data (prices from 1,000 to 150,000 coins); confirm them against the real prices before going live.</div></td><td>Computed from the <code>points</code> field (price in coins) of the rewards list API.</td></tr><tr><td><code>affordable</code></td><td>string</td><td><code>false</code></td><td><div class="vtext">Whether the balance covers the reward:</div><div class="val"><code>true</code> = the balance is greater than or equal to the price</div><div class="val"><code>false</code> = the balance is less than the price</div><div class="vtext">Not sent for guests (their balance is always 0, which would skew the "not enough coins" rate). Neither the exact balance nor the exact price is sent.</div></td><td>Compares the balance (<code>available</code> of the coin summary API) with the reward's price. Not sent when <code>join_step</code> = <code>signup</code>.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div></section><section class="panel" id="sending" role="tabpanel">
<h2>3. How events are sent</h2>
<p>Every event goes through a single file, <code>shared/tracking.js</code>. It pushes the event onto <code>window.dataLayer</code>; Google Tag Manager reads from there and forwards it. Outside this file, nothing in the code touches <code>dataLayer</code>.</p>

<h3>3.1 Two ways an event is sent</h3>
<table>
  <tr><th style="width:22%">Kind</th><th style="width:38%">How it is attached</th><th>When it is used</th></tr>
  <tr><td>Button tap</td><td>The <code>data-track</code> attribute on the button; its own properties are written as <code>data-track-&lt;name&gt;</code>. One shared listener reads these attributes</td><td>Every event whose name ends with <code>_click</code>, and the other tap events. To measure a new button, only add the attributes; no code</td></tr>
  <tr><td>View</td><td>A call to <code>trackView()</code> in the code when the component appears</td><td>Events whose name ends with <code>_view</code>. Sent only once per page load</td></tr>
  <tr><td>Other cases</td><td>A call to <code>track()</code> in the code</td><td>Events that depend on logic, such as choosing a date range or the steps of the tour</td></tr>
</table>
<p>Example on a button:</p>
<pre class="hl">&lt;button data-track=<span class="str">"loyalty_reward_click"</span> data-track-position=<span class="str">"1"</span>&gt;Redeem&lt;/button&gt;</pre>
<p>Example of a call in the code:</p>
<pre class="hl"><span class="kw">import</span> { track, trackView } <span class="kw">from</span> <span class="str">'./tracking.js'</span>;

<span class="cm">// Sent once per page load</span>
<span class="fn">trackView</span>(<span class="str">'loyalty_join_card_view'</span>, { step: <span class="str">'kyc'</span> });

<span class="cm">// Sent every time it is called</span>
<span class="fn">track</span>(<span class="str">'loyalty_tour_skip'</span>, { step: <span class="num">2</span> });</pre>
<p>Result in <code>dataLayer</code>:</p>
<pre class="hl"><span class="cm">// One event in the dataLayer: its name, every event property cleared (undefined),</span>
<span class="cm">// the common properties, then its own properties. Every value is text.</span>
window.dataLayer.<span class="fn">push</span>({
  event: <span class="str">'loyalty_trade_click'</span>,
  source: undefined, <span class="kw">from</span>: undefined, tier: undefined, /* … every other event property … */
  page: <span class="str">'earn'</span>,
  theme: <span class="str">'light'</span>,
  has_task: <span class="str">'true'</span>,
  join_step: <span class="str">'none'</span>,
  credit_mode: <span class="str">'in-day'</span>,
  balance_range: <span class="str">'1000-4999'</span>,
  loyalty_tier: <span class="str">'vip'</span>,
  capped: <span class="str">'false'</span>
});</pre>

<h3 id="common">3.2 Common properties</h3>
<p>The 11 properties below are sent with every event. They are set once, when the page opens.</p>
<div class="scroll"><table><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup>
  <tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr>
  <tr><td><code>page</code></td><td>string</td><td><code>earn</code></td><td><div class="vtext">The page where the event happened:</div><div class="val"><code>home</code> = Home</div><div class="val"><code>earn</code> = Earn (the daily trading task)</div><div class="val"><code>coins</code> = Coins (coin balance and history)</div><div class="val"><code>orders</code> = Redemption history (reward orders)</div><div class="val"><code>store</code> = Reward Store, the rewards store in the webview (both the Home Store and Categories tabs; only when Plan B is on)</div><div class="val"><code>reward</code> = the reward page of a Reward Store reward</div></td><td>Fixed for each page when the page opens.</td></tr><tr><td><code>client_id</code></td><td>string</td><td><code>95001234</code></td><td>The client id of a signed-in user. Customers who are not signed in do not have this property. Used to join events with the trading and coin data in the backend.</td><td>The app reads it from the token it passes to the webview when the page opens, then sends it with every event. The reference demo has no token, so it does not send it.</td></tr><tr><td><code>theme</code></td><td>string</td><td><code>light</code></td><td>The colour mode on screen: <code>light</code> or <code>dark</code>.</td><td>The <code>data-theme</code> attribute of the page.</td></tr><tr><td><code>has_task</code></td><td>String</td><td><code>true</code></td><td><div class="val"><code>true</code> = the customer has a trading task (the Earn tab is there)</div><div class="val"><code>false</code> = the trading task is off or hidden for the customer (no Earn tab)</div><div class="vtext">Sent as text.</div></td><td>The field <code>tradingTask</code> of the trading task API.</td></tr><tr><td><code>join_step</code></td><td>string</td><td><code>none</code></td><td><div class="vtext">The step the customer still has to take before earning coins:</div><div class="val"><code>signup</code> = not signed in (guest)</div><div class="val"><code>kyc</code> = signed in, KYC not done</div><div class="val"><code>deposit</code> = KYC done, no first deposit yet</div><div class="val"><code>none</code> = no step left, or a signed-in customer without a trading task (then <code>none</code> does not mean KYC is done)</div></td><td>From the app's sign-in data: <code>kycApproveTime</code> = 0 is <code>kyc</code>; <code>kycApproveTime</code> &gt; 0 and <code>firstDepositTime</code> = 0 is <code>deposit</code>; otherwise <code>none</code>. A signed-in customer without a trading task is always <code>none</code>. When the app opens the page without a token: <code>signup</code>.</td></tr><tr><td><code>credit_mode</code></td><td>string</td><td><code>in-day</code></td><td><div class="val"><code>in-day</code> = coins credited within the trading day</div><div class="val"><code>delayed</code> = coins credited some days after the trading day</div><div class="val"><code>none</code> = the customer has no trading task</div></td><td>The field <code>program.creditMode</code> of the trading task API.</td></tr><tr><td><code>balance_range</code></td><td>string</td><td><code>1000-4999</code></td><td>Coin balance as a range: <code>0</code>, <code>1-999</code>, <code>1000-4999</code>, <code>5000+</code>. The exact balance is not sent.</td><td>Computed from the field <code>available</code> of the coin summary API.</td></tr><tr><td><code>loyalty_tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">The customer's tier: the highest tier among the customer's eligible accounts.</div><div class="val"><code>micro</code>, <code>standard</code>, <code>vip</code>, <code>platinum</code> = meaning as on <code>loyalty_upgrade_open</code></div><div class="val"><code>none</code> = no eligible account on the 4 tiers (no live account yet, no trading task, no account earns coins, or the accounts are in another MT5 group)</div><div class="vtext">Not sent for guests. GTM sets it as the GA4 user property <code>loyalty_tier</code>.</div></td><td>From the accounts' MT5 groups (the <code>accounts[].group</code> and <code>accounts[].eligible</code> fields of the trading task API).</td></tr><tr><td><code>view</code></td><td>string</td><td><code>list</code></td><td><div class="vtext">The part of the page on screen when the event happens (only on the 3 pages below):</div><div class="vtext">Redemption history: <code>list</code> = a list with orders; <code>empty</code> = no orders yet; <code>detail</code> = one order's details, including when the order could not be opened</div><div class="vtext">Reward Store: <code>home</code> = the Home Store tab; <code>categories</code> = the Categories tab; <code>empty</code> = no rewards (empty or failed rewards list)</div><div class="vtext">Reward page: <code>detail</code> = the reward; <code>missing</code> = "This reward is no longer available"</div><div class="vtext">In the Reward Store, <code>view</code> changes with the tab; a tap carries the <code>view</code> at the moment of the tap (so <code>loyalty_nav_click</code> carries the tab being left).</div></td><td>Set when the page opens; in the Reward Store, updated when the tab changes.</td></tr><tr><td><code>redeem_mode</code></td><td>string</td><td><code>store</code></td><td><div class="vtext">The redemption mode in use, sent with every event on every page:</div><div class="val"><code>tada</code> = the Redeem button opens the Tada store (default)</div><div class="val"><code>store</code> = Plan B: the Redeem button opens the rewards store in the webview (Reward Store), Checkout does not work yet</div><div class="vtext">The switch is the same for every customer: comparing the two values compares two periods, before and after it is turned on, not an A/B test.</div></td><td>From HSB's configuration (<code>common.rewardStore</code>), not from the loyalty API.</td></tr><tr><td><code>entry</code></td><td>string</td><td><code>home_redeem</code></td><td><div class="vtext">Only on the Reward Store and the reward page: how the customer reached the page:</div><div class="val"><code>home_redeem</code> = the <code>Redeem</code> button on Home</div><div class="val"><code>home_explore</code> = the <code>Explore all rewards</code> button on Home</div><div class="val"><code>home_reward</code> = a reward card on Home (straight to the reward page)</div><div class="val"><code>coins_redeem</code> = the <code>Redeem</code> button on Coins</div><div class="val"><code>orders_redeem</code> = the <code>Explore rewards</code> button on Redemption history when there are no orders yet</div><div class="val"><code>store</code> = a reward in the Reward Store (to the reward page)</div><div class="val"><code>return</code> = the same page again: coming back with the Back button from the reward page, the phone's back button, or a page reload</div><div class="val"><code>direct</code> = opened from an external link</div><div class="vtext">Counting store visits: <code>loyalty_page_view</code> with <code>page</code> = <code>store</code> and <code>entry</code> other than <code>return</code>.</div></td><td>The link into the store carries the <code>via</code> parameter; the page reads it once and then removes it from the address, so a reopened page no longer has <code>via</code> and is recorded as <code>return</code>.</td></tr>
</table></div>

<h3>3.3 Limits and notes</h3>
<ul>
  <li><b>GA4 limits:</b> event and property names up to 40 characters, values up to 100 characters, up to 25 properties per event. All current events are within the limits.</li>
  <li><b>Data types:</b> every value is sent as text, including <code>"true"</code> or <code>"1"</code>, so a GA4 custom dimension never mixes types.</li>
  <li><b>Clearing old properties:</b> GTM keeps the last value of every property. So on every push, every event property is first set to <code>undefined</code>, then the event's own properties are added; otherwise an event without <code>source</code> would be read with the <code>source</code> of an earlier event. A new property must be added to the <code>PARAMS</code> list in <code>shared/tracking.js</code>.</li>
  <li><b>Automatic check:</b> <code>node tools/check-tracking.mjs</code> opens the pages, taps through them and reports any event that differs from this list.</li>
  <li><b>Events of buttons that leave the page:</b> the navigation bar, the cards on Home, <code>Skip tour</code> and <code>Finish tour</code> push the event before the page changes.</li>
  <li><b>Without GTM:</b> the pages still work normally; events simply wait in <code>dataLayer</code>.</li>
</ul>

<h3>3.4 Setting up GTM and GA4</h3>
<table>
  <tr><th style="width:8%">Step</th><th>What to do</th></tr>
  <tr><td>1</td><td>In GTM, create a Custom Event trigger, with regular expression matching turned on, and the event name <code>^loyalty_</code></td></tr>
  <tr><td>2</td><td>Create a GA4 Event tag that uses this trigger, with the event name <code>{{Event}}</code></td></tr>
  <tr><td>3</td><td>Create a Data Layer Variable for each property and add them to the tag as event parameters; add <code>loyalty_tier</code> under the tag's User Properties instead</td></tr>
  <tr><td>4</td><td>In GA4, register the properties you want to split reports by as custom dimensions <b>before launch</b> (GA4 does not apply them to data already collected): event-scoped for the common and event properties, user-scoped for <code>loyalty_tier</code></td></tr>
  <tr><td>5</td><td>In GA4: set data retention to 14 months; turn off "Page changes based on browser history events" in the web stream's enhanced measurement (the tour changes the page address without loading a new page); mark <code>loyalty_kyc_click</code>, <code>loyalty_deposit_click</code>, <code>loyalty_signup_click</code>, <code>loyalty_trade_click</code>, <code>loyalty_redeem_click</code> as key events</td></tr>
  <tr><td>6</td><td>Forward the same events to CleverTap. <span class="pending">PENDING</span></td></tr>
</table>

<h3>3.5 Adding or changing an event</h3>
<ol>
  <li>Name it following the conventions in the tab <a href="#overview" class="ref">1. Overview</a>.</li>
  <li>For a button tap: add <code>data-track</code> to the button. Otherwise: call <code>track()</code> or <code>trackView()</code>.</li>
  <li>Add a row to <code>events.csv</code>, its own properties to <code>event_properties.csv</code>, and a row to <code>changelog.csv</code>; then rebuild this page.</li>
</ol>
</section><section class="panel" id="changelog" role="tabpanel">

<table>

ep</code> renamed <code>tour_step</code>, the <code>step</code> of <code>loyalty_join_card_view</code> dropped; the KYC and Deposit buttons always carry <code>source</code>; the "Start earning to redeem" sheet sends its event every time it opens. New common properties: <code>loyalty_tier</code>, <code>view</code>. Every value is sent as text, and each push clears the previous event's properties.</td><td>All</td></tr><tr><td>2026-10-20</td><td>Handoff 5 (phase 3): 9 events added (account tiers, guests, redemption history) and 7 new event properties (<code>source</code>, <code>reward_id</code>, <code>tier</code>, <code>next_tier</code>, <code>from</code>, <code>status</code>, <code>kind</code>); 12 earlier events changed where they are sent from or their values, mostly because Home no longer has the Daily Trading card. The common property <code>page</code> gains <code>orders</code>, <code>join_step</code> gains <code>signup</code>. No event was removed.</td><td>All</td></tr><tr><td>2026-10-12</td><td>First version. Added 22 events and 6 common properties, following the code of handoff 2 sent to the developer.</td><td>All</td></tr>

<h1>HSB Loyalty Program – 前端事件追踪</h1>
<p class="sub">Các event mà giao diện chương trình HSB Loyalty gửi đi. Cập nhật: 2026-10-23.</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. 概览</button><button type="button" role="tab" data-tab="events" aria-selected="false">2. 事件详情</button><button type="button" role="tab" data-tab="sending" aria-selected="false">3. 发送方式</button><button type="button" role="tab" data-tab="changelog" aria-selected="false">4. 变更记录</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>1. 概览</h2>
<p>本文档记录 HSB Loyalty 计划界面发送的全部追踪事件：每个事件的含义、发送时机、所在页面以及携带的属性。读者为前端开发人员、数据与市场人员以及 QA。本文档只涉及事件；消息计划和后端逻辑见<a href="https://nemodao.github.io/lytpg_clevertap/" class="ext" target="_blank" rel="noopener">CleverTap 通知文档</a>。</p>
<p>计划在 app 的 webview 中有四个页面：<b>Home</b>、<b>Earn</b>、<b>Coins</b> 和 <b>Redemption history</b>（兑换记录，从 Coins 打开）。未登录的客户也能查看这些页面。开启 Plan B（<code>redeem_mode</code> = <code>store</code>）时，还有奖品商店 <b>Reward Store</b>（Home Store 和 Categories 两个标签）以及每个奖品的详情页，在同一 webview 中运行，替代 Tada 商店；Checkout 尚未开放（H 组）。目前共有 38 个事件和 11 个公共属性。</p>
<h3>约定</h3>
<ul>
  <li><b>事件名称：</b>英文，<code>snake_case</code> 格式，按 <code>loyalty_&lt;object&gt;_&lt;action&gt;</code> 的模式命名。动作为 <code>view</code>（客户看到）、<code>click</code>（客户点击），或具体动词，如 <code>start</code>、<code>apply</code>。</li>
  <li><b>属性名称：</b>英文，<code>snake_case</code> 格式。</li>
  <li><b>客户标识：</b>使用 <code>client_id</code>。客户登录后，每个事件都带有 <code>client_id</code>（从 app 的 token 读取）；未登录的客户没有。Google Tag Manager 也会在客户登录时将其设为用户属性 <code>client_id</code>。</li>
  <li><b>绝不发送：</b>交易账号、精确余额、客户姓名或任何个人信息。余额只按区间发送。</li>
  <li><b>“看到”类事件</b>每次页面加载只发送一次，无论页面重绘多少次。</li>
</ul>

<h2>2. 各事件详情</h2>
<p>38 个事件，按其回答的分析问题分为 8 组。每个事件是一个区块：名称行、说明，然后是该事件自身属性的表格。</p>
<p><a href="#grp-0" class="ref">A. 从注册到交易</a> · <a href="#grp-1" class="ref">B. 对奖品的兴趣</a> · <a href="#grp-2" class="ref">C. 页面使用情况</a> · <a href="#grp-3" class="ref">D. 引导教程</a> · <a href="#grp-4" class="ref">E. 访客</a> · <a href="#grp-5" class="ref">F. 兑换记录</a> · <a href="#grp-6" class="ref">G. 故障</a> · <a href="#grp-7" class="ref">H. 奖品商店（Plan B）</a></p><h3 id="grp-0">A. 从注册到交易</h3><p>回答的问题：客户是否走完从邀请到 KYC、入金和交易的整个漏斗。</p><div class="scroll evblock" id="ev-loyalty_join_card_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_join_card_view</code> <span class="evmeta">页面：Home、Earn、Coins、Redemption history · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户看到开始邀请：“How to start”面板（获得 coin 前需完成的步骤）或 Coins 上的“Your coins will show up here”卡片。对有交易任务但尚未完成 KYC 或尚未首次入金的客户显示（<code>join_step</code> = <code>kyc</code>、<code>deposit</code>），也对访客显示（<code>join_step</code> = <code>signup</code>）。</dd><dt>发送时机</dt><dd>面板显示时。Earn 上的面板以及 Coins 上的注册卡片：每次加载页面只发送一次。邀请面板（“Start earning to redeem”，访客为“Join to redeem rewards”）：每次打开都发送。</dd><dt>位置</dt><dd>Earn 上的 Today 卡片；Coins 上的“Your coins will show up here”卡片（访客）；客户在 Home、Coins 和 Redemption history 上点击 <code>Redeem</code>、奖品卡片、<code>Explore all rewards</code>、空的 Redemption history 上的 <code>Explore rewards</code>，或（访客）余额卡片或 <code>Redemption history</code> 时打开的邀请面板。面板标题为“Start earning to redeem”（访客：“Join to redeem rewards”）；属性 <code>source</code> = <code>redeem</code>，<code>from</code> = 打开面板的按钮。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>KYC 和入金漏斗的分母：有多少客户看到了邀请。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>在代码中调用 <code>trackView()</code> （邀请面板：<code>track()</code>，每次打开时），位于 <code>shared/components.js</code>，函数 <code>joinPanel</code> 和 <code>mountJoinSheet</code>；<code>pages/point-balance.js</code></dd>< code> 按钮（属性 <code>source</code> = <code>upgrade</code>）。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>看到邀请后去入金的客户比例。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>shared/components.js</code>，函数 <code>joinPanel</code>；<code>pages/trading-task.js</code>（等级面板）</dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="vtext">点击的位置：</div><div class="val"><code>card</code> = Earn 上的“How to start”面板</div><div class="val"><code>redeem</code> = “Start earning to redeem”面板，由 <code>from</code> 中记录的按钮打开</div><div class="val"><code>upgrade</code> = Earn 上账户等级面板中的 <code>Deposit now</code> 按钮</div></td><td>在按钮上固定设置。</td></tr><tr><td><code>from</code></td><td>string</td><td><code>redeem</code></td><td><div class="vtext">打开面板的按钮：</div><div class="val"><code>redeem</code> = 余额卡片上的 <code>Redeem</code> 按钮（Home、Coins）或空的 Redemption history 上的 <code>Explore rewards</code></div><div class="val"><code>balance</code> = Home 上的余额卡片（仅访客）</div><div class="val"><code>reward</code> = Home 奖品网格中的一张奖品卡片</div><div class="val"><code>explore</code> = Home 上的 <code>Explore all rewards</code> 按钮</div><div class="val"><code>history</code> = Coins 上的 <code>Redemption history</code> 链接（仅访客）</div><div class="vtext">仅在 <code>source</code> = <code>redeem</code> 时发送。</div></td><td>与 <code>loyalty_join_card_view</code> 相同。</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">仅在 <code>source</code> = <code>upgrade</code> 时：账户当前等级：</div><div class="val"><code>micro</code>、<code>standard</code> 或 <code>vip</code> = 含义同 <code>loyalty_upgrade_open</code>；Platinum 账户没有此按钮</div></td><td>来自账户的 MT5 组。</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>platinum</code></td><td><div class="vtext">仅在 <code>source</code> = <code>upgrade</code> 时：下一等级： /dt><dd>衡量页面是否引导客户去交易，以及有多少次从等级面板开始。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>capped</code></td><td>string</td><td><code>false</code></td><td>客户今日是否已达到 coin 上限：<code>true</code> 或 <code>false</code>。</td><td>交易任务 API 的 <code>today.capped</code> 字段。</td></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="val"><code>upgrade</code> = 账户等级面板底部的按钮（仅当账户为 Platinum 时）</div><div class="vtext">点击 Trading account 卡片上的按钮时不带此属性。</div></td><td>在按钮上固定设置。</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>platinum</code></td><td>仅在 <code>source</code> = <code>upgrade</code> 时：账户等级（始终为 <code>platinum</code>）。</td><td>来自账户的 MT5 组。</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>none</code></td><td>仅在 <code>source</code> = <code>upgrade</code> 时：始终为 <code>none</code>。</td><td>在按钮上固定设置。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><h3 id="grp-1">B. 对奖品的兴趣</h3><p>回答的问题：客户是否对兑换奖品感兴趣，以及在什么余额水平。</p><div class="scroll evblock" id="ev-loyalty_redeem_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_redeem_click</code> <span class="evmeta">页面：Home、Coins、Redemption history · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户点击余额卡片上的 <code>Redeem</code> 按钮或 Redemption history 上的 <code>Explore rewards</code> 按钮（尚无订单时）前往兑换商店。对于未登录的客户，或有交易任务但尚未完成 KYC 或首次入金的客户，该按钮会打开邀请面板而不是商店；事件仍会发送。开启 Plan B（<code>redeem_mode</code> = <code>store</code>）时，该按钮对所有客户都打开 webview 内的奖品商店（Reward Store），不打开邀请面板。</dd><dt>发送时机</dt><dd>客户点击按钮时。</dd><dt>位置</dt><dd>Home 和 Coins 上的 coin 余额卡片。订单列表为空时 Redemption history 页面上的 <code>Explore rewards</code> 按钮。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>对兑换奖品的兴趣程度，按 <code>balance_range</code> 拆分。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>shared/components.js</code>，函数 <code>balanceBlock</code>；<code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td colspan="5" class="none">没有自有属性。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_rewards_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_rewards_view</code> <span class="evmeta">页面：Home · 起始版本：Handoff 6</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户看到 Home 上的奖品网格。</dd><dt>发送时机</dt><dd>当网格的第一张卡片至少一半显示在屏幕上时；每次加载页面只发送一次。没有奖品时（奖品列表为空或加载失败）：立即发送，且 <code>reward_count</code> = <code>0</code>。</dd><dt>位置</dt><dd>Home 上“Redeem coins for rewards”下方的奖品网格。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>奖品点击的分母：按位置和按奖品的点击率；了解奖品列表何时为空。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>在代码中调用 <code>trackView()</code>，位于 <code>pages/dashboard.js</code>，函数 <code>watchRewards</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>9</code></td><td><div class="vtext">网格中的奖品数量（不计 <code>Earn more coins</code> 卡片）：网格有 <code>Earn more coins</code> 卡片时为 <code>0</code> 到 <code>9</code>，没有时最多 <code>10</code>。</div><div class="val"><code>0</code> = 没有奖品（列表为空或加载失败）</div></td><td>显示的奖品数量。</td></tr><tr><td><code>has_earn_card</code></td><td>string</td><td><code>true</code></td><td>网格中是否有 <code>Earn more coins</code> 卡片（打开 Earn 的卡片）：<code>true</code> 或 <code>false</code>。</td><td>客户有交易任务、计划未结束且网格至少有一个奖品时为 <code>true</code>；否则为 <code>false</code>。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_reward_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_reward_click</code> <span class="evmeta">页面：Home、Reward Store · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户点击一个奖品：Home 奖品网格中的一张卡片，或 Reward Store 奖品商店中的一个奖品（Popular 板块的卡片、F&amp;B 板块的券、Tour &amp; Travel 板块的卡片、Categories 标签列表中的卡片）。属性 <code>section</code> 说明奖品是在哪里被点击的。</dd><dt>发送时机</dt><dd>客户点击时；在 Home 上，卡片打开邀请面板而不是商店时也会发送。开启 Plan B 时，Home 上的奖品卡片会直接打开该奖品的详情页。</dd><dt>位置</dt><dd>Home 上“Redeem coins for rewards”下方的奖品网格（最多 10 张卡片）；Reward Store 的各板块和奖品列表。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>了解哪些奖品、分类、价格区间和位置被点击最多；是“点击奖品 → 查看详情 → Checkout”漏斗的第一步。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>pages/dashboard.js</code>、<code>pages/store.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>position</code></td><td>string</td><td><code>1</code></td><td><div class="vtext">奖品在其被点击位置（<code>section</code>）中的排名，从 <code>1</code> 开始计数：</div><div class="vtext">Home：从 <code>1</code> 到 <code>9</code>（没有 <code>Earn more coins</code> 卡片时最多 <code>10</code>）；<code>Earn more coins</code> 卡片不计入</div><div class="vtext">Popular：<code>1</code> 到 <code>8</code>；F&amp;B 和 Tour &amp; Travel：<code>1</code> 到 <code>4</code></div><div class="vtext">Categories 标签中的列表：在当前筛选列表中的顺序（选择 All 选项时最多约 <code>50</code>）</div></td><td>奖品卡片在当前显示的网格、板块或列表中的顺序。</td></tr><tr><td><code>reward_id</code></td><td>string</td><td><code>101</code></td><td>奖品的 ID。</td><td>奖品列表 API（<code>/pointSys/app/point/catalog</code>）的 <code>id</code> 字段。</td></tr><tr><td><code>reward_name</code></td><td>string</td><td><code>AirPods Pro 2</code></td><td>奖品名称，与 HSB 发送的一致（截断为 100 个字符）。</td><td>奖品列表 API 的 <code>name</code> 字段。</td></tr><tr><td><code>affordable</code></td><td>string</td><td><code>true</code></td><td><div class="vtext">余额是否足够兑换该奖品：</div><div class="val"><code>true</code> = 余额大于或等于价格</div><div class="val"><code>false</code> = 余额小于价格</div><div class="vtext">不对访客发送（其余额始终为 0，会使“coin 不足”的比例失真）。不发送精确余额或价格。</div></td><td>将余额（coin 概览 API 的 <code>available</code>）与奖品价格比较。<code>join_step</code> = <code>signup</code> 时不发送。</td></tr><tr><td><code>section</code></td><td>string</td><td><code>popular</code></td><td><div class="vtext">奖品被点击的位置：</div><div class="val"><code>home</code> = Home 上的奖品网格</div><div class="val"><code>popular</code> = Home Store 标签中的 Popular Rewards 板块</div><div class="val"><code>fnb</code> = Home Store 标签中的 F&amp;B e-Vouchers 板块</div><div class="val"><code>travel</code> = Home Store 标签中的 Tour &amp; Travel 板块</div><div class="val"><code>list</code> = Categories 标签中的奖品列表（当前筛选的分类见 <code>filter</code>）</div></td><td>按奖品卡片显示的位置固定设置。</td></tr><tr><td><code>filter</code></td><td>string</td><td><code>fnb_voucher</code></td><td><div class="vtext">仅在 <code>section</code> = <code>list</code> 时：客户点击时 Categories 标签中已选的分类选项：</div><div class="val"><code>all</code> = All 选项（所有奖品）</div><div class="val"><code>gadget_electronics</code>、<code>tour_travel</code>、<code>shopping_voucher</code>、<code>fnb_voucher</code>、<code>home_living</code> = 该分类的选项（含义同 <code>category</code>）</div></td><td>客户点击时已选的选项。</td></tr><tr><td><code>category</code></td><td>string</td><td><code>fnb_voucher</code></td><td><div class="vtext">奖品的分类：</div><div class="val"><code>gadget_electronics</code> = Gadget &amp; Electronics（数码电子产品）</div><div class="val"><code>tour_travel</code> = Tour &amp; Travel（旅游）</div><div class="val"><code>shopping_voucher</code> = Shopping e-Voucher（购物券）</div><div class="val"><code>fnb_voucher</code> = F&amp;B e-Voucher（餐饮券）</div><div class="val"><code>home_living</code> = Home &amp; Living（家居用品）</div><div class="val"><code>none</code> = 没有分类的奖品（只出现在 <code>All</code> 选项中）</div></td><td>奖品列表 API 的 <code>category</code> 字段；不存在或为空时发送 <code>none</code>。</td></tr><tr><td><code>badge</code></td><td>string</td><td><code>hot</code></td><td><div class="vtext">客户在刚点击的奖品卡片上看到的标签：</div><div class="val"><code>hot</code> = HOT 标签</div><div class="val"><code>new</code> = New 标签</div><div class="val"><code>none</code> = 没有标签。F&amp;B 券卡片、Tour &amp; Travel 卡片和 Home 奖品网格不显示标签，因此始终发送 <code>none</code>，即使奖品在数据中带有标签</div><div class="vtext">在 Popular 板块中，<code>hot</code> 奖品排在最前面，因此解读标签的作用时需同时考虑 <code>position</code>。</div></td><td>F&amp;B 券卡片、Tour &amp; Travel 卡片、Home 奖品网格：始终为 <code>none</code>。方形卡片（Popular、Categories 标签中的列表）：奖品列表 API 的 <code>badge</code> 字段（<code>hot</code>、<code>new</code>，不存在时为 <code>none</code>）。</td></tr><tr><td><code>price_range</code></td><td>string</td><td><code>1-4999</code></td><td><div class="vtext">奖品价格（以 coin 计），按区间发送；不发送精确价格：</div><div class="val"><code>1-4999</code> = 低于 5,000 coin</div><div class="val"><code>5000-19999</code> = 5,000 至低于 20,000 coin</div><div class="val"><code>20000-49999</code> = 20,000 至低于 50,000 coin</div><div class="val"><code>50000+</code> = 50,000 coin 及以上</div><div class="vtext">区间分界点按样本数据设定（价格从 1,000 到 150,000 coin）；上线前需用真实价格重新确认。</div></td><td>根据奖品列表 API 的 <code>points</code> 字段（以 coin 计的价格）计算。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_expiring_notice_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_expiring_notice_view</code> <span class="evmeta">页面：Home、Coins · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户看到“有 coin 将在未来 10 天内过期”的提醒。</dd><dt>发送时机</dt><dd>页面绘制该提示时（不衡量客户是否滚动到该处）；每次加载页面只发送一次。</dd><dt>位置</dt><dd>余额卡片内、余额下方的红色提醒行。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>观察过期提醒是否促使客户兑换奖品。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>在代码中调用 <code>trackView()</code>，位于 <code>shared/components.js</code>，函数 <code>balanceBlock</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td colspan="5" class="none">没有自有属性。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><h3 id="grp-2">C. 页面使用情况</h3><p>回答的问题：客户使用计划的哪些页面和部分。</p><div class="scroll evblock" id="ev-loyalty_page_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_page_view</code> <span class="evmeta">页面：Home、Earn、Coins、Redemption history、Reward Store · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户打开一个页面：计划的某个页面，或 Reward Store 奖品商店的某个页面（<code>page</code> = <code>store</code> 或 <code>reward</code>）。</dd><dt>发送时机</dt><dd>页面有数据可显示时立即发送；每次加载页面只发送一次。页面显示“Couldn’t load this page”卡片时仍会发送。打开页面时真实 API 出错，页面不显示错误卡片，也不发送此事件（spec §54）。客户每次从奖品详情页返回时，商店页面都会再次发送此事件（Back 按钮会重新加载页面）：统计进入商店的次数时，用 <code>entry</code> 不等于 <code>return</code> 来计。</dd><dt>位置</dt><dd>所有页面；用公共属性 <code>page</code> 区分。奖品详情页同时发送奖品信息。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>各页面的浏览量；其他比率的分母；了解客户是否曾打开过该计划。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>在代码中调用 <code>track()</code>，位于 <code>shared/tracking.js</code>，函数 <code>initTracking</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th>< 0,000 coin 及以上</div><div class="vtext">区间分界点按样本数据设定（价格从 1,000 到 150,000 coin）；上线前需用真实价格重新确认。</div><div class="vtext">仅在奖品详情页发送。</div></td><td>根据奖品列表 API 的 <code>points</code> 字段（以 coin 计的价格）计算。</td></tr><tr><td><code>affordable</code></td><td>string</td><td><code>false</code></td><td><div class="vtext">余额是否足够兑换该奖品：</div><div class="val"><code>true</code> = 余额大于或等于价格</div><div class="val"><code>false</code> = 余额小于价格</div><div class="vtext">不对访客发送（其余额始终为 0，会使“coin 不足”的比例失真）。不发送精确余额或价格。</div><div class="vtext">仅在奖品详情页发送。</div></td><td>将余额（coin 概览 API 的 <code>available</code>）与奖品价格比较。<code>join_step</code> = <code>signup</code> 时不发送。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_nav_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_nav_click</code> <span class="evmeta">页面：Home、Earn、Coins、Reward Store · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户点击底部导航栏中的某个标签，或点击 X 按钮退出计划。在 Reward Store 中：点击商店底部栏的 Home Store 或 Categories 标签、该栏中的 Back 按钮，或奖品详情页顶部的 Back 按钮。</dd><dt>发送时机</dt><dd>客户点击时。在 Reward Store 的底部栏中，只有标签真正切换时才发送（点击当前已打开的标签不发送）。</dd><dt>位置</dt><dd>屏幕底部的悬浮导航栏；Reward Store 的底部栏；奖品详情页顶部的 Back 按钮。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>客户在各页面之间的路径；退出次数。Back 按钮只统计页面内的 Back：app 或手机的返回键不会被记录，因此不能用来计算退出率。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>shared/nav.js</code>；<code>pages/store.js</code>，<code>shared/store.js</code> 中的函数 <code>storeHead</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>target</code></td><td>string</td><td><code>earn</code></td><td><div class="vtext">客户点击前往：</div><div class="val"><code>home</code> = Home 标签</div><div class="val"><code>earn</code> = Earn 标签（客户没有交易任务时不存在）</div><div class="val"><code>coins</code> = Coins 标签</div><div class="val"><code>exit</code> = X 按钮，离开计划返回 app</div><div class="val"><code>store_home</code> = Reward Store 底部栏中的 Home Store 标签</div><div class="val"><code>categories</code> = Reward Store 底部栏中的 Categories 标签</div><div class="val"><code>back</code> = Reward Store 底部栏中的 Back 按钮，或奖品详情页顶部的 Back 按钮（<code>page</code> 说明是哪个按钮）</div><div class="vtext">在计划的导航栏中，点击当前页面的标签也会发送；在 Reward Store 的底部栏中则不发送。</div></td><td>按每个按钮固定设置。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_card_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_card_click</code> <span class="evmeta">页面：Home · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>在 Home 上，客户点击余额卡片前往 Coins，点击奖品网格中的 <code>Earn more coins</code> 卡片前往 Earn，或点击 <code>Explore all rewards</code> 前往兑换商店。对于访客，余额卡片会打开注册邀请面板；对于未登录、尚未完成 KYC 或尚未首次入金的客户，<code>Explore all rewards</code> 会打开邀请面板而不是商店；事件仍会发送。开启 Plan B 时，<code>Explore all rewards</code> 会打开 webview 内的奖品商店（Reward Store）。</dd><dt>发送时机</dt><dd>客户点击时。</dd><dt>位置</dt><dd>Home 上的余额卡片、<code>Earn more coins</code> 卡片和“Looking for something else?”卡片（没有奖品网格时：“Find rewards for your coins”）。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>了解客户从哪里进入 Earn、Coins 和兑换商店。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>shared/components.js</code>、<code>pages/dashboard.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>target</code></td><td>string</td><td><code>coins</code></td><td><div cla dt>位置</dt><dd>订单详情页面上带链接的电子兑换券。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>有多少客户从详情页面打开兑换券。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>item_type</code></td><td>string</td><td><code>egift</code></td><td><div class="vtext">奖品类型：</div><div class="val"><code>egift</code> = 电子兑换券（兑换码、PIN 或兑换券链接）</div><div class="val"><code>physical</code> = 送货上门的实物</div><div class="val"><code>pln</code> = PLN 电费 token</div><div class="val"><code>pulsa</code> = 话费充值</div><div class="val"><code>ewallet</code> = 电子钱包充值（例如 OVO、GoPay）</div><div class="val"><code>other</code> = 后端发送的其他类型</div></td><td>订单详情 API 中该项目的 <code>itemType</code> 字段（Tada 的数据）；不属于上述 5 种的类型发送为 <code>other</code>。</td></tr><tr><td><code>status</code></td><td>string</td><td><code>completed</code></td><td>订单状态，与 <code>loyalty_order_open</code> 相同。</td><td>订单详情 API 的 <code>status</code> 字段。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><h3 id="grp-6">G. 故障</h3><p>回答的问题：页面加载失败的频率有多高。</p><div class="scroll evblock" id="ev-loyalty_error_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_error_view</code> <span class="evmeta">页面：Home、Earn、Coins、Redemption history、Reward Store · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户遇到无法加载的部分：整个页面（“Couldn’t load this page”卡片）、一个兑换订单、列表的加载更多部分（“Couldn't load more”），或不在奖品列表中的奖品的详情页（“This reward is no longer available”）；属性 <code>error_scope</code> 说明是哪一部分。</dd><dt>发送时机</dt><dd>“Couldn’t load this page”卡片出现时（整个页面，或 Redemption history 上的一个订单）；每次加载页面只发送一次。<code>more</code>：Coins 和 Redemption history 上出现“Couldn’t load more”一行时；同样每次加载页面只发送一次。</dd><dt>位置</dt><dd>替代整个页面内容（<code>page</code>、<code>order</code>）；列表末尾的“Couldn’t load more. Try again”一行（<code>more</code>，在 Coins 和 Redemption history 上）。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>加载失败的频率，与 <code>loyalty_page_view</code> 相比。注意：打开页面时真实 API 出错，页面不显示错误卡片，也不发送任何事件（spec §54）。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>在代码中调用 <code>trackView()</code>，位于 <code>shared/components.js</code>，函数 <code>showStatus</code>；<code>pages/point-balance.js</code>、<code>pages/redemptions.js</code>、<code>pages/reward.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>error_scope</code></td><td>string</td><td><code>page</code></td><td><div class="vtext">无法加载的部分：</div><div class="val"><code>page</code> = 整个页面（“Couldn’t load this page”卡片）</div><div class="val"><code>order</code> = 详情页上的一个订单（不存在、不属于该客户或网络错误）</div><div class="val"><code>more</code> = 列表末尾的加载更多部分（“Couldn’t load more”）</div><div class="val"><code>reward</code> = 不在奖品列表中的奖品的详情页（“This reward is no longer available”）；见 <code>reward_count</code></div></td><td>按出错位置设置。</td></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>0</code></td><td><div class="vtext">仅在 <code>error_scope</code> = <code>reward</code> 时：当时奖品列表中的奖品数量。</div><div class="val"><code>0</code> = 奖品列表为空或奖品列表 API 出错</div><div class="vtext">大于 <code>0</code> = 该奖品已从商店下架（或链接错误）</div></td><td>奖品列表 API 返回的奖品数量。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_retry_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_retry_click</code> <span class="evmeta">页面：Home、Earn、Coins、Redemption history · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户在出错后点击重试。</dd><dt>发送时机</dt><dd>客户点击“Couldn’t load this page”卡片上的 <code>Try again</code> 按钮时（<code>error_scope</code> = <code>page</code> 或 <code>order</code>）。</dd><dt>位置</dt><dd>“Couldn’t load this page”卡片上的按钮（整个页面或一个订单）。“Couldn’t load more”一行上的 <code>Try again</code> 不发送此事件。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>了解客户是重试还是离开。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>shared/components.js</code>，函数 <code>showStatus</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td colspan="5" class="none">没有自有属性。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><h3 id="grp-7">H. 奖品商店（Plan B）</h3><p>回答的问题：开启 Plan B 时，客户从哪里进入奖品商店、看什么、想兑换哪个奖品、coin 够不够，以及商店是否推动客户去交易、去注册。仅在 `redeem_mode` = `store` 时发送。</p><div class="scroll evblock" id="ev-loyalty_store_section_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_store_section_view</code> <span class="evmeta">页面：Reward Store · 起始版本：Handoff 7</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户看到奖品商店 Home Store 标签中的某个板块：Popular Rewards、F&amp;B e-Vouchers 或 Tour &amp; Travel。</dd><dt>发送时机</dt><dd>当板块的第一张奖品卡片（Tour &amp; Travel：该区域的标题）至少一半显示在屏幕上时；每次加载页面每个板块只发送一次。</dd><dt>位置</dt><dd>Reward Store 的 Home Store 标签。Popular 和 F&amp;B 板块的开头通常一打开就能看到；Tour &amp; Travel 位于下方，需要滚动才能看到。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>各板块奖品点击率的分母；了解客户是否向下滚动到 F&amp;B 和 Tour &amp; Travel。按客户数解读，而不是按事件数（客户每次返回时页面都会重新加载）。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>在代码中调用 <code>trackView()</code>，位于 <code>pages/store.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>section</code></td><td>string</td><td><code>travel</code></td><td><div class="vtext">刚被看到的板块：</div><div class="val"><code>popular</code> = Popular Rewards</div><div class="val"><code>fnb</code> = F&amp;B e-Vouchers</div><div class="val"><code>travel</code> = Tour &amp; Travel</div></td><td>按板块固定设置。</td></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>4</code></td><td>板块中的奖品数量：通常为 <code>8</code>（Popular）、<code>4</code>（F&amp;B）、<code>4</code>（Tour &amp; Travel）；奖品列表中的奖品较少时会更少。</td><td>该板块的奖品卡片数量。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_category_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_category_view</code> <span class="evmeta">页面：Reward Store · 起始版本：Handoff 7</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>奖品商店的 Categories 标签显示某个分类的奖品列表（或全部奖品，或“More categories”卡片）。</dd><dt>发送时机</dt><dd>客户通过选项或 <code>See all</code> 选择时（<code>from</code> = <code>chip</code>、<code>see_all</code>）：每次切换都发送，因为这是客户的选择；再次点击已选选项不发送。列表只是因为打开标签或打开页面而显示时（<code>from</code> = <code>tab</code>、<code>page_load</code>）：每次加载页面每个分类只发送一次。</dd><dt>位置</dt><dd>Reward Store 的 Categories 标签：分类选项行（All、5 个分类、More categories）以及下方的奖品列表。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>哪些分类受到关注；有多少客户想要更多分类（<code>category</code> = <code>more</code>）；列表中奖品点击率的分母。真实需求为 <code>from</code> = <code>chip</code> 或 <code>see_all</code>。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>在代码中调用 <code>track()</code> / <code>trackView()</code>，位于 <code>pages/store.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>category</code></td><td>string</td><td><code>fnb_voucher</code></td><td><div class="vtext">当前显示的列表：</div><div class="val"><code>all</code> = All 选项（所有奖品）</div><div class="val"><code>gadget_electronics</code>、<code>tour_travel</code>、<code>shopping_voucher</code>、<code>fnb_voucher</code>、<code>home_living</code> = 该分类（含义同 <code>loyalty_reward_click</code>）</div><div class="val"><code>more</code> = “More categories”选项：“2,000+ rewards on the way”卡片，没有奖品（客户想要更多分类）</div></td><td>已选的选项。</td></tr><tr><td><code>from</code></td><td>string</td><td><code>chip</code></td><td><div class="vtext">列表显示的原因：</div><div class="val"><code>chip</code> = 客户点击了某个分类选项</div><div class="val"><code>see_all</code> = 客户点击了 Home Store 标签中某个板块的 <code>See all</code>（Popular 打开 <code>all</code>，F&amp;B 打开 <code>fnb_voucher</code>，Tour &amp; Travel 打开 <code>tour_travel</code>）</div><div class="val"><code>tab</code> = 客户点击了底部栏的 Categories 标签；列表显示上次选择的分类</div><div class="val"><code>page_load</code> = 商店直接在 Categories 标签打开（例如从奖品详情页返回）</div><div class="vtext">客户的真实需求是 <code>chip</code> 和 <code>see_all</code>。</div></td><td>按客户到达列表的方式设置。</td></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>10</code></td><td>当前显示列表中的奖品数量。<code>0</code> = 该分类尚无奖品，或 <code>category</code> = <code>more</code>。</td><td>统计奖品列表中该分类的奖品数。</td></tr><tr><td colspan="5" class="none">同时发送：11 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_checkout_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_checkout_click</code> <span class="evmeta">页面：Reward Store · 起始版本：Handoff 7</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户在某个奖品的详情页点击 <code>Checkout</code>。Checkout 尚未开放：视客户情况，会弹出一个面板，提示 coin 不足、即将开放，或邀请注册。这是商店最主要的兑换需求信号。</dd><dt>发送时机</dt><dd>客户每次点击 <code>Checkout</code> 时（关闭之前的面板后再次点击也会发送）：按客户数，或按客户和奖品解读需求。</dd><dt>位置</dt><dd>固定在奖品详情页底部的 <code>Checkout</code> 按钮。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>有多少客户想兑换哪个奖品、在什么价格区间；有多少 coin 足够的客户在等待 checkout 开放；coin 不足的客户差多少。GA4 中的关键事件。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>pages/reward.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>reward_id</code></td><td>string</td><td><code>101</code></td><td>奖品的 ID。</td><td>奖品列表 API（<code>/pointSys/app/point/catalog</code>）的 <code>id</code> 字段。</td></tr><tr><td><code>reward_name</code></td><td>string</td><td><code>iPhone 16 Pro</code></td><td>奖品名称，与 HSB 发送的一致（截断为 100 个字符）。名称可能被修改，因此报告应按 <code>reward_id</code> 统计，名称只用作显示标签。</td><td>奖品列表 API 的 <code>name</code> 字段。</td></tr><tr><td><code>category</code></td><td>string</td><td><code>gadget_electronics</code></td><td><div class="vtext">奖品的分类：</div><div class="val"><code>gadget_electronics</code> = Gadget &amp; Electronics（数码电子产品）</div><div class="val"><code>tour_travel</code> = Tour &amp; Travel（旅游）</div><div class="val"><code>shopping_voucher</code> = Shopping e-Voucher（购物券）</div><div class="val"><code>fnb_voucher</code> = F&amp;B e-Voucher（餐饮券）</div><div class="val"><code>home_living</code> = Home &amp; Living（家居用品）</div><div class="val"><code>none</code> = 没有分类的奖品（只出现在 <code>All</code> 选项中）</div></td><td>奖品列表 API 的 <code>category</code> 字段；不存在或为空时发送 <code>none</code>。</td></tr><tr><td><code>badge</code></td><td>string</td><td><code>hot</code></td><td><div class="vtext">奖品的标签，在详情页中显示在名称之前：</div><div class="val"><code>hot</code> = HOT 标签</div><div class="val"><code>new</code> = New 标签</div><div class="val"><code>none</code> = 没有标签</div></td><td>奖品列表 API 的 <code>badge</code> 字段；不存在时为 <code>none</code>。</td></tr><tr><td><code>price_range</code></td><td>string</td><td><code>50000+</code></td><td><div class="vtext">奖品价格（以 coin 计），按区间发送；不发
