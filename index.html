>）。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>看到邀请后去入金的客户比例。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>shared/components.js</code>，函数 <code>joinPanel</code>；<code>pages/trading-task.js</code>（等级面板）</dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="vtext">点击的位置：</div><div class="val"><code>card</code> = Earn 上的“How to start”面板</div><div class="val"><code>redeem</code> = “Start earning to redeem”面板，由 <code>from</code> 中记录的按钮打开</div><div class="val"><code>upgrade</code> = Earn 上账户等级面板中的 <code>Deposit now</code> 按钮</div></td><td>在按钮上固定设置。</td></tr><tr><td><code>from</code></td><td>string</td><td><code>redeem</code></td><td><div class="vtext">打开面板的按钮：</div><div class="val"><code>redeem</code> = 余额卡片上的 <code>Redeem</code> 按钮（Home、Coins）或空的 Redemption history 上的 <code>Explore rewards</code></div><div class="val"><code>balance</code> = Home 上的余额卡片（仅访客）</div><div class="val"><code>reward</code> = Home 奖品网格中的一张奖品卡片</div><div class="val"><code>explore</code> = Home 上的 <code>Explore all rewards</code> 按钮</div><div class="val"><code>history</code> = Coins 上的 <code>Redemption history</code> 链接（仅访客）</div><div class="vtext">仅在 <code>source</code> = <code>redeem</code> 时发送。</div></td><td>与 <code>loyalty_join_card_view</code> 相同。</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">仅在 <code>source</code> = <code>upgrade</code> 时：账户当前等级：</div><div class="val"><code>micro</code>、<code>standard</code> 或 <code>vip</code> = 含义同 <code>loyalty_upgrade_open</code>；Platinum 账户没有此按钮</div></td><td>来自账户的 MT5 组。</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>platinum</code></td><td><div class="vtext">仅在 <code>source</code> = <code>upgrade</code> 时：下一等级：</div><div class="val"><code>standard</code>、<code>vip</code> 或 <code>platinum</code></div></td><td>四级阶梯中的下一等级。</td></tr><tr><td colspan="5" class="none">同时发送：8 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_open_account_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_open_account_click</code> <span class="evmeta">页面：Earn · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户已完成 KYC 并已入金，但还没有真实交易账户，并点击 <code>Open a trading account</code> 按钮。</dd><dt>发送时机</dt><dd>客户点击按钮时。</dd><dt>位置</dt><dd>Earn 上 Trading account 卡片中的按钮。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>统计卡在开设交易账户这一步的客户数量。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td colspan="5" class="none">没有自有属性。</td></tr><tr><td colspan="5" class="none">同时发送：8 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_trade_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_trade_click</code> <span class="evmeta">页面：Earn · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户点击按钮去交易：Earn 上的 <code>Trade with account …</code>（今天已达 coin 上限时，按钮显示 <code>Trade now</code>），或在账户已是 Platinum 时账户等级面板底部的按钮。</dd><dt>发送时机</dt><dd>客户点击按钮时。</dd><dt>位置</dt><dd>Earn 上 Trading account 卡片的按钮；账户等级面板底部的按钮（属性 <code>source</code> = <code>upgrade</code>）。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>衡量页面是否引导客户去交易，以及有多少次从等级面板开始。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>capped</code></td><td>string</td><td><code>false</code></td><td>客户今日是否已达到 coin 上限：<code>true</code> 或 <code>false</code>。</td><td>交易任务 API 的 <code>today.capped</code> 字段。</td></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="val"><code>upgrade</code> = 账户等级面板底部的按钮（仅当账户为 Platinum 时）</div><div class="vtext">点击 Trading account 卡片上的按钮时不带此属性。</div></td><td>在按钮上固定设置。</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>platinum</code></td><td>仅在 <code>source</code> = <code>upgrade</code> 时：账户等级（始终为 <code>platinum</code>）。</td><td>来自账户的 MT5 组。</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>none</code></td><td>仅在 <code>source</code> = <code>upgrade</code> 时：始终为 <code>none</code>。</td><td>在按钮上固定设置。</td></tr><tr><td colspan="5" class="none">同时发送：8 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><h3 id="grp-1">B. 对奖品的兴趣</h3><p>回答的问题：客户是否对兑换奖品感兴趣，以及在什么余额水平。</p><div class="scroll evblock" id="ev-loyalty_redeem_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_redeem_click</code> <span class="evmeta">页面：Home、Coins、Redemption history · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户点击余额卡片上的 <code>Redeem</code> 按钮或 Redemption history 上的 <code>Explore rewards</code> 按钮（尚无订单时）前往兑换商店。对于未登录的客户，或有交易任务但尚未完成 KYC 或首次入金的客户，该按钮会打开邀请面板而不是商店；事件仍会发送。</dd><dt>发送时机</dt><dd>客户点击按钮时。</dd><dt>位置</dt><dd>Home 和 Coins 上的 coin 余额卡片。订单列表为空时 Redemption history 页面上的 <code>Explore rewards</code> 按钮。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>对兑换奖品的兴趣程度，按 <code>balance_range</code> 拆分。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>shared/components.js</code>，函数 <code>balanceBlock</code>；<code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td colspan="5" class="none">没有自有属性。</td></tr><tr><td colspan="5" class="none">同时发送：8 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_rewards_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_rewards_view</code> <span class="evmeta">页面：Home · 起始版本：Handoff 6</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户看到 Home 上的奖品网格。</dd><dt>发送时机</dt><dd>当网格的第一张卡片至少一半显示在屏幕上时；每次加载页面只发送一次。没有奖品时（奖品列表为空或加载失败）：立即发送，且 <code>reward_count</code> = <code>0</code>。</dd><dt>位置</dt><dd>Home 上“Redeem coins for rewards”下方的奖品网格。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>奖品点击的分母：按位置和按奖品的点击率；了解奖品列表何时为空。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>在代码中调用 <code>trackView()</code>，位于 <code>pages/dashboard.js</code>，函数 <code>watchRewards</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>9</code></td><td><div class="vtext">网格中的奖品数量（不计 <code>Earn more coins</code> 卡片）：网格有 <code>Earn more coins</code> 卡片时为 <code>0</code> 到 <code>9</code>，没有时最多 <code>10</code>。</div><div class="val"><code>0</code> = 没有奖品（列表为空或加载失败）</div></td><td>显示的奖品数量。</td></tr><tr><td><code>has_earn_card</code></td><td>string</td><td><code>true</code></td><td>网格中是否有 <code>Earn more coins</code> 卡片（打开 Earn 的卡片）：<code>true</code> 或 <code>false</code>。</td><td>客户有交易任务、计划未结束且网格至少有一个奖品时为 <code>true</code>；否则为 <c ns 和 Redemption history 上出现“Couldn’t load more”一行时；同样每次加载页面只发送一次。</dd><dt>位置</dt><dd>替代整个页面内容（<code>page</code>、<code>order</code>）；列表末尾的“Couldn’t load more. Try again”一行（<code>more</code>，在 Coins 和 Redemption history 上）。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>加载失败的频率，与 <code>loyalty_page_view</code> 相比。注意：打开页面时真实 API 出错，页面不显示错误卡片，也不发送任何事件（spec §54）。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>在代码中调用 <code>trackView()</code>，位于 <code>shared/components.js</code>，函数 <code>showStatus</code>；<code>pages/point-balance.js</code>、<code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td><code>error_scope</code></td><td>string</td><td><code>page</code></td><td><div class="vtext">无法加载的部分：</div><div class="val"><code>page</code> = 整个页面（“Couldn’t load this page”卡片）</div><div class="val"><code>order</code> = 详情页上的一个订单（不存在、不属于该客户或网络错误）</div><div class="val"><code>more</code> = 列表末尾的加载更多部分（“Couldn’t load more”）</div></td><td>按出错位置设置。</td></tr><tr><td colspan="5" class="none">同时发送：8 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_retry_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_retry_click</code> <span class="evmeta">页面：Home、Earn、Coins、Redemption history · 起始版本：Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>含义</dt><dd>客户在出错后点击重试。</dd><dt>发送时机</dt><dd>客户点击“Couldn’t load this page”卡片上的 <code>Try again</code> 按钮时（<code>error_scope</code> = <code>page</code> 或 <code>order</code>）。</dd><dt>位置</dt><dd>“Couldn’t load this page”卡片上的按钮（整个页面或一个订单）。“Couldn’t load more”一行上的 <code>Try again</code> 不发送此事件。</dd><dt>平台</dt><dd>iOS 和 Android App 内的 webview</dd><dt>用途</dt><dd>了解客户是重试还是离开。</dd><dt>状态</dt><dd><span class="st st-wip">开发中</span></dd><dt>挂载方式</dt><dd>按钮上的 <code>data-track</code> 属性，位于 <code>shared/components.js</code>，函数 <code>showStatus</code></dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr><tr><td colspan="5" class="none">没有自有属性。</td></tr><tr><td colspan="5" class="none">同时发送：8 个公共属性，见标签页 <a href="#common" class="ref">3. 发送方式，第 3.2 节</a>。</td></tr></table></div></section><section class="panel" id="sending" role="tabpanel">
<h2>3. 发送方式</h2>
<p>所有事件都经过唯一的一个文件 <code>shared/tracking.js</code>。该文件将事件推入 <code>window.dataLayer</code>；Google Tag Manager 从中读取并转发。除此文件外，代码中没有任何地方触碰 <code>dataLayer</code>。</p>

<h3>3.1 事件的两种发送方式</h3>
<table>
  <tr><th style="width:22%">类型</th><th style="width:38%">挂载方式</th><th>适用场合</th></tr>
  <tr><td>点击按钮</td><td>按钮上的 <code>data-track</code> 属性，自有属性写成 <code>data-track-&lt;name&gt;</code>。由一个公共监听器读取这些属性</td><td>所有名称以 <code>_click</code> 结尾的事件以及其他点击类事件。新增需要统计的按钮时只需加属性，无需写代码</td></tr>
  <tr><td>看到</td><td>组件显示时在代码中调用 <code>trackView()</code></td><td>名称以 <code>_view</code> 结尾的事件。每次页面加载只发送一次</td></tr>
  <tr><td>其他情况</td><td>在代码中调用 <code>track()</code></td><td>依赖逻辑的事件，例如选择日期范围或教程的各个步骤</td></tr>
</table>
<p>挂在按钮上的示例：</p>
<pre class="hl">&lt;button data-track=<span class="str">"loyalty_reward_click"</span> data-track-position=<span class="str">"1"</span>&gt;Redeem&lt;/button&gt;</pre>
<p>在代码中调用的示例：</p>
<pre class="hl"><span class="kw">import</span> { track, trackView } <span class="kw">from</span> <span class="str">'./tracking.js'</span>;

<span class="cm">// Sent once per page load</span>
<span class="fn">trackView</span>(<span class="str">'loyalty_join_card_view'</span>, { step: <span class="str">'kyc'</span> });

<span class="cm">// Sent every time it is called</span>
<span class="fn">track</span>(<span class="str">'loyalty_tour_skip'</span>, { step: <span class="num">2</span> });</pre>
<p><code>dataLayer</code> 中的结果：</p>
<pre class="hl"><span class="cm">// One event in the dataLayer: its name, every event property cleared (undefined),</span>
<span class="cm">// the common properties, then its own properties. Every value is text.</span>
window.dataLayer.<span class="fn">push</span>({
  event: <span class="str">'loyalty_trade_click'</span>,
  source: undefined, <span class="kw">from</span>: undefined, tier: undefined, /* … every other event property … */
  page: <span class="str">'earn'</span>,
  theme: <span class="str">'light'</span>,
  has_task: <span class="str">'true'</span>,
  join_step: <span class="str">'none'</span>,
  credit_mode: <span class="str">'in-day'</span>,
  balance_range: <span class="str">'1000-4999'</span>,
  loyalty_tier: <span class="str">'vip'</span>,
  capped: <span class="str">'false'</span>
});</pre>

<h3 id="common">3.2 公共属性</h3>
<p>下面 8 个属性随每个事件一起发送。它们在页面打开时确定一次。</p>
<div class="scroll"><table><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup>
  <tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>取值方式</th></tr>
  <tr><td><code>page</code></td><td>string</td><td><code>earn</code></td><td><div class="vtext">事件发生的页面：</div><div class="val"><code>home</code> = Home</div><div class="val"><code>earn</code> = Earn（每日交易任务）</div><div class="val"><code>coins</code> = Coins（coin 余额和记录）</div><div class="val"><code>orders</code> = Redemption history（兑换订单）</div></td><td>页面打开时按页面固定设置。</td></tr><tr><td><code>theme</code></td><td>string</td><td><code>light</code></td><td>当前显示的颜色模式：<code>light</code> 或 <code>dark</code>。</td><td>页面的 <code>data-theme</code> 属性。</td></tr><tr><td><code>has_task</code></td><td>String</td><td><code>true</code></td><td><div class="val"><code>true</code> = 客户有交易任务（有 Earn 标签）</div><div class="val"><code>false</code> = 交易任务关闭或对该客户隐藏（没有 Earn 标签）</div><div class="vtext">以文字形式发送。</div></td><td>交易任务 API 的 <code>tradingTask</code> 字段。</td></tr><tr><td><code>join_step</code></td><td>string</td><td><code>none</code></td><td><div class="vtext">客户在获得 coin 之前还需完成的步骤：</div><div class="val"><code>signup</code> = 未登录（访客）</div><div class="val"><code>kyc</code> = 已登录，尚未 KYC</div><div class="val"><code>deposit</code> = 已 KYC，尚未首次入金</div><div class="val"><code>none</code> = 没有剩余步骤，或已登录但没有交易任务的客户（此时 <code>none</code> 不代表已完成 KYC）</div></td><td>来自 app 的登录数据：<code>kycApproveTime</code> = 0 为 <code>kyc</code>；<code>kycApproveTime</code> &gt; 0 且 <code>firstDepositTime</code> = 0 为 <code>deposit</code>；其余为 <code>none</code>。已登录但没有交易任务的客户始终为 <code>none</code>。app 不带 token 打开页面时：<code>signup</code>。</td></tr><tr><td><code>credit_mode</code></td><td>string</td><td><code>in-day</code></td><td><div class="val"><code>in-day</code> = coin 在交易当天发放</div><div class="val"><code>delayed</code> = coin 在交易日之后几天发放</div><div class="val"><code>none</code> = 客户没有交易任务</div></td><td>交易任务 API 的 <code>program.creditMode</code> 字段。</td></tr><tr><td><code>balance_range</code></td><td>string</td><td><code>1000-4999</code></td><td>按区间表示的 coin 余额：<code>0</code>、<code>1-999</code>、<code>1000-4999</code>、<code>5000+</code>。不发送精确余额。</td><td>根据 coin 概览 API 的 <code>available</code> 字段计算。</td></tr><tr><td><code>loyalty_tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">客户等级：客户所有符合条件账户中的最高等级。</div><div class="val"><code>micro</code>、<code>standard</code>、<code>vip</code>、<code>platinum</code> = 含义同 <code>loyalty_upgrade_open</code></div><div class="val"><code>none</code> = 没有属于这 4 个等级的符合条件账户（尚无真实账户、没有交易任务、所有账户都不获得 coin，或账户属于其他 MT5 组）</div><div class="vtext">访客不发送。GTM 将其设为 GA4 用户属性 <code>loyalty_tier</code>。</div></td><td>来自各账户的 MT5 组（交易任务 API 的 <code>accounts[].group</code> 和 <code>accounts[].eligible</code> 字段）。</td></tr><tr><td><code>view</code></td><td>string</td><td><code>list</code></td><td><div class="vtext">仅在 Redemption history 页面：</div><div class="val"><code>list</code> = 有订单的列表</div><div class="val"><code>empty</code> = 尚无订单</div><div class="val"><code>detail</code> = 单个订单详情，包括订单无法打开时</div></td><td>页面打开时确定。</td></tr>
</table></div>

<h3>3.3 限制与注意事项</h3>
<ul>
  <li><b>GA4 的限制：</b>事件名和属性名最长 40 个字符，值最长 100 个字符，每个事件最多 25 个属性。当前所有事件都在限制之内。</li>
  <li><b>数据类型：</b>所有取值都以文字形式发送，包括 <code>"true"</code> 或 <code>"1"</code>，使 GA4 自定义维度不会混合类型。</li>
  <li><b>清除旧属性：</b>GTM 会保留每个属性的最后一个值。因此每次发送时，先将所有事件属性设为 <code>undefined</code>，再加上该事件自身的属性；否则不带 <code>source</code> 的事件会被读成前一个事件的 <code>source</code>。新增属性需加入 <code>shared/tracking.js</code> 中的 <code>PARAMS</code> 列表。</li>
  <li><b>自动检查：</b><code>node tools/check-tracking.mjs</code> 会打开页面、逐一点击，并报告与此列表不一致的事件。</li>
  <li><b>离开页面的按钮的事件：</b>导航栏、Home 上的卡片、<code>Skip tour</code> 和 <code>Finish tour</code> 会在跳转前推送事件。</li>
  <li><b>尚未接入 GTM 时：</b>页面仍正常运行；事件只是停留在 <code>dataLayer</code> 中等待。</li>
</ul>

<h3>3.4 GTM 和 GA4 的配置</h3>
<table>
  <tr><th style="width:8%">步骤</th><th>需要做的事</th></tr>
  <tr><td>1</td><td>在 GTM 中创建一个 Custom Event 类型的触发器，开启正则匹配，事件名称为 <code>^loyalty_</code></td></tr>
  <tr><td>2</td><td>创建一个使用该触发器的 GA4 Event 代码，事件名称为 <code>{{Event}}</code></td></tr>
  <tr><td>3</td><td>为每个属性创建 Data Layer Variable 并作为事件参数加入 tag；<code>loyalty_tier</code> 则加入 tag 的 User Properties</td></tr>
  <tr><td>4</td><td>在 GA4 中，<b>上线前</b>将需要用来拆分报告的属性注册为自定义维度（GA4 不会应用到已收集的数据）：公共属性和事件属性按事件范围注册，<code>loyalty_tier</code> 按用户范围注册</td></tr>
  <tr><td>5</td><td>在 GA4 中：将数据保留期设为 14 个月；在网站数据流的增强型衡量中关闭“Page changes based on browser history events”（教程会更改页面地址而不加载新页面）；将 <code>loyalty_kyc_click</code>、<code>loyalty_deposit_click</code>、<code>loyalty_signup_click</code>、<code>loyalty_trade_click</code>、<code>loyalty_redeem_click</code> 标记为关键事件</td></tr>
  <tr><td>6</td><td>将同样的事件转发到 CleverTap。<span class="pending">PENDING</span></td></tr>
</table>

<h3>3.5 新增或修改事件</h3>
<ol>
  <li>按标签页 <a href="#overview" class="ref">1. 概览</a> 中的约定命名。</li>
  <li>如果是点击按钮：在按钮上添加 <code>data-track</code>。否则：调用 <code>track()</code> 或 <code>trackView()</code>。</li>
  <li>在 <code>events.csv</code> 中加一行，自有属性加到 <code>event_properties.csv</code>，并在 <code>changelog.csv</code> 中加一行；然后重新生成本页面。</li>
</ol>

<section class="panel" id="overview" role="tabpanel">
<h2>1. Tổng quan</h2>
<p>Tài liệu này lưu toàn bộ event tracking mà giao diện của chương trình HSB Loyalty gửi đi: mỗi event là gì, gửi lúc nào, ở màn hình nào, và mang những thuộc tính gì. Người đọc là developer front-end, người làm data và marketing, và người QA. Tài liệu chỉ nói về event; kế hoạch tin nhắn và logic backend nằm ở <a href="https://nemodao.github.io/lytpg_clevertap/" class="ext" target="_blank" rel="noopener">tài liệu thông báo qua CleverTap</a>.</p>
<p>Chương trình có bốn trang chạy trong webview của app: <b>Home</b>, <b>Earn</b>, <b>Coins</b> và <b>Redemption history</b> (lịch sử đổi quà, mở từ Coins). Khách chưa đăng nhập cũng xem được các trang này. Hiện có 33 event và 8 thuộc tính chung.</p>
<h3>Quy ước</h3>
<ul>
  <li><b>Tên event:</b> tiếng Anh, kiểu <code>snake_case</code>, theo mẫu <code>loyalty_&lt;object&gt;_&lt;action&gt;</code>. Hành động là <code>view</code> (khách nhìn thấy), <code>click</code> (khách bấm), hoặc một động từ cụ thể như <code>start</code>, <code>apply</code>.</li>
  <li><b>Tên thuộc tính:</b> tiếng Anh, kiểu <code>snake_case</code>.</li>
  <li><b>Định danh khách:</b> bằng <code>client_id</code>. Các trang không gửi mã này; Google Tag Manager gắn nó thành user property <code>client_id</code> lúc khách đăng nhập.</li>
  <li><b>Không bao giờ gửi:</b> số tài khoản giao dịch, số dư chính xác, tên hay thông tin cá nhân của khách. Số dư chỉ được gửi theo khoảng.</li>
  <li><b>Event dạng "nhìn thấy"</b> chỉ gửi một lần cho mỗi lần tải trang, dù trang vẽ lại nhiều lần.</li>
</ul>

<h2>2. Chi tiết từng event</h2>
<p>33 event, chia thành 7 nhóm theo câu hỏi phân tích mà chúng trả lời. Mỗi event là một khối: dòng tên, phần mô tả, rồi bảng thuộc tính riêng của event đó.</p>
<p><a href="#grp-0" class="ref">A. Từ đăng ký tới giao dịch</a> · <a href="#grp-1" class="ref">B. Quan tâm tới quà</a> · <a href="#grp-2" class="ref">C. Sử dụng các trang</a> · <a href="#grp-3" class="ref">D. Tour hướng dẫn</a> · <a href="#grp-4" class="ref">E. Khách vãng lai</a> · <a href="#grp-5" class="ref">F. Lịch sử đổi quà</a> · <a href="#grp-6" class="ref">G. Sự cố</a></p><h3 id="grp-0">A. Từ đăng ký tới giao dịch</h3><p>Trả lời câu hỏi: khách có đi hết phễu từ lời mời tới KYC, nạp tiền và giao dịch không.</p><div class="scroll evblock" id="ev-loyalty_join_card_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_join_card_view</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Redemption history · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách nhìn thấy lời mời bắt đầu: khung "How to start" (các bước phải làm trước khi được tính coin) hoặc thẻ "Your coins will show up here" ở Coins. Hiện với khách có trading task nhưng chưa KYC hoặc chưa nạp tiền lần đầu (<code>join_step</code> = <code>kyc</code>, <code>deposit</code>), và với khách vãng lai (<code>join_step</code> = <code>signup</code>).</dd><dt>Thời điểm bắn</dt><dd>Khi khung hiện ra. Khung ở Earn và thẻ đăng ký ở Coins: mỗi lần tải trang chỉ gửi một lần. Bảng mời ("Start earning to redeem", hoặc "Join to redeem rewards" với khách vãng lai): gửi mỗi lần bảng mở.</dd><dt>Vị trí</dt><dd>Thẻ Today ở Earn; thẻ "Your coins will show up here" ở Coins (khách vãng lai); bảng mời mở ra khi khách bấm <code>Redeem</code>, một ô quà, <code>Explore all rewards</code>, <code>Explore rewards</code> ở Redemption history chưa có đơn, hoặc (khách vãng lai) thẻ số dư hay <code>Redemption history</code>, ở Home, Coins và Redemption history. Bảng mời có tiêu đề "Start earning to redeem" (khách vãng lai: "Join to redeem rewards"); thuộc tính <code>source</code> = <code>redeem</code>, <code>from</code> = nút đã mở bảng.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Mẫu số của phễu KYC và nạp tiền: có bao nhiêu khách đã thấy lời mời.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Gọi <code>trackView()</code> trong code (bảng mời: <code>track()</code>, mỗi lần mở), ở <code>shared/components.js</code>, hàm <code>joinPanel</code> và <code>mountJoinSheet</code>; <code>pages/point-balance.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>source</code></td><td>string</td><td><code>redeem</code></td><td><div class="val"><code>card</code> = khung "How to start" trên thẻ Today ở Earn, hoặc thẻ "Your coins will show up here" ở Coins (khách vãng lai)</div><div class="val"><code>redeem</code> = bảng mời ("Start earning to redeem"; khách vãng lai: "Join to redeem rewards"), mở từ nút ghi trong <code>from</code></div></td><td>Gắn cố định theo nơi hiện khung.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">Nút đã mở bảng:</div><div class="val"><code>redeem</code> = nút <code>Redeem</code> trên thẻ số dư (Home, Coins) hoặc <code>Explore rewards</code> ở Redemption history chưa có đơn</div><div class="val"><code>balance</code> = thẻ số dư ở Home (chỉ khách vãng lai)</div><div class="val"><code>reward</code> = một ô quà trong lưới quà ở Home</div><div class="val"><code>explore</code> = nút <code>Explore all rewards</code> ở Home</div><div class="val"><code>history</code> = link <code>Redemption history</code> ở Coins (chỉ khách vãng lai)</div><div class="vtext">Chỉ có khi <code>source</code> = <code>redeem</code>.</div></td><td>Nút vừa bấm để mở bảng.</td></tr><tr><td colspan="5" class="none">Kèm theo: 8 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_kyc_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_kyc_click</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Redemption history · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm nút <code>Verify my account</code> để đi xác minh tài khoản (KYC).</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút.</dd><dt>Vị trí</dt><dd>Nút chính trên khung "How to start" (ở Earn hoặc trong bảng "Start earning to redeem" ở Home, Coins và Redemption history), khi khách chưa KYC.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Tỷ lệ khách thấy lời mời rồi đi KYC.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>shared/components.js</code>, hàm <code>joinPanel</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>source</code></td><td>string</td><td><code>redeem</code></td><td><div class="vtext">Nơi bấm:</div><div class="val"><code>card</code> = khung "How to start" ở Earn</div><div class="val"><code>redeem</code> = bảng "Start earning to redeem", mở từ nút ghi trong <code>from</code></div></td><td>Gắn cố định theo nơi hiện nút.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">Nút đã mở bảng:</div><div class="val"><code>redeem</code> = nút <code>Redeem</code> trên thẻ số dư (Home, Coins) hoặc <code>Explore rewards</code> ở Redemption history chưa có đơn</div><div class="val"><code>balance</code> = thẻ số dư ở Home (chỉ khách vãng lai)</div><div class="val"><code>reward</code> = một ô quà trong lưới quà ở Home</div><div class="val"><code>explore</code> = nút <code>Explore all rewards</code> ở Home</div><div class="val"><code>history</code> = link <code>Redemption history</code> ở Coins (chỉ khách vãng lai)</div><div class="vtext">Chỉ có khi <code>source</code> = <code>redeem</code>.</div></td><td>Như ở <code>loyalty_join_card_view</code>.</td></tr><tr><td colspan="5" class="none">Kèm theo: 8 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_deposit_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_deposit_click</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Redemption history · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm nút <code>Deposit now</code> để đi nạp tiền: nạp lần đầu, hoặc nạp thêm để lên hạng tài khoản.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút.</dd><dt>Vị trí</dt><dd>Nút chính trên khung "How to start" (ở Earn hoặc trong bảng "Start earning to redeem" ở Home, Coins và Redemption history), khi khách đã KYC nhưng chưa nạp tiền. Nút <code>Deposit now</code> trong bảng hạng tài khoản ở Earn (thuộc tính <code>source</code> = <code>upgrade</code>).</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Tỷ lệ khách thấy lời mời rồi đi nạp tiền.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>shared/components.js</code>, hàm <code>joinPanel</code>; <code>pages/trading-task.js</code> (bảng hạng)</dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="vtext">Nơi bấm:</div><div class="val"><code>card</code> = khung "How to start" ở Earn</div><div class="val"><code>redeem</code> = bảng "Start earning to redeem", mở từ nút ghi trong <code>from</code></div><div class="val"><code>upgrade</code> = nút <code>Deposit now</code> trong bảng hạng tài khoản ở Earn</div></td><td>Gắn cố định trên nút.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>redeem</code></td><td><div class="vtext">Nút đã mở bảng:</div><div class="val"><code>redeem</code> = nút <code>Redeem</code> trên thẻ số dư (Home, Coins) hoặc <code>Explore rewards</code> ở Redemption history chưa có đơn</div><div class="val"><code>balance</code> = thẻ số dư ở Home (chỉ khách vãng lai)</div><div class="val"><code>reward</code> = một ô quà trong lưới quà ở Home</div><div class="val"><code>explore</code> = nút <code>Explore all rewards</code> ở Home</div><div class="val"><code>history</code> = link <code>Redemption history</code> ở Coins (chỉ khách vãng lai)</div><div class="vtext">Chỉ có khi <code>source</code> = <code>redeem</code>.</div></td><td>Như ở <code>loyalty_join_card_view</code>.</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">Chỉ khi <code>source</code> = <code>upgrade</code>: hạng hiện tại của tài khoản:</div><div class="val"><code>micro</code>, <code>standard</code> hoặc <code>vip</code> = nghĩa như ở <code>loyalty_upgrade_open</code>; tài khoản Platinum không có nút này</div></td><td>Từ nhóm MT5 của tài khoản.</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>platinum</code></td><td><div class="vtext">Chỉ khi <code>source</code> = <code>upgrade</code>: hạng kế tiếp:</div><div class="val"><code>standard</code>, <code>vip</code> hoặc <code>platinum</code></div></td><td>Hạng đứng sau trong bậc thang 4 hạng.</td></tr><tr><td colspan="5" class="none">Kèm theo: 8 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_open_account_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_open_account_click</code> <span class="evmeta">Màn hình: Earn · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách đã KYC và đã nạp tiền nhưng chưa có tài khoản giao dịch thật, và bấm nút <code>Open a trading account</code>.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút.</dd><dt>Vị trí</dt><dd>Nút trên thẻ Trading account ở Earn.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Đếm số khách bị chặn ở bước mở tài khoản giao dịch.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td colspan="5" class="none">Không có thuộc tính riêng.</td></tr><tr><td colspan="5" class="none">Kèm theo: 8 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_trade_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_trade_click</code> <span class="evmeta">Màn hình: Earn · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm nút đi giao dịch: <code>Trade with account …</code> ở Earn (khi hôm nay đã đạt mức coin tối đa, nút ghi <code>Trade now</code>), hoặc nút ở đáy bảng hạng tài khoản khi tài khoản đã ở hạng Platinum.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút.</dd><dt>Vị trí</dt><dd>Nút trên thẻ Trading account ở Earn; nút ở đáy bảng hạng tài khoản (thuộc tính <code>source</code> = <code>upgrade</code>).</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Đo việc các trang có đưa khách đi giao dịch không, và bao nhiêu lần bắt đầu từ bảng hạng.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>capped</code></td><td>string</td><td><code>false</code></td><td>Hôm nay khách đã đạt mức coin tối đa hay chưa: <code>true</code> hoặc <code>false</code>.</td><td>Trường <code>today.capped</code> của API trading task.</td></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="val"><code>upgrade</code> = nút ở đáy bảng hạng tài khoản (chỉ khi tài khoản ở hạng Platinum)</div><div class="vtext">Không có khi bấm nút trên thẻ Trading account.</div></td><td>Gắn cố định trên nút.</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>platinum</code></td><td>Chỉ khi <code>source</code> = <code>upgrade</code>: hạng của tài khoản (luôn là <code>platinum</code>).</td><td>Từ nhóm MT5 của tài khoản.</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>none</code></td><td>Chỉ khi <code>source</code> = <code>upgrade</code>: luôn là <code>none</code>.</td><td>Gắn cố định trên nút.</td></tr><tr><td colspan="5" class="none">Kèm theo: 8 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><h3 id="grp-1">B. Quan tâm tới quà</h3><p>Trả lời câu hỏi: khách có quan tâm tới đổi quà không, và ở mức số dư nào.</p><div class="scroll evblock" id="ev-loyalty_redeem_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_redeem_click</code> <span class="evmeta">Màn hình: Home, Coins, Redemption history · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm nút <code>Redeem</code> trên thẻ số dư hoặc nút <code>Explore rewards</code> ở Redemption history (khi chưa có đơn nào) để sang cửa hàng đổi quà. Với khách chưa đăng nhập, hoặc có trading task nhưng chưa KYC hay chưa nạp tiền lần đầu, nút mở bảng mời thay vì sang cửa hàng; event vẫn được gửi.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút.</dd><dt>Vị trí</dt><dd>Thẻ số dư coin ở Home và ở Coins. Nút <code>Explore rewards</code> ở trang Redemption history khi danh sách đơn còn trống.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Mức quan tâm tới đổi quà, chia theo <code>balance_range</code>.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>shared/components.js</code>, hàm <code>balanceBlock</code>; <code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td colspan="5" class="none">Không có thuộc tính riêng.</td></tr><tr><td colspan="5" class="none">Kèm theo: 8 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_rewards_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_rewards_view</code> <span class="evmeta">Màn hình: Home · Từ bản: Handoff 6</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách nhìn thấy lưới quà ở Home.</dd><dt>Thời điểm bắn</dt><dd>Khi ô đầu tiên của lưới hiện ít nhất một nửa trên màn hình; mỗi lần tải trang chỉ gửi một lần. Không có quà nào /td></tr><tr><td colspan="5" class="none">Kèm theo: 8 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><h3 id="grp-6">G. Sự cố</h3><p>Trả lời câu hỏi: trang lỗi tải thường xuyên tới mức nào.</p><div class="scroll evblock" id="ev-loyalty_error_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_error_view</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Redemption history · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách gặp một phần không tải được: cả trang (thẻ "Couldn’t load this page"), một đơn đổi quà, hoặc phần tải thêm của danh sách ("Couldn't load more"); thuộc tính <code>error_scope</code> cho biết phần nào.</dd><dt>Thời điểm bắn</dt><dd>Khi thẻ "Couldn’t load this page" hiện ra (cả trang, hoặc một đơn ở Redemption history); mỗi lần tải trang chỉ gửi một lần. <code>more</code>: khi dòng "Couldn’t load more" hiện ra, ở Coins và Redemption history; cũng chỉ một lần mỗi lần tải trang.</dd><dt>Vị trí</dt><dd>Thay cho toàn bộ nội dung trang (<code>page</code>, <code>order</code>); dòng "Couldn’t load more. Try again" cuối danh sách (<code>more</code>, ở Coins và Redemption history).</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Tần suất lỗi tải, so với <code>loyalty_page_view</code>. Lưu ý: khi API thật lỗi lúc mở trang, trang không hiện thẻ lỗi và không gửi event nào (spec §54).</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Gọi <code>trackView()</code> trong code, ở <code>shared/components.js</code>, hàm <code>showStatus</code>; <code>pages/point-balance.js</code>, <code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td><code>error_scope</code></td><td>string</td><td><code>page</code></td><td><div class="vtext">Phần không tải được:</div><div class="val"><code>page</code> = cả trang (thẻ "Couldn’t load this page")</div><div class="val"><code>order</code> = một đơn ở trang chi tiết (không có đơn đó, không phải của khách, hoặc lỗi mạng)</div><div class="val"><code>more</code> = phần tải thêm ở cuối danh sách ("Couldn’t load more")</div></td><td>Gắn theo chỗ gặp lỗi.</td></tr><tr><td colspan="5" class="none">Kèm theo: 8 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_retry_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_retry_click</code> <span class="evmeta">Màn hình: Home, Earn, Coins, Redemption history · Từ bản: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách bấm thử tải lại sau khi gặp lỗi.</dd><dt>Thời điểm bắn</dt><dd>Khi khách bấm nút <code>Try again</code> trên thẻ "Couldn’t load this page" (<code>error_scope</code> = <code>page</code> hoặc <code>order</code>).</dd><dt>Vị trí</dt><dd>Nút trên thẻ "Couldn’t load this page" (cả trang, hoặc một đơn). <code>Try again</code> ở dòng "Couldn’t load more" không gửi event này.</dd><dt>Nền tảng</dt><dd>Webview trong app iOS và Android</dd><dt>Dùng để làm gì</dt><dd>Biết khách có thử lại hay rời đi.</dd><dt>Trạng thái</dt><dd><span class="st st-wip">Đang làm</span></dd><dt>Cách gắn</dt><dd>Thuộc tính <code>data-track</code> trên nút, ở <code>shared/components.js</code>, hàm <code>showStatus</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr><tr><td colspan="5" class="none">Không có thuộc tính riêng.</td></tr><tr><td colspan="5" class="none">Kèm theo: 8 thuộc tính chung, xem tab <a href="#common" class="ref">3. Cách gửi, mục 3.2</a>.</td></tr></table></div></section><section class="panel" id="sending" role="tabpanel">
<h2>3. Cách gửi</h2>
<p>Mọi event đi qua một file duy nhất, <code>shared/tracking.js</code>. File này đẩy event vào <code>window.dataLayer</code>; Google Tag Manager đọc từ đó và chuyển tiếp. Ngoài file này, không chỗ nào trong code chạm vào <code>dataLayer</code>.</p>

<h3>3.1 Hai cách một event được gửi</h3>
<table>
  <tr><th style="width:22%">Loại</th><th style="width:38%">Cách gắn</th><th>Khi nào dùng</th></tr>
  <tr><td>Bấm nút</td><td>Thuộc tính <code>data-track</code> trên nút, thuộc tính riêng viết thành <code>data-track-&lt;name&gt;</code>. Một bộ lắng nghe chung đọc các thuộc tính này</td><td>Mọi event tên kết thúc bằng <code>_click</code> và các event bấm khác. Thêm một nút cần đo thì chỉ thêm thuộc tính, không viết code</td></tr>
  <tr><td>Nhìn thấy</td><td>Gọi <code>trackView()</code> trong code lúc thành phần hiện ra</td><td>Event tên kết thúc bằng <code>_view</code>. Mỗi lần tải trang chỉ gửi một lần</td></tr>
  <tr><td>Trường hợp khác</td><td>Gọi <code>track()</code> trong code</td><td>Event phụ thuộc vào logic, ví dụ chọn khoảng ngày hay các bước của tour</td></tr>
</table>
<p>Ví dụ gắn trên nút:</p>
<pre class="hl">&lt;button data-track=<span class="str">"loyalty_reward_click"</span> data-track-position=<span class="str">"1"</span>&gt;Redeem&lt;/button&gt;</pre>
<p>Ví dụ gọi trong code:</p>
<pre class="hl"><span class="kw">import</span> { track, trackView } <span class="kw">from</span> <span class="str">'./tracking.js'</span>;

<span class="cm">// Sent once per page load</span>
<span class="fn">trackView</span>(<span class="str">'loyalty_join_card_view'</span>, { step: <span class="str">'kyc'</span> });

<span class="cm">// Sent every time it is called</span>
<span class="fn">track</span>(<span class="str">'loyalty_tour_skip'</span>, { step: <span class="num">2</span> });</pre>
<p>Kết quả trong <code>dataLayer</code>:</p>
<pre class="hl"><span class="cm">// One event in the dataLayer: its name, every event property cleared (undefined),</span>
<span class="cm">// the common properties, then its own properties. Every value is text.</span>
window.dataLayer.<span class="fn">push</span>({
  event: <span class="str">'loyalty_trade_click'</span>,
  source: undefined, <span class="kw">from</span>: undefined, tier: undefined, /* … every other event property … */
  page: <span class="str">'earn'</span>,
  theme: <span class="str">'light'</span>,
  has_task: <span class="str">'true'</span>,
  join_step: <span class="str">'none'</span>,
  credit_mode: <span class="str">'in-day'</span>,
  balance_range: <span class="str">'1000-4999'</span>,
  loyalty_tier: <span class="str">'vip'</span>,
  capped: <span class="str">'false'</span>
});</pre>

<h3 id="common">3.2 Thuộc tính chung</h3>
<p>8 thuộc tính dưới đây được gửi kèm mọi event. Chúng được xác định một lần lúc trang mở.</p>
<div class="scroll"><table><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup>
  <tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách lấy giá trị</th></tr>
  <tr><td><code>page</code></td><td>string</td><td><code>earn</code></td><td><div class="vtext">Trang nơi event xảy ra:</div><div class="val"><code>home</code> = Home</div><div class="val"><code>earn</code> = Earn (trading task hằng ngày)</div><div class="val"><code>coins</code> = Coins (số dư và lịch sử coin)</div><div class="val"><code>orders</code> = Redemption history (đơn đổi quà)</div></td><td>Gắn cố định cho từng trang lúc trang mở.</td></tr><tr><td><code>theme</code></td><td>string</td><td><code>light</code></td><td>Chế độ màu đang hiển thị: <code>light</code> hoặc <code>dark</code>.</td><td>Thuộc tính <code>data-theme</code> của trang.</td></tr><tr><td><code>has_task</code></td><td>String</td><td><code>true</code></td><td><div class="val"><code>true</code> = khách có trading task (có tab Earn)</div><div class="val"><code>false</code> = trading task tắt hoặc ẩn với khách (không có tab Earn)</div><div class="vtext">Gửi dạng chữ.</div></td><td>Trường <code>tradingTask</code> của API trading task.</td></tr><tr><td><code>join_step</code></td><td>string</td><td><code>none</code></td><td><div class="vtext">Bước khách còn phải làm trước khi được tính coin:</div><div class="val"><code>signup</code> = chưa đăng nhập (khách vãng lai)</div><div class="val"><code>kyc</code> = đã đăng nhập, chưa KYC</div><div class="val"><code>deposit</code> = đã KYC, chưa nạp tiền lần đầu</div><div class="val"><code>none</code> = không còn bước nào, hoặc khách đã đăng nhập nhưng không có trading task (khi đó <code>none</code> không có nghĩa là đã KYC)</div></td><td>Từ dữ liệu đăng nhập của app: <code>kycApproveTime</code> = 0 là <code>kyc</code>; <code>kycApproveTime</code> &gt; 0 và <code>firstDepositTime</code> = 0 là <code>deposit</code>; còn lại là <code>none</code>. Khách đã đăng nhập mà không có trading task luôn là <code>none</code>. Khi app mở trang không có token: <code>signup</code>.</td></tr><tr><td><code>credit_mode</code></td><td>string</td><td><code>in-day</code></td><td><div class="val"><code>in-day</code> = coin được cộng trong ngày giao dịch</div><div class="val"><code>delayed</code> = coin được cộng sau ngày giao dịch vài ngày</div><div class="val"><code>none</code> = khách không có trading task</div></td><td>Trường <code>program.creditMode</code> của API trading task.</td></tr><tr><td><code>balance_range</code></td><td>string</td><td><code>1000-4999</code></td><td>Số dư coin theo khoảng: <code>0</code>, <code>1-999</code>, <code>1000-4999</code>, <code>5000+</code>. Số dư chính xác không được gửi.</td><td>Tính từ trường <code>available</code> của API tổng quan coin.</td></tr><tr><td><code>loyalty_tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">Hạng của khách: hạng cao nhất trong các tài khoản Eligible.</div><div class="val"><code>micro</code>, <code>standard</code>, <code>vip</code>, <code>platinum</code> = nghĩa như ở <code>loyalty_upgrade_open</code></div><div class="val"><code>none</code> = không có tài khoản Eligible nào thuộc 4 hạng (chưa có tài khoản thật, không có trading task, mọi tài khoản đều không được tính coin, hoặc tài khoản ở nhóm MT5 khác)</div><div class="vtext">Không gửi với khách vãng lai. GTM gắn nó thành user property <code>loyalty_tier</code> của GA4.</div></td><td>Từ nhóm MT5 của các tài khoản (trường <code>accounts[].group</code> và <code>accounts[].eligible</code> của API trading task).</td></tr><tr><td><code>view</code></td><td>string</td><td><code>list</code></td><td><div class="vtext">Chỉ ở trang Redemption history:</div><div class="val"><code>list</code> = danh sách có đơn</div><div class="val"><code>empty</code> = chưa có đơn</div><div class="val"><code>detail</code> = chi tiết một đơn, kể cả khi đơn không mở được</div></td><td>Xác định lúc trang mở.</td></tr>
</table></div>

<h3>3.3 Giới hạn và lưu ý</h3>
<ul>
  <li><b>Giới hạn của GA4:</b> tên event và tên thuộc tính tối đa 40 ký tự, giá trị tối đa 100 ký tự, mỗi event tối đa 25 thuộc tính. Mọi event hiện tại đều nằm trong giới hạn.</li>
  <li><b>Kiểu dữ liệu:</b> mọi giá trị đều gửi dạng chữ, kể cả <code>"true"</code> hay <code>"1"</code>, để một custom dimension của GA4 không bị lẫn kiểu.</li>
  <li><b>Xoá thuộc tính cũ:</b> GTM giữ giá trị cuối của mỗi thuộc tính. Vì vậy mỗi lần gửi, mọi thuộc tính riêng của event được đặt về <code>undefined</code> trước, rồi mới gắn thuộc tính của event đó; nếu không, một event không có <code>source</code> sẽ bị đọc thành <code>source</code> của event trước. Thêm thuộc tính mới thì thêm vào danh sách <code>PARAMS</code> trong <code>shared/tracking.js</code>.</li>
  <li><b>Kiểm tra tự động:</b> <code>node tools/check-tracking.mjs</code> mở các trang, bấm thử và báo lỗi khi event lệch với danh sách này.</li>
  <li><b>Event của nút rời trang:</b> thanh điều hướng, các thẻ ở Home, <code>Skip tour</code> và <code>Finish tour</code> đẩy event trước khi chuyển trang.</li>
  <li><b>Chưa có GTM:</b> trang vẫn chạy bình thường; event chỉ nằm chờ trong <code>dataLayer</code>.</li>
</ul>

<h3>3.4 Cấu hình trên GTM và GA4</h3>
<table>
  <tr><th style="width:8%">Bước</th><th>Việc cần làm</th></tr>
  <tr><td>1</td><td>Trong GTM, tạo một trigger loại Custom Event, bật biểu thức chính quy, với tên event <code>^loyalty_</code></td></tr>
  <tr><td>2</td><td>Tạo một tag GA4 Event dùng trigger đó, tên event là <code>{{Event}}</code></td></tr>
  <tr><td>3</td><td>Tạo Data Layer Variable cho từng thuộc tính và thêm vào tag làm tham số của event; riêng <code>loyalty_tier</code> thêm vào mục User Properties của tag</td></tr>
  <tr><td>4</td><td>Trong GA4, đăng ký các thuộc tính cần dùng để chia báo cáo làm custom dimension <b>trước khi ra mắt</b> (GA4 không áp dụng cho dữ liệu đã thu): theo event cho các thuộc tính chung và riêng, theo user cho <code>loyalty_tier</code></td></tr>

<script>var TITLES = {"en": "HSB Loyalty – Front-end Event Tracking", "zh": "HSB Loyalty – 前端事件追踪", "vi": "HSB Loyalty – Event tracking phía front-end"};
(function () {
  var app = document.getElementById('app'), sel = document.getElementById('lang');
  var FIRST = 'overview', current = FIRST;
  function show(id, push) {
    app.querySelectorAll('.tabs button').forEach(function (b) {
      var on = b.dataset.tab === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      document.getElementById(b.dataset.tab).classList.toggle('on', on);
    });
    current = id;
    if (push) history.replaceState(null, '', '#' + id);
  }
  // Link nội bộ: mở đúng tab chứa đích rồi cuộn tới
  function go(hash) {
    var el = hash && hash.length > 1 && document.getElementById(hash.slice(1));
    if (!el) return false;
    var panel = el.classList.contains('panel') ? el : el.closest('.panel');
    if (!panel) return false;
    show(panel.id, false);
    if (el !== panel) el.scrollIntoView(); else window.scrollTo(0, 0);
    return true;
  }
  function mount(lang, keepTab) {
    var tpl = document.getElementById('tpl-' + lang) || document.getElementById('tpl-en');
    app.innerHTML = tpl.innerHTML;
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    document.title = TITLES[lang] || TITLES.en;
    sel.value = lang;
    if (keepTab) show(current, false);
    else if (!go(location.hash)) show(FIRST, false);
  }
  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tabs button');
    if (tab) { show(tab.dataset.tab, true); window.scrollTo(0, 0); return; }
    var a = ev.target.closest('a.ref');
    if (a && go(a.getAttribute('href'))) { ev.preventDefault(); history.replaceState(null, '', a.getAttribute('href')); }
  });
  sel.addEventListener('change', function () {
    try { localStorage.setItem('hsb-doc-lang', sel.value); } catch (err) {}
    mount(sel.value, true);
  });
  var saved = null;
  try { saved = localStorage.getItem('hsb-doc-lang'); } catch (err) {}
  mount(saved === 'zh' || saved === 'vi' || saved === 'en' ? saved : 'en', false);
})();
</script>
