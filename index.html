<h2>2. Details of each event</h2>
<p>38 events in 8 groups, by the analysis question they answer. Each event is one block: the name row, the description, then the table of that event's own properties.</p>
<p><a href="#grp-0" class="ref">A. From sign-up to trading</a> · <a href="#grp-1" class="ref">B. Interest in rewards</a> · <a href="#grp-2" class="ref">C. Use of the pages</a> · <a href="#grp-3" class="ref">D. Guided tour</a> · <a href="#grp-4" class="ref">E. Guests</a> · <a href="#grp-5" class="ref">F. Redemption history</a> · <a href="#grp-6" class="ref">G. Problems</a> · <a href="#grp-7" class="ref">H. Rewards store (Plan B)</a></p><h3 id="grp-0">A. From sign-up to trading</h3><p>Answers the question: do customers go all the way from the invitation to KYC, deposit and trading?</p><div class="scroll evblock" id="ev-loyalty_join_card_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_join_card_view</code> <span class="evmeta">Screen: Home, Earn, Coins, Redemption history · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer sees an invitation to start: the "How to start" panel (the steps to take before earning coins) or the "Your coins will show up here" card on Coins. Shown to customers who have a trading task but have not completed KYC or made a first deposit (<code>join_step</code> = <code>kyc</code>, <code>deposit</code>), and to guests (<code>join_step</code> = <code>signup</code>).</dd><dt>When it is sent</dt><dd>When the panel is shown. The panel on Earn and the sign-up card on Coins: sent once per page load. The invitation sheet ("Start earning to redeem", or "Join to redeem rewards" for guests): sent every time it opens.</dd><dt>Location</dt><dd>The Today card on Earn; the "Your coins will show up here" card on Coins (guests); the invitation sheet that opens when the customer taps <code>Redeem</code>, a reward card, <code>Explore all rewards</code>, <code>Explore rewards</code> on an empty Redemption history, or (guests) the balance card or <code>Redemption history</code>, on Home, Coins and Redemption history. The sheet is titled "Start earning to redeem" (guests: "Join to redeem rewards"); property <code>source</code> = <code>redeem</code>, <code>from</code> = the button that opened it.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Denominator of the KYC and deposit funnel: how many customers saw the invitation.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>Called with <code>trackView()</code> in code (the invitation sheet: <code>track()</code>, on every opening), in <code>shared/components.js</code>, function <code>joinPanel</code> and <code>mountJoinSheet</code>; <code>pages/point-balance.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>source</code></td><td>string</td><td><code>redeem</code></td><td><div class="val"><code>card</code> = the "How to start" panel on the Today card on Earn, or the "Your coins will show up here" card on Coins (guests)</div><div class="val"><code>redeem</code> = the invitation sheet ("Start earning to redeem"; guests: "Join to redeem rewards"), opened by the button named in <code>from</code></div></td><td>Fixed by where the panel is shown.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">The button that opened the sheet:</div><div class="val"><code>redeem</code> = the <code>Redeem</code> button on the balance card (Home, Coins) or <code>Explore rewards</code> on an empty Redemption history</div><div class="val"><code>balance</code> = the balance card on Home (guests only)</div><div class="val"><code>reward</code> = a reward card in the rewards grid on Home</div><div class="val"><code>explore</code> = the <code>Explore all rewards</code> button on Home</div><div class="val"><code>history</code> = the <code>Redemption history</code> link on Coins (guests only)</div><div class="vtext">Only when <code>source</code> = <code>redeem</code>.</div></td><td>The button just tapped to open the sheet.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_kyc_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_kyc_click</code> <span class="evmeta">Screen: Home, Earn, Coins, Redemption history · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps <code>Verify my account</code> to go and verify their account (KYC).</dd><dt>When it is sent</dt><dd>When the customer taps the button.</dd><dt>Location</dt><dd>The main button on the "How to start" panel (on Earn or in the "Start earning to redeem" sheet on Home, Coins and Redemption history), when the customer has not completed KYC.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Share of customers who see the invitation and then go to KYC.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, function <code>joinPanel</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>source</code></td><td>string</td><td><code>redeem</code></td><td><div class="vtext">Where it was tapped:</div><div class="val"><code>card</code> = the "How to start" panel on Earn</div><div class="val"><code>redeem</code> = the "Start earning to redeem" sheet, opened by the button named in <code>from</code></div></td><td>Fixed by where the button is shown.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">The button that opened the sheet:</div><div class="val"><code>redeem</code> = the <code>Redeem</code> button on the balance card (Home, Coins) or <code>Explore rewards</code> on an empty Redemption history</div><div class="val"><code>balance</code> = the balance card on Home (guests only)</div><div class="val"><code>reward</code> = a reward card in the rewards grid on Home</div><div class="val"><code>explore</code> = the <code>Explore all rewards</code> button on Home</div><div class="val"><code>history</code> = the <code>Redemption history</code> link on Coins (guests only)</div><div class="vtext">Only when <code>source</code> = <code>redeem</code>.</div></td><td>As on <code>loyalty_join_card_view</code>.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_deposit_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_deposit_click</code> <span class="evmeta">Screen: Home, Earn, Coins, Redemption history · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps <code>Deposit now</code> to go and deposit: a first deposit, or more to move the account up a tier.</dd><dt>When it is sent</dt><dd>When the customer taps the button.</dd><dt>Location</dt><dd>The main button on the "How to start" panel (on Earn or in the "Start earning to redeem" sheet on Home, Coins and Redemption history), when the customer has completed KYC but not deposited. The <code>Deposit now</code> button in the account tier sheet on Earn (property <code>source</code> = <code>upgrade</code>).</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Share of customers who see the invitation and then go to deposit.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, function <code>joinPanel</code>; <code>pages/trading-task.js</code> (tier sheet)</dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="vtext">Where it was tapped:</div><div class="val"><code>card</code> = the "How to start" panel on Earn</div><div class="val"><code>redeem</code> = the "Start earning to redeem" sheet, opened by the button named in <code>from</code></div><div class="val"><code>upgrade</code> = the <code>Deposit now</code> button in the account tier sheet on Earn</div></td><td>Fixed on the button.</td></tr><tr><td><code>from</code></td><td>string</td><td><code>redeem</code></td><td><div class="vtext">The button that opened the sheet:</div><div class="val"><code>redeem</code> = the <code>Redeem</code> button on the balance card (Home, Coins) or <code>Explore rewards</code> on an empty Redemption history</div><div class="val"><code>balance</code> = the balance card on Home (guests only)</div><div class="val"><code>reward</code> = a reward card in the rewards grid on Home</div><div class="val"><code>explore</code> = the <code>Explore all rewards</code> button on Home</div><div class="val"><code>history</code> = the <code>Redemption history</code> link on Coins (guests only)</div><div class="vtext">Only when <code>source</code> = <code>redeem</code>.</div></td><td>As on <code>loyalty_join_card_view</code>.</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">Only when <code>source</code> = <code>upgrade</code>: the account's current tier:</div><div class="val"><code>micro</code>, <code>standard</code> or <code>vip</code> = meaning as on <code>loyalty_upgrade_open</code>; Platinum accounts have no such button</div></td><td>From the account's MT5 group.</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>platinum</code></td><td><div class="vtext">Only when <code>source</code> = <code>upgrade</code>: the next tier:</div><div class="val"><code>standard</code>, <code>vip</code> or <code>platinum</code></div></td><td>The tier after it on the four-tier ladder.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_open_account_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_open_account_click</code> <span class="evmeta">Screen: Earn · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer has completed KYC and made a deposit but has no live trading account, and taps <code>Open a trading account</code>.</dd><dt>When it is sent</dt><dd>When the customer taps the button.</dd><dt>Location</dt><dd>The button on the Trading account card on Earn.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Counts customers who are blocked at the step of opening a trading account.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_trade_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_trade_click</code> <span class="evmeta">Screen: Earn · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps a button to go and trade: <code>Trade with account …</code> on Earn (when today's maximum coins is reached, the button reads <code>Trade now</code>), or the button at the bottom of the account tier sheet when the account is already Platinum.</dd><dt>When it is sent</dt><dd>When the customer taps the button.</dd><dt>Location</dt><dd>The button on the Trading account card on Earn; the button at the bottom of the account tier sheet (property <code>source</code> = <code>upgrade</code>).</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Measures whether the pages lead customers to trade, and how many trades start from the tier sheet.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>capped</code></td><td>string</td><td><code>false</code></td><td>Whether the customer has already reached today's maximum coins: <code>true</code> or <code>false</code>.</td><td>The field <code>today.capped</code> of the trading task API.</td></tr><tr><td><code>source</code></td><td>string</td><td><code>upgrade</code></td><td><div class="val"><code>upgrade</code> = the button at the bottom of the account tier sheet (only when the account is Platinum)</div><div class="vtext">Absent when the button on the Trading account card is tapped.</div></td><td>Fixed on the button.</td></tr><tr><td><code>tier</code></td><td>string</td><td><code>platinum</code></td><td>Only when <code>source</code> = <code>upgrade</code>: the account's tier (always <code>platinum</code>).</td><td>From the account's MT5 group.</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>none</code></td><td>Only when <code>source</code> = <code>upgrade</code>: always <code>none</code>.</td><td>Fixed on the button.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-1">B. Interest in rewards</h3><p>Answers the question: are customers interested in redeeming rewards, and at which balance?</p><div class="scroll evblock" id="ev-loyalty_redeem_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_redeem_click</code> <span class="evmeta">Screen: Home, Coins, Redemption history · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps the <code>Redeem</code> button on the balance card or the <code>Explore rewards</code> button on Redemption history (when there are no orders yet) to go to the rewards store. For customers who are not signed in, or who have a trading task but have not completed KYC or a first deposit, the button opens an invitation sheet instead of the store; the event is still sent. When Plan B is on (<code>redeem_mode</code> = <code>store</code>), the button opens the rewards store in the webview (Reward Store) for every customer, not an invitation sheet.</dd><dt>When it is sent</dt><dd>When the customer taps the button.</dd><dt>Location</dt><dd>The coin balance card on Home and on Coins. The <code>Explore rewards</code> button on the Redemption history page when the order list is empty.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Interest in redeeming rewards, broken down by <code>balance_range</code>.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, function <code>balanceBlock</code>; <code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_rewards_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_rewards_view</code> <span class="evmeta">Screen: Home · Since: Handoff 6</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer sees the rewards grid on Home.</dd><dt>When it is sent</dt><dd>When the grid's first card is at least half on screen; sent once per page load. With no rewards (empty or failed rewards list): sent at once, with <code>reward_count</code> = <code>0</code>.</dd><dt>Location</dt><dd>The rewards grid under "Redeem coins for rewards" on Home.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Denominator of the reward clicks: click rate by position and by reward; shows when the rewards list is empty.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>trackView()</code> in the code, in <code>pages/dashboard.js</code>, function <code>watchRewards</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>reward_count</code></td><td>string</td><td><code>9</code></td><td><div class="vtext">Number of rewards in the grid (the <code>Earn more coins</code> card not counted): from <code>0</code> to <code>9</code> when the grid has the <code>Earn more coins</code> card, up to <code>10</code> when it does not.</div><div class="val"><code>0</code> = no rewards (empty or failed list)</div></td><td>Number of rewards shown.</td></tr><tr><td><code>has_earn_card</code></td><td>string</td><td><code>true</code></td><td>Whether the grid has the <code>Earn more coins</code> card (the card that opens Earn): <code>true</code> or <code>false</code>.</td><td><code>true</code> when the customer has a trading task, the programme has not ended and the grid has at least one reward; otherwise <code>false</code>.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_reward_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_reward_click</code> <span class="evmeta">Screen: Home, Reward Store · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps a reward: a card in the rewards grid on Home, or a reward in the rewards store, Reward Store (a card in the Popular section, a voucher in the F&amp;B section, a card in the Tour &amp; Travel section, a card in the list on the Categories tab). The <code>section</code> property says where the reward was tapped.</dd><dt>When it is sent</dt><dd>When the customer taps; on Home, also when the card opens the invitation sheet instead of the store. When Plan B is on, the reward card on Home opens that reward's page directly.</dd><dt>Location</dt><dd>The rewards grid under "Redeem coins for rewards" on Home (up to 10 cards); the sections and the rewards list of the Reward Store.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows which rewards, categories, price levels and positions get tapped most; the first step of the funnel: tap a reward → view details → Checkout.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/dashboard.js</code>, <code>pages/store.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>position</code></td><td>string</td><td><code>1</code></td><td><div class="vtext">The reward's rank where it was tapped (<code>section</code>), counted from <code>1</code>:</div><div class="vtext">Home: from <code>1</code> to <code>9</code> (up to <code>10</code> when there is no <code>Earn more coins</code> card); the <code>Earn more coins</code> card is not counted</div><div class="vtext">Popular: <code>1</code> to <code>8</code>; F&amp;B and Tour &amp; Travel: <code>1</code> to <code>4</code></div><div class="vtext">The list on the Categories tab: the order in the filtered list (up to about <code>50</code> with the All chip)</div></td><td>The order of the reward card in the grid, section or list on screen.</td></tr><tr><td><code>reward_id</code></td><td>string</td><td><code>101</code></td><td>ID of the reward.</td><td>The <code>id</code> field of the rewards list API (<code>/pointSys/app/point/catalog</code>).</td></tr><tr><td><code>reward_name</code></td><td>string</td><td><code>AirPods Pro 2</code></td><td>The reward's name, as HSB sends it (cut at 100 characters).</td><td>The <code>name</code> field of the rewards list API.</td></tr><tr><td><code>affordable</code></td><td>string</td><td><code>true</code></td><td><div class="vtext">Whether the balance covers the reward:</div><div class="val"><code>true</code> = the balance is greater than or equal to the price</div><div class="val"><code>false</code> = the balance is less than the price</div><div class="vtext">Not sent for guests (their balance is always 0, which would skew the "not enough coins" rate). Neither the exact balance nor the exact price is sent.</div></td><td>Compares the balance (<code>available</code> of the coin summary API) with the reward's price. Not sent when <code>join_step</code> = <code>signup</code>.</td></tr><tr><td><code>section</code></td><td>string</td><td><code>popular</code></td><td><div class="vtext">Where the reward was tapped:</div><div class="val"><code>home</code> = the rewards grid on Home</div><div class="val"><code>popular</code> = the Popular Rewards section on the Home Store tab</div><div class="val"><code>fnb</code> = the F&amp;B e-Vouchers section on the Home Store tab</div><div class="val"><code>travel</code> = the Tour &amp; Travel section on the Home Store tab</div><div class="val"><code>list</code> = the rewards list on the Categories tab (the category being filtered is in <code>filter</code>)</div></td><td>Fixed by where the reward card is shown.</td></tr><tr><td><code>filter</code></td><td>string</td><td><code>fnb_voucher</code></td><td><div class="vtext">Only when <code>section</code> = <code>list</code>: the category chip selected on the Categories tab when the customer taps:</div><div class="val"><code>all</code> = the All chip (every reward)</div><div class="val"><code>gadget_electronics</code>, <code>tour_travel</code>, <code>shopping_voucher</code>, <code>fnb_voucher</code>, <code>home_living</code> = the chip of that category (meaning as on <code>category</code>)</div></td><td>The chip selected when the customer taps.</td></tr><tr><td><code>category</code></td><td>string</td><td><code>fnb_voucher</code></td><td><div class="vtext">The reward's category:</div><div class="val"><code>gadget_electronics</code> = Gadget &amp; Electronics (tech gadgets)</div><div class="val"><code>tour_travel</code> = Tour &amp; Travel (travel)</div><div class="val"><code>shopping_voucher</code> = Shopping e-Voucher (shopping vouchers)</div><div class="val"><code>fnb_voucher</code> = F&amp;B e-Voucher (food and drink vouchers)</div><div class="val"><code>home_living</code> = Home &amp; Living (household goods)</div><div class="val"><code>none</code> = a reward with no category (shown only under the <code>All</code> chip)</div></td><td>The <code>category</code> field of the rewards list API; <code>none</code> is sent when it is missing or empty.</td></tr><tr><td><code>badge</code></td><td>string</td><td><code>hot</code></td><td><div class="vtext">The label the customer sees on the tapped reward card:</div><div class="val"><code>hot</code> = the HOT label</div><div class="val"><code>new</code> = the New label</div><div class="val"><code>none</code> = no label. F&amp;B voucher cards, Tour &amp; Travel cards and the rewards grid on Home show no label, so <code>none</code> is always sent, even when the reward has a label in the data</div><div class="vtext">In the Popular section, <code>hot</code> rewards are placed first, so read the effect of the label together with <code>position</code>.</div></td><td>F&amp;B voucher cards, Tour &amp; Travel cards, the Home rewards grid: always <code>none</code>. Square cards (Popular, the list on the Categories tab): the <code>badge</code> field of the rewards list API (<code>hot</code>, <code>new</code>, or <code>none</code> when missing).</td></tr><tr><td><code>price_range</code></td><td>string</td><td><code>1-4999</code></td><td><div class="vtext">The reward's price (in coins), as a range; the exact price is not sent:</div><div class="val"><code>1-4999</code> = under 5,000 coins</div><div class="val"><code>5000-19999</code> = from 5,000 to under 20,000 coins</div><div class="val"><code>20000-49999</code> = from 20,000 to under 50,000 coins</div><div class="val"><code>50000+</code> = 50,000 coins or more</div><div class="vtext">The range boundaries are set from the sample data (prices from 1,000 to 150,000 coins); confirm them against the real prices before going live.</div></td><td>Computed from the <code>points</code> field (price in coins) of the rewards list API.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_expiring_notice_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_expiring_notice_view</code> <span class="evmeta">Screen: Home, Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer sees the warning that some coins will expire within the next 10 days.</dd><dt>When it is sent</dt><dd>When the page draws the notice (whether the customer scrolls to it is not measured); sent once per page load.</dd><dt>Location</dt><dd>The red warning line under the balance, inside the balance card.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows whether the expiry warning pushes customers to redeem.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>trackView()</code> in the code, in <code>shared/components.js</code>, function <code>balanceBlock</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-2">C. Use of the pages</h3><p>Answers the question: which pages and parts of the programme do customers use?</p><div class="scroll evblock" id="ev-loyalty_page_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_page_view</code> <span class="evmeta">Screen: Home, Earn, Coins, Redemption history, Reward Store · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer opens a page: a page of the programme, or a page of the rewards store, Reward Store (<code>page</code> = <code>store</code> or <code>reward</code>).</dd><dt>When it is sent</dt><dd>As soon as the page has data to show; sent once per page load. Still sent when the page shows the "Couldn’t load this page" card. When the real API fails as the page opens, the page shows no error card and does not send this event (spec §54). The store page sends the event again every time the customer comes back from a reward page (the Back button reloads the page): count store visits as those with <code>entry</code> other than <code>return</code>.</dd><dt>Location</dt><dd>Every page; told apart by the common property <code>page</code>. The reward page also sends the reward's details.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Views of each page; the denominator for the other rates; tells whether the customer has ever opened the programme.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> in the code, in <code>shared/tracking.js</code>, function <code>initTracking</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>reward_id</code></td><td>string</td><td><code>101</code></td><td>ID of the reward. Only on the reward page (<code>page</code> = <code>reward</code>); present even when the reward is not found.</td><td>The <code>id</code> field of the rewards list API (<code>/pointSys/app/point/catalog</code>). On the page: the <code>id</code> parameter of the address.</td></tr><tr><td><code>reward_name</code></td><td>string</td><td><code>iPhone 16 Pro</code></td><td>The reward's name, as HSB sends it (cut at 100 characters). The name can be edited, so report by <code>reward_id</code> and use the name as a label. Only on the reward page, when the reward is found.</td><td>The <code>name</code> field of the rewards list API.</td></tr><tr><td><code>category</code></td><td>string</td><td><code>gadget_electronics</code></td><td><div class="vtext">The reward's category:</div><div class="val"><code>gadget_electronics</code> = Gadget &amp; Electronics (tech gadgets)</div><div class="val"><code>tour_travel</code> = Tour &amp; Travel (travel)</div><div class="val"><code>shopping_voucher</code> = Shopping e-Voucher (shopping vouchers)</div><div class="val"><code>fnb_voucher</code> = F&amp;B e-Voucher (food and drink vouchers)</div><div class="val"><code>home_living</code> = Home &amp; Living (household goods)</div><div class="val"><code>none</code> = a reward with no category (shown only under the <code>All</code> chip)</div><div class="vtext">Reward page only.</div></td><td>The <code>category</code> field of the rewards list API; <code>none</code> is sent when it is missing or empty.</td></tr><tr><td><code>badge</code></td><td>string</td><td><code>hot</code></td><td><div class="vtext">The reward's label, shown before the name on the reward page:</div><div class="val"><code>hot</code> = the HOT label</div><div class="val"><code>new</code> = the New label</div><div class="val"><code>none</code> = no label</div><div class="vtext">Reward page only.</div></td><td>The <code>badge</code> field of the rewards list API; <code>none</code> when it is missing.</td></tr><tr><td><code>price_range</code></td><td>string</td><td><code>50000+</code></td><td><div class="vtext">The reward's price (in coins), as a range; the exact price is not sent:</div><div class="val"><code>1-4999</code> = under 5,000 coins</div><div class="val"><code>5000-19999</code> = from 5,000 to under 20,000 coins</div><div class="val"><code>20000-49999</code> = from 20,000 to under 50,000 coins</div><div class="val"><code>50000+</code> = 50,000 coins or more</div><div class="vtext">The range boundaries are set from the sample data (prices from 1,000 to 150,000 coins); confirm them against the real prices before going live.</div><div class="vtext">Reward page only.</div></td><td>Computed from the <code>points</code> field (price in coins) of the rewards list API.</td></tr><tr><td><code>affordable</code></td><td>string</td><td><code>false</code></td><td><div class="vtext">Whether the balance covers the reward:</div><div class="val"><code>true</code> = the balance is greater than or equal to the price</div><div class="val"><code>false</code> = the balance is less than the price</div><div class="vtext">Not sent for guests (their balance is always 0, which would skew the "not enough coins" rate). Neither the exact balance nor the exact price is sent.</div><div class="vtext">Reward page only.</div></td><td>Compares the balance (<code>available</code> of the coin summary API) with the reward's price. Not sent when <code>join_step</code> = <code>signup</code>.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_nav_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_nav_click</code> <span class="evmeta">Screen: Home, Earn, Coins, Reward Store · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps a tab in the bottom navigation bar, or taps the X button to leave the programme. In the Reward Store: taps the Home Store or Categories tab in the store's bottom bar, the Back button in that bar, or the Back button at the top of the reward page.</dd><dt>When it is sent</dt><dd>When the customer taps. In the Reward Store bottom bar, sent only when the tab actually changes (tapping the open tab does not send it).</dd><dt>Location</dt><dd>The floating navigation bar at the bottom of the screen; the Reward Store bottom bar; the Back button at the top of the reward page.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>The customer's path between pages; number of exits. Back counts only the in-page Back button: the app's or the phone's back button is not recorded, so do not use it as an exit rate.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/nav.js</code>; <code>pages/store.js</code>, function <code>storeHead</code> in <code>shared/store.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>target</code></td><td>string</td><td><code>earn</code></td><td><div class="vtext">Where the customer tapped to:</div><div class="val"><code>home</code> = the Home tab</div><div class="val"><code>earn</code> = the Earn tab (absent when the customer has no trading task)</div><div class="val"><code>coins</code> = the Coins tab</div><div class="val"><code>exit</code> = the X button, leaving the programme for the app</div><div class="val"><code>store_home</code> = the Home Store tab in the Reward Store bottom bar</div><div class="val"><code>categories</code> = the Categories tab in the Reward Store bottom bar</div><div class="val"><code>back</code> = the Back button in the Reward Store bottom bar, or the Back button at the top of the reward page (<code>page</code> says which)</div><div class="vtext">In the programme's navigation bar, tapping the tab of the open page still sends it; in the Reward Store bar it does not.</div></td><td>Fixed for each button.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_card_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_card_click</code> <span class="evmeta">Screen: Home · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>On Home, the customer taps the balance card to go to Coins, taps the <code>Earn more coins</code> card in the rewards grid to go to Earn, or taps <code>Explore all rewards</code> to go to the rewards store. For guests, the balance card opens the sign-up invitation sheet; for customers who are not signed in or have not completed KYC or a first deposit, <code>Explore all rewards</code> opens the invitation sheet instead of the store; the event is still sent. When Plan B is on, <code>Explore all rewards</code> opens the rewards store in the webview (Reward Store).</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The balance card, the <code>Earn more coins</code> card and the "Looking for something else?" card (with no rewards grid: "Find rewards for your coins") on Home.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows where customers enter Earn, Coins and the rewards store from.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, <code>pages/dashboard.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>target</code></td><td>string</td><td><code>coins</code></td><td><div class="vtext">Destination:</div><div class="val"><code>coins</code> = a tap on the balance card</div><div class="val"><code>earn</code> = a tap on the <code>Earn more coins</code> card</div><div class="val"><code>rewards</code> = a tap on <code>Explore all rewards</code></div></td><td>Fixed for each card.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_tab_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_tab_click</code> <span class="evmeta">Screen: Earn, Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer switches tab inside a page.</dd><dt>When it is sent</dt><dd>When the customer taps a tab.</dd><dt>Location</dt><dd>The How it works / History tabs on Earn; the Available / Expired / History tabs on Coins.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows which tabs are viewed.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code>, <code>pages/point-balance.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tab</code></td><td>string</td><td><code>history</code></td><td><div class="vtext">The tab tapped (including the tab already open).</div><div class="vtext">On Earn:</div><div class="val"><code>rules</code> = the How it works tab (the coin rules)</div><div class="val"><code>history</code> = the History tab (coins per trading day)</div><div class="vtext">On Coins:</div><div class="val"><code>available</code> = the Available tab (coin lots still usable)</div><div class="val"><code>expired</code> = the Expired tab (expired coins)</div><div class="val"><code>history</code> = the History tab (every coin added or taken)</div><div class="val"><code>history</code> exists on both pages: tell them apart by <code>page</code>. Guests have no tabs.</div></td><td>Fixed for each tab.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_date_filter_apply"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_date_filter_apply</code> <span class="evmeta">Screen: Earn, Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer chooses a date range for the list they are viewing.</dd><dt>When it is sent</dt><dd>When the customer taps the <code>Last 7 days</code> or <code>Last 30 days</code> chip, or taps <code>Apply</code> in the date picker.</dd><dt>Location</dt><dd>The date filter above the history list.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows whether customers look back at older data.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> in the code, in <code>shared/date-filter.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tab</code></td><td>string</td><td><code>history</code></td><td><div class="vtext">The list filtered:</div><div class="val"><code>history</code> = the History tab on Earn or on Coins (tell them apart by <code>page</code>)</div><div class="val"><code>expired</code> = the Expired tab on Coins</div></td><td>Fixed by the list that has the filter.</td></tr><tr><td><code>range</code></td><td>string</td><td><code>30</code></td><td><div class="val"><code>7</code> = the <code>Last 7 days</code> chip</div><div class="val"><code>30</code> = the <code>Last 30 days</code> chip</div><div class="val"><code>custom</code> = a range picked on the calendar (30 days at most), sent when <code>Apply</code> is tapped (tapping the <code>Custom</code> chip only opens the calendar)</div><div class="vtext">Tapping the selected chip again still sends it; the default on page open does not.</div></td><td>The chip that was tapped, or <code>custom</code> when <code>Apply</code> is tapped.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_account_select"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_account_select</code> <span class="evmeta">Screen: Earn · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps a row in the account sheet, including the row of the account already selected (the account then does not change).</dd><dt>When it is sent</dt><dd>When the customer taps a row in the account picker.</dd><dt>Location</dt><dd>The account picker (bottom sheet) on Earn.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows whether customers switch account, and whether they pick an account that does not earn coins by mistake.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>eligible</code></td><td>string</td><td><code>true</code></td><td>Whether the chosen account earns coins: <code>true</code> or <code>false</code>.</td><td>The field <code>accounts[].eligible</code> of the trading task API.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_tier_badge_click"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_tier_badge_click</code> <span class="evmeta">Screen: Home, Coins · Since: Handoff 6</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps the account tier label (Micro, Standard, VIP, Platinum) on the balance card to go to Earn, which scrolls to the account field. On Home the label sits next to "Coin Balance"; on Coins it hangs on the top edge of the balance card.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The balance card on Home and on Coins. The label shows only when the account chosen for the session earns coins and is on one of the 4 tiers (the customer has a trading task, the programme has not ended; never for guests). The chosen account: the one the customer picked on Earn; if none, the eligible account on the highest tier.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Whether customers care about their account tier, and whether the label on Home and Coins brings them to Earn.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, function <code>balanceBlock</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">The tier shown on the label:</div><div class="val"><code>micro</code>, <code>standard</code>, <code>vip</code>, <code>platinum</code> = meaning as on <code>loyalty_upgrade_open</code></div></td><td>From the MT5 group of the account chosen for the session.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_upgrade_row_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_upgrade_row_view</code> <span class="evmeta">Screen: Earn · Since: Handoff 6</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer sees the upgrade row under the account field. The row shows only when the selected account earns coins (Eligible), is on one of the 4 tiers, and the programme has not ended.</dd><dt>When it is sent</dt><dd>When the row is drawn on the page (without waiting for the customer to scroll to it); sent once per page load for each tier (the row changes with the selected account).</dd><dt>Location</dt><dd>The upgrade row under the account field on Earn.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Denominator of <code>loyalty_upgrade_open</code>: how many customers who see the upgrade invitation tap it.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>trackView()</code> in the code, in <code>pages/trading-task.js</code>, function <code>upgradeRow</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tier</code></td><td>string</td><td><code>vip</code></td><td>The current tier of the selected account (<code>micro</code>, <code>standard</code>, <code>vip</code>, <code>platinum</code>; meaning as on <code>loyalty_upgrade_open</code>).</td><td>From the account's MT5 group.</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>platinum</code></td><td><div class="vtext">The next tier:</div><div class="val"><code>standard</code>, <code>vip</code> or <code>platinum</code> = meaning as on <code>tier</code></div><div class="val"><code>none</code> = the account is already Platinum, with no higher tier</div></td><td>The tier after it on the four-tier ladder.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_upgrade_open"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_upgrade_open</code> <span class="evmeta">Screen: Earn · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps the "Want more coins per lot?" row under the account field to open the account tier sheet.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The upgrade row under the account field on Earn (also the "Platinum: our highest rates" row when the account is already on the top tier).</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Top of the upgrade funnel: how many customers look at the next tier, then how many tap <code>Deposit now</code> in the sheet.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tier</code></td><td>string</td><td><code>standard</code></td><td><div class="vtext">The current tier of the selected account, set by the account's MT5 group:</div><div class="val"><code>micro</code> = the lowest tier (<code>Direct\Mini400</code>)</div><div class="val"><code>standard</code> = tier 2 (<code>Direct\Mini10</code>; deposit needed to reach it: 200 USD)</div><div class="val"><code>vip</code> = tier 3 (<code>Direct\VIP1</code>; 1,000 USD)</div><div class="val"><code>platinum</code> = the highest tier (<code>Direct\MIVIP</code>; 5,000 USD)</div></td><td>From the account's MT5 group (the <code>accounts[].group</code> field of the trading task API).</td></tr><tr><td><code>next_tier</code></td><td>string</td><td><code>vip</code></td><td><div class="vtext">The next tier:</div><div class="val"><code>standard</code>, <code>vip</code> or <code>platinum</code> = meaning as on <code>tier</code></div><div class="val"><code>none</code> = the account is already Platinum, with no higher tier</div></td><td>The tier after the current one on the four-tier ladder.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_terms_open"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_terms_open</code> <span class="evmeta">Screen: Earn · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer opens the Terms &amp; Conditions.</dd><dt>When it is sent</dt><dd>When the customer taps the <code>Terms &amp; Conditions</code> button.</dd><dt>Location</dt><dd>At the end of the rules, the How it works tab on Earn (guests: the How it works card, with no tabs). Only when the programme has a terms link.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows how many customers read the terms.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_daily_cap_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_daily_cap_view</code> <span class="evmeta">Screen: Earn · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer sees the message that today's maximum coins have been reached.</dd><dt>When it is sent</dt><dd>When the page draws the notice (whether the customer scrolls to it is not measured); sent once per page load.</dd><dt>Location</dt><dd>The Today card on Earn.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows whether reaching the maximum makes customers stop trading.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>trackView()</code> in the code, in <code>pages/trading-task.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-3">D. Guided tour</h3><p>Answers the question: do customers finish the tour, and at which step do they leave it?</p><div class="scroll evblock" id="ev-loyalty_tour_start"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_tour_start</code> <span class="evmeta">Screen: Home · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The guided tour starts from its first step.</dd><dt>When it is sent</dt><dd>When the tour opens by itself the first time the customer opens Home on this device (remembered per device, not per account), or when the customer taps the help button (question mark) on Home.</dd><dt>Location</dt><dd>Trang Home.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Number of customers who start the tour, broken down by how it was opened.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> in the code, in <code>shared/tour.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>trigger</code></td><td>string</td><td><code>auto</code></td><td><div class="vtext">How the tour was opened:</div><div class="val"><code>auto</code> = opened by itself on the first visit to Home</div><div class="val"><code>help_button</code> = the customer tapped the help button</div></td><td>Determined in the code when the tour starts.</td></tr><tr><td><code>step_count</code></td><td>string</td><td><code>5</code></td><td>Number of steps in this tour run: <code>5</code>; <code>4</code> for guests (no step 5) or customers without a trading task (no step 2); <code>3</code> when both.</td><td>Number of tour steps for this customer.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_tour_step_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_tour_step_view</code> <span class="evmeta">Screen: Home, Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>A step of the tour is shown.</dd><dt>When it is sent</dt><dd>When that step's window appears; each step is sent once per page load. The tour moves between Home and Coins with a new page load, so tapping <code>Back</code> from step 3 back to step 2 sends step 2 again.</dd><dt>Location</dt><dd>Steps 1 and 2 on Home; steps 3, 4, 5 on Coins. Customers without a trading task have no step 2. Customers who are not signed in have no step 5: their tour has 4 steps.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Shows at which step customers leave the tour.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>trackView()</code> in the code, in <code>shared/tour.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tour_step</code></td><td>string</td><td><code>3</code></td><td><div class="vtext">Renamed from <code>step</code>. The step's id, not its place on screen:</div><div class="val"><code>1</code> = the "Welcome to HSB Loyalty" greeting (Home)</div><div class="val"><code>2</code> = "Earn coins when you trade", the coin rules (Home; skipped without a trading task)</div><div class="val"><code>3</code> = "Coins added to your balance", the balance card (Coins)</div><div class="val"><code>4</code> = "Redeem gifts with coins", the Redeem button (Coins)</div><div class="val"><code>5</code> = "Manage your coins", the tabs (Coins; skipped for guests)</div></td><td>Id of the step in the code.</td></tr><tr><td><code>step_count</code></td><td>string</td><td><code>5</code></td><td>Number of steps in this tour run: <code>5</code>; <code>4</code> for guests (no step 5) or customers without a trading task (no step 2); <code>3</code> when both.</td><td>Number of tour steps for this customer.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_tour_skip"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_tour_skip</code> <span class="evmeta">Screen: Home, Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer skips the tour part-way through.</dd><dt>When it is sent</dt><dd>When the customer taps <code>Skip tour</code>.</dd><dt>Location</dt><dd>The tour pop-up.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Skip rate of the tour, and the step skipped.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> in the code, in <code>shared/tour.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tour_step</code></td><td>string</td><td><code>2</code></td><td>Renamed from <code>step</code>. The step the customer was on when tapping skip (the step's id, meaning as on <code>loyalty_tour_step_view</code>). Never the last step, which has no <code>Skip tour</code> button.</td><td>Id of the step on screen.</td></tr><tr><td><code>step_count</code></td><td>string</td><td><code>5</code></td><td>Number of steps in this tour run: <code>5</code>; <code>4</code> for guests (no step 5) or customers without a trading task (no step 2); <code>3</code> when both.</td><td>Number of tour steps for this customer.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_tour_finish"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_tour_finish</code> <span class="evmeta">Screen: Coins · Since: Handoff 2</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer reaches the end of the tour.</dd><dt>When it is sent</dt><dd>When the customer taps <code>Finish tour</code> on the last step.</dd><dt>Location</dt><dd>The tour pop-up, last step on Coins.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Completion rate of the tour.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>A call to <code>track()</code> in the code, in <code>shared/tour.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>tour_step</code></td><td>string</td><td><code>5</code></td><td>The id of the last step: <code>5</code>, or <code>4</code> for guests (meaning as on <code>loyalty_tour_step_view</code>).</td><td>Id of the step on screen.</td></tr><tr><td><code>step_count</code></td><td>string</td><td><code>5</code></td><td>Number of steps in this tour run: <code>5</code>; <code>4</code> for guests (no step 5) or customers without a trading task (no step 2); <code>3</code> when both.</td><td>Number of tour steps for this customer.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-4">E. Guests</h3><p>Answers the question: are customers who are not signed in drawn in by the rewards, and do they go on to sign up?</p><div class="scroll evblock" id="ev-loyalty_login_prompt_view"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_login_prompt_view</code> <span class="evmeta">Screen: Home, Coins, Reward Store · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>A customer who is not signed in sees the sign-up invitation sheet: the "Join to redeem rewards" sheet, or the "Checkout is coming soon" sheet with Sign up and Log in buttons when <code>Checkout</code> is tapped on the reward page.</dd><dt>When it is sent</dt><dd>Every time the sheet opens, after the event of the button just tapped. With the "Join to redeem rewards" sheet, <code>loyalty_join_card_view</code> (<code>source</code> = <code>redeem</code>) is sent at the same time; with Checkout, this event follows <code>loyalty_checkout_click</code> (<code>outcome</code> = <code>guest</code>): for each pair, count one or the other, never both added together.</dd><dt>Location</dt><dd>A bottom sheet, opened from <code>Redeem</code>, the balance card, a reward card, <code>Explore all rewards</code>, <code>Redemption history</code>, or <code>Checkout</code> on the reward page.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Denominator of the sign-up funnel: how many guests want to redeem.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>Called with <code>track()</code> in code, in <code>shared/components.js</code>, function <code>mountJoinSheet</code>; <code>pages/reward.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>from</code></td><td>string</td><td><code>reward</code></td><td><div class="vtext">The button that opened the sheet:</div><div class="val"><code>redeem</code> = the <code>Redeem</code> button on the balance card (Home, Coins)</div><div class="val"><code>balance</code> = the balance card on Home (guests only)</div><div class="val"><code>reward</code> = a reward card in the rewards grid on Home</div><div class="val"><code>explore</code> = the <code>Explore all rewards</code> button on Home</div><div class="val"><code>history</code> = the <code>Redemption history</code> link on Coins (guests only)</div><div class="val"><code>checkout</code> = the <code>Checkout</code> button on the Reward Store reward page</div></td><td>Fixed on each button.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a </td><td>The <code>category</code> field of the rewards list API; <code>none</code> is sent when it is missing or empty.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><h3 id="grp-5">F. Redemption history</h3><p>Answers the question: do customers come back to check their reward orders and get their codes?</p><div class="scroll evblock" id="ev-loyalty_orders_open"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_orders_open</code> <span class="evmeta">Screen: Coins · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps the <code>Redemption history</code> link under the <code>Redeem</code> button to see their reward orders. For guests, the link opens the sign-up invitation sheet; the event is still sent.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The balance card on Coins.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>How many customers come back to check their reward orders.</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>shared/components.js</code>, function <code>balanceBlock</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td colspan="5" class="none">No properties of its own.</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>.</td></tr></table></div><div class="scroll evblock" id="ev-loyalty_order_open"><table class="events"><colgroup><col style="width:17%"><col style="width:9%"><col style="width:13%"><col style="width:33%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_order_open</code> <span class="evmeta">Screen: Redemption history · Since: Handoff 5</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Meaning</dt><dd>The customer taps an order in the list to see its details.</dd><dt>When it is sent</dt><dd>When the customer taps.</dd><dt>Location</dt><dd>The order list on the Redemption history page.</dd><dt>Platform</dt><dd>Webview inside the iOS and Android app</dd><dt>What it is used for</dt><dd>Which order statuses get viewed most (for example, whether customers keep checking orders in process).</dd><dt>Status</dt><dd><span class="st st-wip">In progress</span></dd><dt>How it is attached</dt><dd>The <code>data-track</code> attribute on the button, in <code>pages/redemptions.js</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How the value is obtained</th></tr><tr><td><code>status</code></td><td>string</td><td><code>completed</code></td><td><div class="vtext">Status of the order:</div><div class="val"><code>new</code> = Order placed (placed, not processed yet)</div><div class="val"><code>on process</code> = Processing (being processed)</div><div class="val"><code>completed</code> = Completed (reward or code delivered)</div><div class="val"><code>canceled</code> = Cancelled (order cancelled)</div><div class="val"><code>failed</code> = Failed (unsuccessful; per the backend, the coins of a failed order are returned to the balance, see spec §50, the line "a failed order is refunded")</div><div class="vtext">Any other value the backend sends is passed on as is.</div></td><td>The <code>status</code> field of the order list API (<code>/loyalty/orders</code>).</td></tr><tr><td colspan="5" class="none">Also sent: the 11 common properties, see the tab <a href="#common" class="ref">3. How events are sent, section 3.2</a>
